<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizSila 🎨 Aprenda Brincando</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fontes: Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Fundo Animado Infantil */
        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #e0c3fc);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Botões Estilo 3D de Brinquedo */
        .btn-3d {
            transition: all 0.15s ease;
            box-shadow: 0px 6px 0px rgba(0, 0, 0, 0.2);
        }
        .btn-3d:active {
            transform: translateY(4px) !important;
            box-shadow: 0px 2px 0px rgba(0, 0, 0, 0.2) !important;
        }

        /* Efeito de Gelatina Brilhante (Glossy Geli) para as Alternativas */
        .btn-geli {
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), inset 0 3px 6px rgba(255, 255, 255, 0.6), inset 0 -4px 6px rgba(0, 0, 0, 0.2);
        }
        .btn-geli::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
            border-radius: 1rem 1rem 0 0;
            pointer-events: none;
        }
        .btn-geli:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 2px 3px rgba(255, 255, 255, 0.4);
        }

        /* Botão Iniciar Pulsante Gigante */
        @keyframes pulse-start {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 10px 0 #d97706; }
            50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(255, 215, 0, 1), 0 12px 0 #b45309; }
        }
        .btn-start-anim {
            animation: pulse-start 2s infinite ease-in-out;
        }

        /* Animação Flutuante */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        /* Shake de Erro */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Pop de Acerto */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.3s ease-in-out;
        }

        /* Alternância dinâmica de cores do espaço que falta texto */
        @keyframes colorShiftSlot {
            0% { color: #ef4444; border-bottom-color: #ef4444; }
            25% { color: #f59e0b; border-bottom-color: #f59e0b; }
            50% { color: #10b981; border-bottom-color: #10b981; }
            75% { color: #3b82f6; border-bottom-color: #3b82f6; }
            100% { color: #8b5cf6; border-bottom-color: #8b5cf6; }
        }
        .missing-slot-anim {
            animation: colorShiftSlot 2.5s infinite linear;
        }

        /* Canvas Confetes */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-gray-800 antialiased p-1 sm:p-3 justify-between">

    <canvas id="confetti-canvas"></canvas>

    <!-- 1. TELA DE BOAS-VINDAS -->

        </div>

        <button id="start-game-btn" class="btn-start-anim bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 text-yellow-950 font-black text-4xl sm:text-6xl px-12 py-6 sm:px-16 sm:py-8 rounded-full border-8 border-white cursor-pointer transition transform active:scale-95">
            INICIAR ▶

    </div>

            <span class="hidden sm:inline">Menu</span>
        </button>

        <div class="flex items-center gap-2 flex-1 max-w-xs mx-2">

                <div id="progress-bar" class="bg-gradient-to-r from-green-400 to-emerald-500 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2">
            <button id="fullscreen-btn" class="bg-purple-100 border border-purple-300 text-purple-800 p-1.5 rounded-full hover:bg-purple-200 transition cursor-pointer text-base sm:text-lg shadow" title="Tela Cheia">

            <div class="flex items-center gap-1 bg-amber-100 border border-amber-300 px-2.5 py-0.5 rounded-full shadow">
                <span class="text-base sm:text-lg">⭐</span>
                <span id="score-count" class="font-black text-amber-800 text-base sm:text-lg">0</span>

            <button id="tts-toggle" class="bg-blue-100 border border-blue-300 text-blue-600 p-1.5 rounded-full hover:bg-blue-200 transition cursor-pointer text-base sm:text-lg shadow" title="Voz do Jogo">
                🔊
            </button>
        </div>
    </header>

    <!-- 3. CONTEÚDO PRINCIPAL DO JOGO -->
    <main id="game-main" class="hidden max-w-5xl w-full mx-auto flex-1 flex flex-col justify-between items-center h-full">

        <!-- TELA DE SELEÇÃO DE MODOS -->
        <section id="menu-screen" class="w-full flex-1 flex flex-col items-center justify-center my-auto py-2 w-full h-full">

                    <h3 class="text-xl sm:text-2xl font-black text-white drop-shadow mb-1">Dígrafos & Complexas</h3>

                </button>

                <!-- Modo 4: Sons Nasais & Terminações -->

                    <h3 class="text-xl sm:text-2xl font-black text-white drop-shadow mb-1">Nasais & Terminações</h3>
                    <span class="bg-white/30 text-xs sm:text-sm font-bold px-3 py-1 rounded-full text-teal-50">An, ÃO, Az, Ar...</span>
                </button>
            </div>
        </section>

        <!-- TELA DO QUIZ -->
        <section id="quiz-screen" class="hidden w-full flex-1 flex flex-col justify-between items-center px-1 pb-1">
            <div id="question-card" class="w-full flex-1 flex flex-col items-center justify-center text-center relative p-1 bg-transparent my-auto">

                </div>

            <div id="options-grid" class="grid grid-cols-2 gap-3 w-full px-1 mb-1">

            </div>

            <h2 class="text-3xl font-black text-purple-800 mb-1">INCRÍVEL! 🎉</h2>
            <p class="text-gray-600 font-bold mb-4 text-sm sm:text-base">Você mandou super bem!</p>
            
            <div class="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-3 w-full mb-5 flex justify-around items-center">
                <div class="text-center">
                    <span class="text-xs font-bold text-gray-400 block uppercase">Estrelas</span>
                    <span id="final-stars" class="text-2xl font-black text-amber-500">⭐ 0</span>
                </div>
            </div>

            <button id="back-to-menu-btn" class="w-full bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-black py-3.5 rounded-2xl text-lg border-2 border-white shadow-lg btn-3d cursor-pointer">
                VOLTAR AO INÍCIO 🚀
            </button>
        </section>

    </main>

    <script>

        /* ==========================================================================

            'QUA': 'Kuá', 'QUE': 'Kê', 'QUI': 'Kí', 'QUO': 'Kuó',

            'AX': 'Acs', 'EX': 'Ecs', 'IX': 'Ics', 'OX': 'Ocs', 'UX': 'Ucs'
        };

        function formatForSpeech(text) {
            let cleanText = text.toUpperCase().trim();
            if (SPEECH_MAP[cleanText]) {
                return SPEECH_MAP[cleanText];
            }
            return cleanText;
        }

           ========================================================================== */

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSuccessSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playErrorSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.25);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        function speakText(text, callback = null) {
            if (!ttsEnabled || !('speechSynthesis' in window)) {
                if (callback) callback();
                return;
            }

            window.speechSynthesis.cancel();
            
            // Aplica o mapeamento fonético para que sílabas e dígrafos sejam lidos perfeitamente
            const phoneticText = formatForSpeech(text);
            const utterance = new SpeechSynthesisUtterance(phoneticText);
            
            utterance.lang = 'pt-BR';
            utterance.rate = 0.85; // Levemente mais pausado para clareza pedagógica infantil
            utterance.pitch = 1.1;

            utterance.onend = () => { if (callback) callback(); };
            utterance.onerror = () => { if (callback) callback(); };

            window.speechSynthesis.speak(utterance);
        }

        /* ==========================================================================
           5. GERENCIAMENTO DE TELA CHEIA (FULLSCREEN)
           ========================================================================== */
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen().catch(() => {});
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        /* ==========================================================================
           6. CONTROLADOR DE TELAS E NAVEGAÇÃO
           ========================================================================== */
        const startScreen = document.getElementById('start-screen');
        const gameHeader = document.getElementById('game-header');
        const gameMain = document.getElementById('game-main');
        const menuScreen = document.getElementById('menu-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const victoryScreen = document.getElementById('victory-screen');

        document.getElementById('start-game-btn').addEventListener('click', () => {
            initAudio();
            toggleFullscreen();
            
            startScreen.classList.add('hidden');
            gameHeader.classList.remove('hidden');
            gameMain.classList.remove('hidden');
            
            showMenu();
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            initAudio();
            toggleFullscreen();
        });

        document.getElementById('home-btn').addEventListener('click', () => {
            initAudio();
            showMenu();
        });

        document.getElementById('back-to-menu-btn').addEventListener('click', () => {
            initAudio();
            showMenu();
        });

        function showMenu() {
            window.speechSynthesis.cancel();
            menuScreen.classList.remove('hidden');
            quizScreen.classList.add('hidden');
            victoryScreen.classList.add('hidden');
        }

        document.getElementById('mode-letras-btn').addEventListener('click', () => startGame('letras'));
        document.getElementById('mode-familias-btn').addEventListener('click', () => startGame('familias'));
        document.getElementById('mode-especiais-btn').addEventListener('click', () => startGame('especiais'));
        document.getElementById('mode-nasais-btn').addEventListener('click', () => startGame('nasais'));

        function startGame(mode) {
            initAudio();
            currentMode = mode;
            currentQuestionIndex = 0;
            
            menuScreen.classList.add('hidden');
            victoryScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        /* ==========================================================================
           7. LÓGICA DAS PERGUNTAS E INTERAÇÃO
           ========================================================================== */
        function loadQuestion() {
            isProcessingChoice = false;
            const list = QUIZ_DATA[currentMode];
            
            if (currentQuestionIndex >= list.length) {
                showVictory();
                return;
            }

            const q = list[currentQuestionIndex];
            currentQuestionData = q;

            const percent = (currentQuestionIndex / list.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';

            document.getElementById('word-emoji').innerText = q.emoji || '⭐';
            const wordDisplayEl = document.getElementById('word-display');
            const optionsGrid = document.getElementById('options-grid');

            wordDisplayEl.innerHTML = '';
            
            q.displayWord.forEach(part => {
                const box = document.createElement('span');
                if (part === '__') {
                    box.id = 'missing-slot';
                    box.className = 'missing-slot-anim border-b-4 sm:border-b-8 px-0.5 mx-0.5 transition-all duration-300 inline-block text-center';
                    box.innerText = '__';
                } else {
                    box.className = 'inline-block px-0.5';
                    box.innerText = part;
                }
                wordDisplayEl.appendChild(box);
            });

            document.getElementById('speak-word-btn').onclick = () => speakText(q.word);
            speakText(q.word);

            optionsGrid.innerHTML = '';
            const options = [...q.options].sort(() => Math.random() - 0.5);

            const geliColors = [
                'from-pink-400 to-rose-600 border-pink-300 text-white',
                'from-amber-400 to-orange-600 border-amber-300 text-white',
                'from-cyan-400 to-blue-600 border-cyan-300 text-white',
                'from-emerald-400 to-teal-600 border-emerald-300 text-white'
            ];

            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                const colorClass = geliColors[index % geliColors.length];
                
                let fontSizeClass = 'text-5xl sm:text-7xl';
                if (opt.length > 3) {
                    fontSizeClass = 'text-3xl sm:text-5xl';
                } else if (opt.length > 2) {
                    fontSizeClass = 'text-4xl sm:text-6xl';
                }

                btn.className = `bg-gradient-to-b ${colorClass} border-4 rounded-3xl btn-geli cursor-pointer flex items-center justify-center shadow-lg w-full aspect-square p-2`;
                btn.innerHTML = `<span class="opt-text font-black ${fontSizeClass} drop-shadow-lg text-center leading-none">${opt}</span>`;

                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (!isProcessingChoice) {
                        handleOptionClick(opt, q, btn);
                    }
                });

                optionsGrid.appendChild(btn);
            });
        }

        function handleOptionClick(selectedOpt, questionData, buttonEl) {
            isProcessingChoice = true;
            initAudio();

            const textSpan = buttonEl.querySelector('.opt-text');
            const missingSlot = document.getElementById('missing-slot');

            let soundToSpeak = selectedOpt;
            if (selectedOpt === questionData.missing && questionData.speakMissing) {
                soundToSpeak = questionData.speakMissing;
            }

            textSpan.style.visibility = 'hidden';
            
            missingSlot.classList.remove('missing-slot-anim', 'border-b-4', 'border-b-8');
            missingSlot.classList.add('text-green-600', 'animate-pop');
            missingSlot.innerText = selectedOpt;

            speakText(soundToSpeak, () => {
                if (selectedOpt === questionData.missing) {
                    playSuccessSound();
                    triggerConfetti();

                    buttonEl.className = 'bg-gradient-to-b from-green-400 to-emerald-600 border-4 border-green-200 text-white rounded-3xl btn-geli cursor-pointer flex items-center justify-center shadow-lg w-full aspect-square p-2';

                    score += 10;
                    document.getElementById('score-count').innerText = score;

                    speakText(questionData.word, () => {
                        setTimeout(() => {
                            document.getElementById('word-display').innerHTML = `
                                <span class="text-6xl sm:text-8xl font-black text-emerald-500 drop-shadow-[0_5px_5px_rgba(0,0,0,0.3)] animate-pop tracking-wider">
                                    ${questionData.word}
                                </span>
                            `;

                            setTimeout(() => {
                                currentQuestionIndex++;
                                loadQuestion();
                            }, 1200);
                        }, 200);
                    });

                } else {
                    playErrorSound();
                    buttonEl.classList.add('animate-shake');

                    setTimeout(() => {
                        missingSlot.innerText = '__';
                        missingSlot.classList.remove('text-green-600', 'animate-pop');
                        missingSlot.classList.add('missing-slot-anim', 'border-b-4', 'border-b-8');

                        textSpan.style.visibility = 'visible';
                        buttonEl.classList.remove('animate-shake');
                        isProcessingChoice = false;
                    }, 500);
                }
            });
        }

        function showVictory() {
            playSuccessSound();
            triggerConfetti();
            
            quizScreen.classList.add('hidden');
            victoryScreen.classList.remove('hidden');

            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('final-stars').innerText = `⭐ ${score}`;

            speakText('Parabéns! Você completou os desafios!');
        }

        /* ==========================================================================
           8. TOGGLE TTS & EFEITO DE CONFETES
           ========================================================================== */
        const ttsToggleBtn = document.getElementById('tts-toggle');
        ttsToggleBtn.addEventListener('click', () => {
            ttsEnabled = !ttsEnabled;
            if (ttsEnabled) {
                ttsToggleBtn.innerText = '🔊';
                ttsToggleBtn.classList.remove('bg-gray-200', 'text-gray-500');
                ttsToggleBtn.classList.add('bg-blue-100', 'text-blue-600');
                speakText('Voz ligada!');
            } else {
                window.speechSynthesis.cancel();
                ttsToggleBtn.innerText = '🔇';
                ttsToggleBtn.classList.remove('bg-blue-100', 'text-blue-600');
                ttsToggleBtn.classList.add('bg-gray-200', 'text-gray-500');
            }
        });

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.3;
                        p.life -= 2;

                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animateConfetti();
        }
    </script>
