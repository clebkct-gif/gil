    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap');
    
    * {
      font-family: 'Quicksand', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
    }

    .btn-jelly {
      position: relative;
      border-radius: 1.5rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background 0.2s ease;
      overflow: hidden;
    }

    .btn-jelly::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 10px;
      right: 10px;
      height: 40%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
      border-radius: 9999px;
      pointer-events: none;
    }

    .btn-jelly:active {
      transform: scale(0.88) translateY(2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.3);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .highlight-syllable {
      color: #fbbf24;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    @keyframes confetefly {
      0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
      30% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(540deg); opacity: 0; }
    }
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 32px;
      animation: confetefly 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      z-index: 999;
    }
  </style>
</head>

    function startApp() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(() => {});
      }
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      document.getElementById('app-container').classList.add('flex');
      render();
    }

    function triggerConfetti(event, btnElement) {
      const rect = btnElement.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      const symbols = ['⭐', '✨', '🎈', '💖', '🌟', '🎨', '🍬'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 120;
        p.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }
    }

    function say(text, exampleWord = "") {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      let phoneticText = PHONETIC_MAP[text.toUpperCase()] || text;
      let finalText = exampleWord ? `${phoneticText}, ${exampleWord}` : phoneticText;

      let utterance = new SpeechSynthesisUtterance(finalText);
      utterance.lang = "pt-BR";
      utterance.rate = 0.80;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function formatWordWithHighlight(word, syllable) {
      if (!syllable) return word;
      const lowerWord = word.toLowerCase();
      const lowerSyl = syllable.toLowerCase();
      const idx = lowerWord.indexOf(lowerSyl);
      
      if (idx !== -1) {
        const start = word.slice(0, idx);
        const match = word.slice(idx, idx + syllable.length);
        const end = word.slice(idx + syllable.length);
        return `${start.toUpperCase()}<span class="highlight-syllable">${match.toUpperCase()}</span>${end.toUpperCase()}`;
      }
      return word.toUpperCase();
    }

      btn.onclick = (e) => {
        document.querySelectorAll(".nav-btn").forEach(b => {
          b.className = "nav-btn btn-jelly bg-slate-800 text-slate-300 rounded-2xl py-2.5 px-1 font-bold text-xs sm:text-sm flex flex-col items-center justify-center border border-slate-700/50 cursor-pointer";
        });
        btn.className = "nav-btn active btn-jelly bg-pink-500 text-white rounded-2xl py-2.5 px-1 font-bold text-xs sm:text-sm flex flex-col items-center justify-center border border-pink-300/40 cursor-pointer";
        setPage(btn.dataset.page);
      };
    });

    function render() {
      const scrollContent = document.getElementById("scroll-content");
      scrollContent.innerHTML = "";

      if (page === "letras" || page === "nasais") {
        let currentItems = (page === "letras") ? ALPHABET : NASAIS;
        
        let html = `<div class="grid grid-cols-4 sm:grid-cols-6 gap-2 w-full p-1">`;
        currentItems.forEach((item, i) => {
          const stateKey = `${page}-0-${i}`;
          if (!itemStates[stateKey]) {
            itemStates[stateKey] = { isLower: false, clicked: false };
          }
          const st = itemStates[stateKey];
          const colorClass = st.clicked ? 'bg-zinc-900 border-zinc-700 text-white shadow-inner' : FAMILY_COLORS[i % FAMILY_COLORS.length];
          let displayText = st.isLower ? item[0].toLowerCase() : item[0];
          const isSelected = (activeGroupIndex === 0 && activeItemIndex === i);

          html += `
            <button class="card-phono btn-jelly ${colorClass} border h-24 flex items-center justify-center cursor-pointer ${isSelected ? 'ring-4 ring-amber-400/80 scale-95' : ''}" data-g="0" data-i="${i}">
              <span class="text-5xl sm:text-6xl font-bold drop-shadow-md leading-none">${displayText}</span>
            </button>
          `;
        });
        html += `</div>`;
        scrollContent.innerHTML = html;

        scrollContent.querySelectorAll(".card-phono").forEach(btn => {
          btn.onclick = (e) => {
            triggerConfetti(e, btn);
            const g = +btn.dataset.g;
            const i = +btn.dataset.i;
            activeGroupIndex = g;
            activeItemIndex = i;

            const stateKey = `${page}-${g}-${i}`;
            if (itemStates[stateKey].clicked && itemStates[stateKey].isLower) {
              itemStates[stateKey].clicked = false;
              itemStates[stateKey].isLower = false;
            } else if (itemStates[stateKey].clicked) {
              itemStates[stateKey].isLower = true;
            } else {
              itemStates[stateKey].clicked = true;
              itemStates[stateKey].isLower = false;
            }
            
            render();
            say(currentItems[i][0]);
          };
        });

      } else {
        let groupList = (page === "familias") ? FAMILIAS : ((page === "digrafos") ? DIGRAFOS : ENCONTROS);

        let html = `<div class="space-y-2 w-full p-1">`;
        groupList.forEach((group, gIdx) => {
          const items = group[1];
          const groupColor = FAMILY_COLORS[gIdx % FAMILY_COLORS.length];

          html += `<div class="grid grid-cols-5 gap-2 w-full">`;

          items.forEach((item, iIdx) => {
            const stateKey = `${page}-${gIdx}-${iIdx}`;
            if (!itemStates[stateKey]) {
              itemStates[stateKey] = { isLower: false, clicked: false };
            }
            const st = itemStates[stateKey];
            const colorClass = st.clicked ? 'bg-zinc-900 border-zinc-700 text-white shadow-inner' : groupColor;
            let displayText = st.isLower ? item[0].toLowerCase() : item[0];
            const isSelected = (activeGroupIndex === gIdx && activeItemIndex === iIdx);

            html += `
              <button class="card-phono btn-jelly ${colorClass} border h-20 sm:h-24 flex items-center justify-center cursor-pointer ${isSelected ? 'ring-4 ring-amber-400/80 scale-95' : ''}" data-g="${gIdx}" data-i="${iIdx}">
                <span class="text-4xl sm:text-5xl font-bold drop-shadow-md leading-none">${displayText}</span>
              </button>
            `;
          });

          html += `</div>`;
        });
        html += `</div>`;
        scrollContent.innerHTML = html;

        scrollContent.querySelectorAll(".card-phono").forEach(btn => {
          btn.onclick = (e) => {
            triggerConfetti(e, btn);
            const g = +btn.dataset.g;
            const i = +btn.dataset.i;
            activeGroupIndex = g;
            activeItemIndex = i;

            const stateKey = `${page}-${g}-${i}`;
            if (itemStates[stateKey].clicked && itemStates[stateKey].isLower) {
              itemStates[stateKey].clicked = false;
              itemStates[stateKey].isLower = false;
            } else if (itemStates[stateKey].clicked) {
              itemStates[stateKey].isLower = true;
            } else {
              itemStates[stateKey].clicked = true;
              itemStates[stateKey].isLower = false;
            }

            render();
            say(groupList[g][1][i][0]);
          };
        });
      }

      // PAINEL HERO INFERIOR
      const heroSlot = document.getElementById("hero-slot");
      let activeItem = null;

      if (page === "letras") activeItem = ALPHABET[activeItemIndex];
      else if (page === "nasais") activeItem = NASAIS[activeItemIndex];
      else if (page === "familias") activeItem = FAMILIAS[activeGroupIndex]?.[1]?.[activeItemIndex];
      else if (page === "digrafos") activeItem = DIGRAFOS[activeGroupIndex]?.[1]?.[activeItemIndex];
      else if (page === "encontros") activeItem = ENCONTROS[activeGroupIndex]?.[1]?.[activeItemIndex];

      if (activeItem) {
        const highlightedWordHtml = formatWordWithHighlight(activeItem[1], activeItem[0]);
        heroSlot.innerHTML = `
          <button onclick="say('${activeItem[0]}', '${activeItem[1]}')" class="w-full btn-jelly bg-gradient-to-r from-indigo-900 via-purple-900 to-indigo-950 text-white rounded-3xl p-3.5 flex items-center justify-around border border-amber-400/40 shadow-xl cursor-pointer">
            <span class="text-6xl sm:text-7xl leading-none drop-shadow-md">${activeItem[2]}</span>
            <div class="flex flex-col items-center">
              <span class="text-4xl sm:text-5xl font-bold text-amber-300 leading-none drop-shadow">${activeItem[0]}</span>
              <span class="text-2xl sm:text-3xl font-bold tracking-wide mt-1">${highlightedWordHtml}</span>
            </div>
            <div class="w-6"></div>
          </button>
        `;
      } else {
        heroSlot.innerHTML = "";
      }
    }
  </script>
</body>
</html>
