<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alfabeto Mágico - Aprenda Cursiva e Bastão</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playwrite BR Guides, Schoolbell e fontes cursivas pontilhadas/escolares -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@700&family=Fredoka:wght@400;600;700&family=Gloria+Hallelujah&family=Handlee&family=Homemade+Apple&family=Kalam:wght@700&family=Playwrite+BR+Guides&family=Schoolbell&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        playwrite: ['"Playwrite BR Guides"', 'cursive', 'sans-serif'],
                        escolar: ['Schoolbell', 'cursive', 'sans-serif'],
                        caveat: ['Caveat', 'cursive', 'sans-serif'],
                        kalam: ['Kalam', 'cursive', 'sans-serif'],
                        architects: ['"Architects Daughter"', 'cursive', 'sans-serif'],
                        handlee: ['Handlee', 'cursive', 'sans-serif'],
                        gloria: ['"Gloria Hallelujah"', 'cursive', 'sans-serif'],
                        homemade: ['"Homemade Apple"', 'cursive', 'sans-serif']
                    },
                    colors: {
                        magical: {
                            pink: '#FF6B9B',
                            yellow: '#FFD166',
                            green: '#06D6A0',
                            blue: '#118AB2',
                            purple: '#8338EC',
                            orange: '#FF9F1C'
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'wiggle': 'wiggle 0.5s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s infinite'
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 10px rgba(255, 209, 102, 0.8))' },
                            '50%': { filter: 'drop-shadow(0 0 22px rgba(255, 107, 155, 0.9))' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Estilização para o caderno de caligrafia */
        .calligraphy-paper {
            background-color: #fffdfa;
            background-image: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(#60a5fa 1px, transparent 1px),
                linear-gradient(#f43f5e 1px, transparent 1px),
                linear-gradient(#60a5fa 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            background-position: 0 10%, 0 30%, 0 60%, 0 85%;
        }

        /* Efeito visual de fonte pontilhada limpa para rastreio */
        .dotted-guide-font {
            color: transparent;
            -webkit-text-stroke: 2px #64748b;
            text-shadow: 
                2px 0 0 #cbd5e1,
                4px 0 0 #cbd5e1;
        }

        .btn-magical {
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }
        .btn-magical:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 rgba(0,0,0,0.15);
        }

        .star-bg {
            position: absolute;
            pointer-events: none;
            animation: float 4s infinite ease-in-out;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }
    </style>
</head>

    <script>
        const ALPHABET = [
            { char: 'A', name: 'Á', word: 'Abelha', emoji: '🐝' },
            { char: 'B', name: 'Bê', word: 'Bola', emoji: '⚽' },
            { char: 'C', name: 'Cê', word: 'Casa', emoji: '🏠' },
            { char: 'D', name: 'Dê', word: 'Dado', emoji: '🎲' },
            { char: 'E', name: 'É', word: 'Elefante', emoji: '🐘' },
            { char: 'F', name: 'Efe', word: 'Foca', emoji: '🦭' },
            { char: 'G', name: 'Gê', word: 'Gato', emoji: '🐱' },
            { char: 'H', name: 'Agá', word: 'Hipopótamo', emoji: '🦛' },
            { char: 'I', name: 'Í', word: 'Igreja', emoji: '⛪' },
            { char: 'J', name: 'Jota', word: 'Jacaré', emoji: '🐊' },
            { char: 'K', name: 'Cá', word: 'Kiwi', emoji: '🥝' },
            { char: 'L', name: 'Ele', word: 'Leão', emoji: '🦁' },
            { char: 'M', name: 'Eme', word: 'Macaco', emoji: '🐒' },
            { char: 'N', name: 'Ene', word: 'Navio', emoji: '🚢' },
            { char: 'O', name: 'Ó', word: 'Ovelha', emoji: '🐑' },
            { char: 'P', name: 'Pê', word: 'Pato', emoji: '🦆' },
            { char: 'Q', name: 'Quê', word: 'Queijo', emoji: '🧀' },
            { char: 'R', name: 'Erre', word: 'Rato', emoji: '🖱️' },
            { char: 'S', name: 'Esse', word: 'Sapo', emoji: '🐸' },
            { char: 'T', name: 'Tê', word: 'Tubarão', emoji: '🦈' },
            { char: 'U', name: 'Ú', word: 'Urso', emoji: '🐻' },
            { char: 'V', name: 'Vê', word: 'Vaca', emoji: '🐄' },
            { char: 'W', name: 'Dábliu', word: 'Wafer', emoji: '🧇' },
            { char: 'X', name: 'Xís', word: 'Xícara', emoji: '☕' },
            { char: 'Y', name: 'Ipsilon', word: 'Yakisoba', emoji: '🍜' },
            { char: 'Z', name: 'Zê', word: 'Zebra', emoji: '🦓' }
        ];

        let currentLetterIdx = 0;
        
        const fontList = [
            { name: 'Playwrite BR', family: '"Playwrite BR Guides", cursive, sans-serif' },
            { name: 'Escolar', family: 'Schoolbell, cursive, sans-serif' },
            { name: 'Caveat', family: 'Caveat, cursive, sans-serif' },
            { name: 'Kalam', family: 'Kalam, cursive, sans-serif' },
            { name: 'Architects', family: '"Architects Daughter", cursive, sans-serif' },
            { name: 'Handlee', family: 'Handlee, cursive, sans-serif' },
            { name: 'Gloria', family: '"Gloria Hallelujah", cursive, sans-serif' },
            { name: 'Homemade', family: '"Homemade Apple", cursive, sans-serif' }
        ];
        let currentFontIndex = 0;

        let currentCase = 'upper';
        let currentBrushColor = '#8338EC';
        let starsCount = 0;

        let canvas, ctx;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let hue = 0;

        let quizTargetLetter = null;
        let identifyTargetItem = null;

        let currentQuizFontSize = '40px';
        let currentIdentifyFontSize = '40px';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function playSoundEffect(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function speakText(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                if (callback) {
                    utterance.onend = callback;
                }
                window.speechSynthesis.speak(utterance);
            } else if (callback) {
                callback();
            }
        }

        function speakWelcome() {
            speakText('Bem-vindo ao Alfabeto Mágico! Escolha um módulo para começar a aprender e se divertir.');
        }

        function speakCurrentLetter() {
            const item = ALPHABET[currentLetterIdx];
            speakText(`Letra ${item.name}. ${item.word}!`);
        }

        function showScreen(screenId) {
            playSoundEffect('pop');
            ['homeScreen', 'drawingScreen', 'audioQuizScreen', 'identifyScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');

            if (screenId === 'drawingScreen') {
                setTimeout(resizeCanvas, 50);
            }
        }

        function addStar() {
            starsCount++;
            document.getElementById('starCounter').innerText = starsCount;
            const counterEl = document.getElementById('starCounter').parentElement;
            counterEl.classList.add('scale-125');
            setTimeout(() => counterEl.classList.remove('scale-125'), 300);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }
        }

        function startDrawingModule() {
            showScreen('drawingScreen');
            updateLetterDisplay();
            speakCurrentLetter();
        }

        function initCanvas() {
            canvas = document.getElementById('drawCanvas');
            ctx = canvas.getContext('2d');

            canvas.onmousedown = null;
            canvas.onmousemove = null;
            canvas.onmouseup = null;
            canvas.onmouseleave = null;

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        }

        function resizeCanvas() {
            if (!canvas || !canvas.parentElement) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width || rect.width;
            tempCanvas.height = canvas.height || rect.height;
            const tempCtx = tempCanvas.getContext('2d');
            if (canvas.width > 0 && canvas.height > 0) {
                tempCtx.drawImage(canvas, 0, 0);
            }

            canvas.width = rect.width;
            canvas.height = rect.height;

            if (ctx) {
                ctx.drawImage(tempCanvas, 0, 0);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }
        }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const coords = getCanvasCoordinates(e);
            lastX = coords.x;
            lastY = coords.y;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            startDrawing(e);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            const coords = getCanvasCoordinates(e);

            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentBrushColor === 'rainbow') {
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                hue = (hue + 5) % 360;
            } else {
                ctx.strokeStyle = currentBrushColor;
            }

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.beginPath();
        }

        function clearCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            playSoundEffect('pop');
        }

        function setBrushColor(color) {
            currentBrushColor = color;
            playSoundEffect('pop');
        }

        function setLetterCase(letterCase) {
            currentCase = letterCase;
            document.getElementById('btnCaseUpper').className = letterCase === 'upper' ? 
                'px-2.5 py-1 rounded-lg bg-purple-600 text-white shadow-sm transition cursor-pointer' : 
                'px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer';
            
            document.getElementById('btnCaseLower').className = letterCase === 'lower' ? 
                'px-2.5 py-1 rounded-lg bg-purple-600 text-white shadow-sm transition cursor-pointer' : 
                'px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer';

            updateLetterDisplay();
        }

        function changeFontFromSelect(indexVal) {
            currentFontIndex = parseInt(indexVal);
            updateLetterDisplay();
            playSoundEffect('pop');
        }

        function updateFontSize(sizeValue) {
            const guideEl = document.getElementById('canvasGuideText');
            if (guideEl) {
                guideEl.style.fontSize = sizeValue + 'px';
            }
        }

        function updateQuizOptionsFontSize(sizeVal) {
            currentQuizFontSize = sizeVal + 'px';
            document.querySelectorAll('#quizOptionsContainer button').forEach(btn => {
                btn.style.fontSize = currentQuizFontSize;
            });
        }

        function updateIdentifyOptionsFontSize(sizeVal) {
            currentIdentifyFontSize = sizeVal + 'px';
            document.querySelectorAll('#identifyOptionsContainer button').forEach(btn => {
                btn.style.fontSize = currentIdentifyFontSize;
            });
        }

        function updateLetterDisplay() {
            const item = ALPHABET[currentLetterIdx];
            let displayChar = currentCase === 'upper' ? item.char : item.char.toLowerCase();

            const guideEl = document.getElementById('canvasGuideText');
            guideEl.innerText = displayChar;

            const selectedFont = fontList[currentFontIndex];
            guideEl.style.fontFamily = selectedFont.family;

            document.getElementById('letterDisplayInfo').innerText = `${item.char} ${item.char.toLowerCase()}`;
        }

        function nextLetter() {
            currentLetterIdx = (currentLetterIdx + 1) % ALPHABET.length;
            updateLetterDisplay();
            clearCanvas();
            speakCurrentLetter();
        }

        function prevLetter() {
            currentLetterIdx = (currentLetterIdx - 1 + ALPHABET.length) % ALPHABET.length;
            updateLetterDisplay();
            clearCanvas();
            speakCurrentLetter();
        }

        function completeDrawing() {
            playSoundEffect('success');
            triggerConfetti();
            addStar();
            speakText(`Parabéns! Você desenhou a letra ${ALPHABET[currentLetterIdx].name}!`);
        }

        function startAudioQuizModule() {
            showScreen('audioQuizScreen');
            document.getElementById('quizSliderContainer').style.display = 'flex';
            loadNextQuizQuestion();
        }

        function loadNextQuizQuestion() {
            document.getElementById('quizFeedback').innerText = '';
            document.getElementById('quizSliderContainer').style.display = 'flex';
            const correctIndex = Math.floor(Math.random() * ALPHABET.length);
            quizTargetLetter = ALPHABET[correctIndex];

            let options = [quizTargetLetter];
            while (options.length < 4) {
                const randItem = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
                if (!options.includes(randItem)) {
                    options.push(randItem);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('quizOptionsContainer');
            container.innerHTML = '';

            options.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'btn-magical bg-white hover:bg-yellow-50 text-purple-800 border-3 border-purple-300 rounded-2xl w-full h-full font-bold shadow-md hover:border-purple-500 transition flex items-center justify-center cursor-pointer';
                btn.style.fontSize = currentQuizFontSize;
                btn.innerText = item.char;
                btn.onclick = () => {
                    document.getElementById('quizSliderContainer').style.display = 'none';
                    checkQuizAnswer(item, btn);
                };
                container.appendChild(btn);
            });

            setTimeout(() => {
                playQuizAudio();
            }, 300);
        }

        function playQuizAudio() {
            if (quizTargetLetter) {
                speakText(`Letra ${quizTargetLetter.name}`, () => {
                    setTimeout(() => {
                        speakText(`Letra ${quizTargetLetter.name}`);
                    }, 600);
                });
            }
        }

        function checkQuizAnswer(selectedItem, buttonEl) {
            const feedbackEl = document.getElementById('quizFeedback');

            if (selectedItem.char === quizTargetLetter.char) {
                playSoundEffect('success');
                triggerConfetti();
                addStar();
                buttonEl.className = 'btn-magical bg-emerald-500 text-white border-3 border-emerald-600 rounded-2xl w-full h-full font-bold shadow-md';
                buttonEl.style.fontSize = currentQuizFontSize;
                feedbackEl.className = 'text-emerald-600 font-bold text-base sm:text-lg animate-bounce';
                feedbackEl.innerText = '✨ Muito Bem! Você acertou! 🎉';
                
                speakText(`Muito bem! Esta é a letra ${quizTargetLetter.name}!`);

                setTimeout(() => {
                    loadNextQuizQuestion();
                }, 2000);
            } else {
                playSoundEffect('wrong');
                buttonEl.className = 'btn-magical bg-rose-100 text-rose-500 border-3 border-rose-300 rounded-2xl w-full h-full font-bold opacity-60';
                buttonEl.style.fontSize = currentQuizFontSize;
                feedbackEl.className = 'text-rose-500 font-bold text-base sm:text-lg';
                feedbackEl.innerText = 'Ops! Tente novamente! 💡';
                
                speakText(`Letra ${quizTargetLetter.name}`, () => {
                    setTimeout(() => {
                        speakText(`Letra ${quizTargetLetter.name}`);
                    }, 800);
                });
            }
        }

        function startIdentifyModule() {
            showScreen('identifyScreen');
            document.getElementById('identifySliderContainer').style.display = 'flex';
            loadNextIdentifyQuestion();
        }

        function loadNextIdentifyQuestion() {
            document.getElementById('identifyFeedback').innerText = '';
            document.getElementById('identifySliderContainer').style.display = 'flex';
            const gameMode = Math.floor(Math.random() * 2); 
            const correctIndex = Math.floor(Math.random() * ALPHABET.length);
            identifyTargetItem = ALPHABET[correctIndex];

            document.getElementById('identifyTargetLetter').innerText = identifyTargetItem.char;
            
            let options = [identifyTargetItem];
            while (options.length < 4) {
                const randItem = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
                if (!options.includes(randItem)) {
                    options.push(randItem);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('identifyOptionsContainer');
            container.innerHTML = '';

            if (gameMode === 0) {
                speakText(`Qual é a versão cursiva da letra ${identifyTargetItem.name}?`);

                options.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-magical bg-white hover:bg-emerald-50 text-emerald-900 border-3 border-emerald-300 rounded-2xl w-full h-full font-bold shadow-md transition flex items-center justify-center cursor-pointer';
                    btn.style.fontFamily = '"Playwrite BR Guides", cursive, sans-serif';
                    btn.style.fontSize = currentIdentifyFontSize;
                    btn.innerText = item.char.toLowerCase();
                    btn.onclick = () => {
                        document.getElementById('identifySliderContainer').style.display = 'none';
                        checkIdentifyAnswer(item, btn);
                    };
                    container.appendChild(btn);
                });
            } else {
                speakText(`Qual figura começa com a letra ${identifyTargetItem.name}?`);

                options.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-magical bg-white hover:bg-emerald-50 border-3 border-emerald-300 rounded-2xl w-full h-full flex flex-col items-center justify-center shadow-md transition cursor-pointer';
                    btn.innerHTML = `
                        <span class="mb-0.5" style="font-size: calc(${currentIdentifyFontSize} * 1.2);">${item.emoji}</span>
                        <span class="font-bold text-slate-700 text-xs">${item.word}</span>
                    `;
                    btn.onclick = () => {
                        document.getElementById('identifySliderContainer').style.display = 'none';
                        checkIdentifyAnswer(item, btn);
                    };
                    container.appendChild(btn);
                });
            }
        }

        function checkIdentifyAnswer(selectedItem, buttonEl) {
            const feedbackEl = document.getElementById('identifyFeedback');

            if (selectedItem.char === identifyTargetItem.char) {
                playSoundEffect('success');
                triggerConfetti();
                addStar();
                buttonEl.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                feedbackEl.className = 'text-emerald-600 font-bold text-base sm:text-lg animate-bounce';
                feedbackEl.innerText = '🌟 Excelente! Você acertou!';
                
                speakText(`Excelente! ${identifyTargetItem.char} de ${identifyTargetItem.word}!`);

                setTimeout(() => {
                    loadNextIdentifyQuestion();
                }, 2000);
            } else {
                playSoundEffect('wrong');
                buttonEl.classList.add('opacity-50', 'bg-rose-100');
                feedbackEl.className = 'text-rose-500 font-bold text-base sm:text-lg';
                feedbackEl.innerText = 'Quase lá! Tente outra vez!';
                speakText('Tente outra vez!');
            }
        }

        function generateBackgroundStars() {
            const container = document.getElementById('starsContainer');
            const starEmojis = ['⭐', '✨', '🌟', '☁️', '🎈'];
            
            for (let i = 0; i < 15; i++) {
                const star = document.createElement('div');
                star.className = 'star-bg';
                star.innerText = starEmojis[Math.floor(Math.random() * starEmojis.length)];
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.fontSize = `${Math.random() * 20 + 16}px`;
                star.style.animationDelay = `${Math.random() * 4}s`;
                container.appendChild(star);
            }
        }

        window.onload = function() {
            generateBackgroundStars();
            initCanvas();
            
            // Fala a saudação automaticamente após o carregamento inicial
            setTimeout(() => {
                speakWelcome();
            }, 800);
        };
    </script>
</body>
</html>
