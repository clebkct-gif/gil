:root{--bg:#e9ecf1;--card:#fff;--ink:#1c1f24;--line:#cfd4dc;--sel-bg:#bbdefb;--sel-ink:#0d47a1;--sel-ring:#1976d2;--done-bg:#e0e0e0;--done-ink:#8a8f98;--rev-bg:#c8e6c9;--rev-ink:#1b5e20;--ok:#2e7d32;--bad:#c62828;--hd:#171a1f;--btn:#3a4049;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d10;--card:#1a1d22;--ink:#eef0f3;--line:#2b3037;--sel-bg:#1e3a5f;--sel-ink:#a9d1ff;--sel-ring:#4a90e2;--done-bg:#23272d;--done-ink:#6b717a;--rev-bg:#1f4d2c;--rev-ink:#b9f0c6}}
:root[data-theme="dark"]{--bg:#0b0d10;--card:#1a1d22;--ink:#eef0f3;--line:#2b3037;--sel-bg:#1e3a5f;--sel-ink:#a9d1ff;--sel-ring:#4a90e2;--done-bg:#23272d;--done-ink:#6b717a;--rev-bg:#1f4d2c;--rev-ink:#b9f0c6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;background:var(--hd);color:#fff;padding:6px 12px;min-height:56px;flex-wrap:wrap}
.box{font-weight:700;font-size:1.1rem;padding:5px 11px;border-radius:6px;min-width:46px;text-align:center;color:#fff}
.hit{background:var(--ok)}.err{background:var(--bad);cursor:pointer}
.avg{color:#ffeb3b;font-size:1.25rem;min-width:60px}
.mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0}
#title{font-size:20px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
#title:active{background:rgba(255,255,255,.12)}
#toolbar{display:none;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
#toolbar.open{display:flex}
.tb{background:var(--btn);color:#fff;border:0;border-radius:6px;padding:6px 11px;font-size:.85rem;font-weight:700;cursor:pointer}
.sl{display:flex;align-items:center;gap:5px;font-size:.75rem;color:#ccc}.sl input{width:70px}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--line);padding:3px}
.w{background:var(--card);color:var(--ink);border:0;outline:0;font-weight:600;font-size:19px;display:flex;justify-content:center;align-items:center;text-align:center;padding:8px;cursor:pointer;overflow:hidden;overflow-wrap:anywhere;transition:background .15s,transform .1s}
.w:active{transform:scale(.97)}
.w.sel{background:var(--sel-bg);color:var(--sel-ink);box-shadow:inset 0 0 0 3px var(--sel-ring)}
.w.done{background:var(--done-bg);color:var(--done-ink);pointer-events:none}
.w.rev{background:var(--rev-bg);color:var(--rev-ink);animation:p 1s infinite alternate}
@keyframes p{to{transform:scale(1.02)}}
#flash{position:fixed;inset:0;background:#ff4d4d;opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:f .4s ease-out}
@keyframes f{0%{opacity:.55}100%{opacity:0}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:100;padding:12px}
.modal.open{display:flex}
.mc{background:var(--card);color:var(--ink);padding:18px;border-radius:12px;width:100%;max-width:460px;max-height:88%;overflow-y:auto}
.mc h3{margin-bottom:12px;text-align:center}
.ci{padding:12px;margin:6px 0;background:var(--bg);border-radius:8px;cursor:pointer;font-weight:700}
.ci small{opacity:.6;font-weight:400}
.fg{margin-bottom:10px}.fg label{display:block;font-weight:700;font-size:.85rem;margin-bottom:4px}
.fg input,.fg textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:.95rem;background:var(--bg);color:var(--ink)}
.fg textarea{height:130px;resize:vertical}
.row{display:flex;gap:8px}
.sub{flex:1;background:var(--ok);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700;font-size:1rem;cursor:pointer}
.sub.gray{background:var(--btn)}
.msg{min-height:1.2em;font-size:.85rem;margin-top:8px;text-align:center}
html{background:var(--bg)}body{background:transparent}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--page);background-size:220% 220%;animation:drift 20s ease-in-out infinite alternate}

header{background:var(--hd);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}

#flash.g{background:#2ecc71}

.pv{padding:10px;border-radius:12px;margin:6px 0;background:var(--page);background-size:cover;cursor:pointer}
.pvw{display:block;text-align:center;padding:10px;font-weight:700;background:var(--wbg);color:var(--ink);border:var(--wb);border-radius:var(--wr);box-shadow:var(--wsh);text-shadow:var(--tsh);font-family:var(--wf)}
.pv.on .pvw{outline:3px solid #2ecc71;outline-offset:2px}

#toolbar{position:fixed;z-index:60;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(14,8,38,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.16);box-shadow:0 10px 28px rgba(0,0,0,.4);color:#fff;transform:translateY(-110%);transition:transform .3s cubic-bezier(.3,1.25,.5,1);pointer-events:none}

.bt:active{background:rgba(255,255,255,.22)}

.orb:nth-child(3){background:var(--c4);left:-20%;bottom:-12%;animation-delay:-9s}.orb:nth-child(4){background:var(--c1);right:-25%;bottom:-8%;width:50%;animation-delay:-3s;opacity:.22}

background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%),radial-gradient(120% 90% at 30% 15%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 86%,#000));background-size:250% 100%,100% 100%;background-position:150% 0,0 0;background-repeat:no-repeat;
box-shadow:0 6px 0 var(--edge),0 14px 20px -4px color-mix(in srgb,var(--c) 60%,transparent),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -8px 14px rgba(0,0,0,.08);-webkit-backdrop-filter:none;backdrop-filter:none;transition:transform .08s,box-shadow .08s}

</div>

  <h3>Nova lista</h3>

    <textarea id="nData" placeholder="alegre = feliz&#10;rápido = veloz&#10;Estados Unidos = Washington"></textarea></div>

</div></div>

<script>
const DEFAULTS={
"Aumentativo":[["casa","casarão"],["fogo","fogaréu"],["homem","homenzarrão"],["copo","copázio"],["boca","bocarra"],["cão","canzarrão"],["voz","vozeirão"],["muro","muralha"],["nariz","narigão"],["amigo","amigão"]],
"Diminutivo":[["casa","casinha"],["rio","riacho"],["lugar","lugarejo"],["chuva","chuvisco"],["frango","frangote"],["mão","mãozinha"],["pássaro","passarinho"],["porta","portinhola"],["corpo","corpúsculo"],["papel","papelote"]],
"Feminino":[["homem","mulher"],["pai","mãe"],["cavalo","égua"],["boi","vaca"],["ator","atriz"],["rei","rainha"],["príncipe","princesa"],["herói","heroína"],["genro","nora"],["padrinho","madrinha"]],
"Plural":[["mês","meses"],["pão","pães"],["alemão","alemães"],["cão","cães"],["funil","funis"],["farol","faróis"],["luz","luzes"],["jardim","jardins"],["flor","flores"],["animal","animais"]],
"Antônimo":[["certo","errado"],["bom","mau"],["sozinho","acompanhado"],["progredir","regredir"],["amor","ódio"],["alto","baixo"],["claro","escuro"],["forte","fraco"],["quente","frio"],["rico","pobre"]],
"Capital":[["Brasil","Brasília"],["França","Paris"],["Japão","Tóquio"],["Itália","Roma"],["Argentina","Buenos Aires"],["Espanha","Madri"],["Portugal","Lisboa"],["Alemanha","Berlim"],["Inglaterra","Londres"],["Estados Unidos","Washington"]]};

// ---------- bancos ampliados (formato compacto "a>b|c>d") ----------
const P=t=>t.split('|').map(x=>x.split('>'));
const MORE={
"Aumentativo":"gato>gatão|livro>livrão|bola>bolão|porta>portão|janela>janelão|festa>festança|panela>panelão|rapaz>rapagão|mulher>mulherona|moça>moçona|corpo>corpanzil|pé>pezão|cabeça>cabeçorra|carro>carrão|sala>salão|rico>ricaço|barco>barcaça|faca>facão|dente>dentão|peixe>peixão|vento>ventania|chuva>chuvarada|papel>papelão|problema>problemão|calor>calorão|menino>meninão|pedra>pedregulho|gente>gentarada",
"Diminutivo":"gato>gatinho|livro>livrinho|bola>bolinha|flor>florzinha|pé>pezinho|cabelo>cabelinho|peixe>peixinho|sapato>sapatinho|janela>janelinha|cadeira>cadeirinha|café>cafezinho|pão>pãozinho|coração>coraçãozinho|animal>animalzinho|mulher>mulherzinha|árvore>arvorezinha|jardim>jardinzinho|luz>luzinha|avião>aviãozinho|colher>colherinha|pedra>pedrinha|gota>gotícula|rua>ruela|vila>vilarejo|ilha>ilhota|folha>folhinha|homem>homúnculo|cidade>cidadezinha",
"Feminino":"leão>leoa|galo>galinha|bode>cabra|carneiro>ovelha|tio>tia|sobrinho>sobrinha|avô>avó|irmão>irmã|marido>esposa|professor>professora|aluno>aluna|médico>médica|cantor>cantora|poeta>poetisa|conde>condessa|duque>duquesa|barão>baronesa|embaixador>embaixatriz|imperador>imperatriz|sacerdote>sacerdotisa|monge>monja|abade>abadessa|czar>czarina|cão>cadela|pato>pata|compadre>comadre|bailarino>bailarina|jovem>moça",
"Plural":"papel>papéis|mal>males|cidadão>cidadãos|irmão>irmãos|mão>mãos|órgão>órgãos|capitão>capitães|leão>leões|botão>botões|limão>limões|coração>corações|avião>aviões|canção>canções|nação>nações|colher>colheres|mulher>mulheres|país>países|rapaz>rapazes|cartaz>cartazes|jovem>jovens|homem>homens|item>itens|nuvem>nuvens|girassol>girassóis|anzol>anzóis|lençol>lençóis|móvel>móveis|réptil>répteis|gás>gases|hotel>hotéis|nariz>narizes|vez>vezes",
"Antônimo":"dia>noite|grande>pequeno|gordo>magro|novo>velho|feliz>triste|rápido>lento|doce>amargo|cheio>vazio|perto>longe|abrir>fechar|subir>descer|entrar>sair|começo>fim|verdade>mentira|paz>guerra|amigo>inimigo|liso>áspero|duro>mole|leve>pesado|largo>estreito|seco>molhado|limpo>sujo|barato>caro|cedo>tarde|ganhar>perder|rir>chorar|acordar>dormir|vitória>derrota|coragem>medo|presente>ausente|raso>fundo|luz>sombra|inteligente>burro|educado>grosseiro|gentil>rude|saúde>doença|alegria>tristeza|esperança>desespero|mestre>aprendiz|ordem>desordem",
"Capital":"Chile>Santiago|Peru>Lima|Colômbia>Bogotá|Uruguai>Montevidéu|Paraguai>Assunção|Venezuela>Caracas|Equador>Quito|México>Cidade do México|Canadá>Ottawa|Cuba>Havana|Egito>Cairo|Rússia>Moscou|China>Pequim|Índia>Nova Délhi|Grécia>Atenas|Holanda>Amsterdã|Bélgica>Bruxelas|Suíça>Berna|Áustria>Viena|Suécia>Estocolmo|Noruega>Oslo|Irlanda>Dublin|Turquia>Ancara|Austrália>Camberra|Coreia do Sul>Seul|Angola>Luanda|Marrocos>Rabat|Quênia>Nairóbi|Polônia>Varsóvia|Hungria>Budapeste|Tailândia>Bangkok|Dinamarca>Copenhague|Finlândia>Helsinque|Moçambique>Maputo|Cabo Verde>Praia"};
for(const k in MORE){const seen=new Set(DEFAULTS[k].map(x=>x.join('>')));DEFAULTS[k]=DEFAULTS[k].concat(P(MORE[k]).filter(x=>!seen.has(x.join('>'))))}
DEFAULTS["Sons"]=P("cachorro>latir|cachorro>rosnar|cachorro>uivar|cachorro>ganir|gato>miar|gato>ronronar|gato>bufar|vaca>mugir|cavalo>relinchar|burro>zurrar|ovelha>balir|porco>grunhir|galo>cocoricar|galinha>cacarejar|pinto>piar|pato>grasnar|sapo>coaxar|abelha>zumbir|mosquito>zunir|cobra>sibilar|leão>rugir|lobo>uivar|elefante>barrir|passarinho>gorjear|pombo>arrulhar|corvo>crocitar|grilo>cricrilar|macaco>guinchar|rato>chiar|peru>grugulejar|cervo>bramar|hiena>gargalhar|coruja>piar|portão>ranger|porta>bater|sino>badalar|relógio>tiquetaquear|telefone>tocar|trovão>trovejar|vento>assobiar|chuva>pingar|folhas>farfalhar|água>gorgolejar|riacho>murmurar|mar>marulhar|fogo>crepitar|lenha>estalar|vidro>tilintar|chave>tilintar|corrente>tinir|motor>roncar|carro>buzinar|trem>apitar|sirene>soar|bola>quicar|tambor>rufar|trombeta>soar|cama>ranger|escada>ranger|dentes>ranger|estômago>roncar|coração>palpitar|torneira>pingar|panela de pressão>chiar|bebê>chorar|multidão>murmurar|plateia>aplaudir|criança>gritar|espada>tinir|vassoura>raspar|papel>farfalhar|gelo>rachar");
DEFAULTS["Coletivo"]=P("abelha>enxame|lobo>alcateia|peixe>cardume|ovelha>rebanho|boi>boiada|porco>vara|cavalo>tropa|elefante>manada|pássaro>bando|formiga>formigueiro|livro>biblioteca|árvore>arvoredo|estrela>constelação|ilha>arquipélago|navio>frota|avião>esquadrilha|soldado>exército|aluno>classe|cantor>coro|músico>orquestra|jogador>time|ator>elenco|cão>matilha|camelo>caravana|bandido>quadrilha|pessoa>multidão|gafanhoto>nuvem|arma>arsenal|folha>folhagem|flor>buquê|uva>cacho|banana>penca|chave>molho|cabelo>cabeleira|dente>dentadura|burro>récua|papel>resma|foto>álbum|mapa>atlas|palavra>vocabulário|letra>alfabeto|deputado>câmara|senador>senado|cardeal>conclave|padre>clero|marinheiro>tripulação|jornalista>imprensa|cliente>clientela|eleitor>eleitorado|estudante>turma|criança>criançada|vaca>rebanho|cabra>rebanho|macaco>bando|gato>gataria|vizinho>vizinhança|atleta>delegação|turista>caravana|lâmpada>lustre|músico>banda|passageiro>lotação|livro>acervo|cidadão>povo");
// sacola sem repetição: sorteia 5 pares sem palavras duplicadas na mesma rodada
const bags={};
function draw(cat,list){
  const out=[],ls=new Set(),rs=new Set(),skipped=[];let g=0;
  while(out.length<Math.min(5,list.length)&&g++<list.length*3){
    if(!bags[cat]||!bags[cat].length)bags[cat]=shuffle(list);
    const q=bags[cat].pop();
    if(ls.has(q[0])||rs.has(q[1])){skipped.push(q);continue}
    ls.add(q[0]);rs.add(q[1]);out.push(q);
  }
  bags[cat]=(bags[cat]||[]).concat(skipped);return out;
}

// ---------- armazenamento (com tolerância a falhas) ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const validList=l=>Array.isArray(l)&&l.length>=3&&l.every(p=>Array.isArray(p)&&p.length==2&&String(p[0]).trim()&&String(p[1]).trim());
let custom=store.get('aw_custom',{});
if(!custom||typeof custom!=='object')custom={};
Object.keys(custom).forEach(k=>{if(!validList(custom[k]))delete custom[k]});
let stats=Object.assign({hit:0,err:0},store.get('aw_stats',{}));
let prefs=Object.assign({font:19,title:20,cat:'Antônimo'},store.get('aw_prefs',{}));
const all=()=>Object.assign({},DEFAULTS,custom);
const saveAll=()=>{store.set('aw_custom',custom);store.set('aw_stats',stats);store.set('aw_prefs',prefs)};

// ---------- estado ----------
let sid=0,pairs=[],matched=0,review=false,reviewDone=false,sel={left:null,right:null},cur=prefs.cat;
const $=id=>document.getElementById(id);
const grid=$('grid'),titleEl=$('title');
const later=(fn,ms)=>{const s=sid;return setTimeout(()=>{if(s===sid)fn()},ms)};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------- áudio, voz, vibração ----------
let actx=null;
function tone(f,type,d){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.01,t+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(t+d)}catch(e){}}
const sOk=()=>{tone(523.25,'sine',.15);setTimeout(()=>tone(659.25,'sine',.2),100)};
const sErr=()=>tone(180,'sawtooth',.3);
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function speak(text,cb){
  const s=sid;let done=false,fb;
  const fin=()=>{if(done)return;done=true;clearTimeout(fb);if(cb&&s===sid)cb()};
  fb=setTimeout(fin,text.length*110+2500);              // rede de segurança se a voz falhar
  if(!('speechSynthesis' in window)){clearTimeout(fb);done=true;if(cb)later(cb,text.length*60+600);return}
  const syn=window.speechSynthesis;syn.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=.9;u.onend=fin;u.onerror=fin;
  setTimeout(()=>{if(s===sid)syn.speak(u)},40);
}

// ---------- placar ----------
function updateStats(){
  $('sHit').textContent=stats.hit;$('sErr').textContent=stats.err;
  const t=stats.hit+stats.err;$('sAvg').textContent=(t?stats.hit/t*10:0).toFixed(2);
  saveAll();
}

// ---------- jogo ----------
function initGame(cat){
  const d=all();if(!d[cat])cat=Object.keys(d)[0];
  cur=cat;prefs.cat=cat;sid++;                           // invalida timers/vozes da partida anterior
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  titleEl.textContent=cat;matched=0;review=false;reviewDone=false;sel={left:null,right:null};
  pairs=draw(cat,d[cat]);
  const n=pairs.length;
  const L=pairs.map((p,i)=>({text:p[0],pid:i,side:'left'}));
  const perm=derange(n),R=[];pairs.forEach((p,i)=>{R[perm[i]]={text:p[1],pid:i,side:'right'}});
  grid.style.gridTemplateRows=`repeat(${n},1fr)`;grid.innerHTML='';
  for(let i=0;i<n;i++){grid.appendChild(mkBtn(L[i]));grid.appendChild(mkBtn(R[i]))}
  applyFonts();updateStats();
  later(()=>speak(cat),0);
}
function mkBtn(item){
  const b=document.createElement('button');b.className='w';b.textContent=item.text;b._item=item;
  b.addEventListener('click',()=>onWord(b));return b;
}
function onWord(b){
  const it=b._item;
  if(review){if(!reviewDone||!b.textContent)return;vib(30);speak(pairs[it.pid].join('... '));return}
  if(b.classList.contains('done'))return;
  vib(30);
  if(sel[it.side]===b){b.classList.remove('sel');sel[it.side]=null;return}   // toque de novo desmarca
  if(sel[it.side])sel[it.side].classList.remove('sel');
  sel[it.side]=b;b.classList.add('sel');speak(it.text);
  if(sel.left&&sel.right)check();
}
function check(){
  const a=sel.left,b=sel.right;sel={left:null,right:null};
  a.classList.remove('sel');b.classList.remove('sel');
  if(a._item.pid===b._item.pid){
    sOk();vib([40,60,40]);flash(1);a.classList.add('done');b.classList.add('done');
    stats.hit++;matched++;updateStats();
    const t=b._item.text;later(()=>speak(t),300);
    if(matched===pairs.length)later(endGame,1200);
  }else{
    sErr();vib(200);stats.err++;updateStats();flash(0);
  }
}
function endGame(){
  review=true;reviewDone=false;
  const btns=[...grid.children];
  btns.forEach(b=>{b.textContent='';b.classList.remove('done')});
  const order=shuffle(pairs.map((_,i)=>i));
  const step=i=>{
    if(i>=order.length){reviewDone=true;return}
    const pid=order[i],p=pairs[pid],l=btns[i*2],r=btns[i*2+1];
    l.textContent=p[0];r.textContent=p[1];
    l._item={text:p[0],pid,side:'left'};r._item={text:p[1],pid,side:'right'};   // corrige o par falado ao tocar
    l.classList.add('rev');r.classList.add('rev');
    speak(p[0]+'... '+p[1],()=>later(()=>{l.classList.remove('rev');r.classList.remove('rev');step(i+1)},400));
  };
  step(0);
}

// ---------- criar lista ----------
function parseLines(txt){
  const out=[];
  txt.split(/\n|,/).forEach(raw=>{
    const s=raw.trim();if(!s)return;
    let a,b;
    if(/[=;:]/.test(s)){[a,b]=s.split(/\s*[=;:]\s*/)}
    else{const m=s.match(/^(.+)\s+(\S+)$/);if(m){a=m[1];b=m[2]}}
    if(a&&b&&a.trim()&&b.trim())out.push([a.trim(),b.trim()]);
  });
  return out;
}
$('nSave').addEventListener('click',()=>{
  const t=$('nTitle').value.trim(),list=parseLines($('nData').value),m=$('nMsg');
  if(!t){m.textContent='Dê um título à lista.';return}
  if(DEFAULTS[t]){m.textContent='Esse título já existe nas listas padrão.';return}
  if(list.length<3){m.textContent='Informe ao menos 3 pares válidos (palavra = relação).';return}
  custom[t]=list;delete bags[t];saveAll();
  $('nTitle').value='';$('nData').value='';close('mNew');
  if($('toolbar').classList.contains('open'))$('sErr').click();
  enterFS();initGame(t);
});

$('bImp').addEventListener('click',()=>{

  }catch(e){$('bMsg').textContent='Texto inválido.'}
});
