name: Atualizar apps.json

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'apps.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar apps.json
        run: python3 gerar_apps_json.py
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain apps.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps.json
            git commit -m "Atualiza apps.json"
            git push
          fi
