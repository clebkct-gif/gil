.card:nth-child(2){--g1:#fbbf24;--g2:#f43f5e;--gd:#9f1239;--d:.15s}

.card:hover{transform:translateY(-5px) scale(1.025)}
.card:active{transform:translateY(7px) scale(.98);box-shadow:0 3px 0 var(--gd),0 8px 14px #0006,inset 0 2px 0 #ffffff8c}
.card:focus-visible{outline:4px solid #fff;outline-offset:3px}

<body class="on-home">
<div id="start-screen"><button type="button" id="start-btn">Iniciar</button></div>
<header><button type="button" id="back-btn" aria-label="Voltar ao início">‹ Início</button><span class="brand">🏅 Ordinal</span><span id="score-chip" title="Acertos / tentativas">✓ 0/0</span></header>
<main>
<section class="panel active" id="home"><div class="decor" aria-hidden="true"><span style="--x:5%;--s:2.6rem;--t:19s;--dl:-2s">1.º</span><span style="--x:16%;--s:1.8rem;--t:23s;--dl:-9s">★</span><span style="--x:27%;--s:3rem;--t:21s;--dl:-5s">2.º</span><span style="--x:39%;--s:1.6rem;--t:25s;--dl:-12s">✦</span><span style="--x:50%;--s:2.8rem;--t:18s;--dl:-7s">3.º</span><span style="--x:62%;--s:2rem;--t:24s;--dl:-3s">★</span><span style="--x:73%;--s:3.2rem;--t:20s;--dl:-10s">4.º</span><span style="--x:84%;--s:1.7rem;--t:26s;--dl:-6s">✦</span><span style="--x:93%;--s:2.4rem;--t:22s;--dl:-14s">5.º</span></div><div class="cards"><button type="button" class="card" data-tab="contagem" aria-label="Contar"><span class="wm" aria-hidden="true">1.º</span><span class="badge" aria-hidden="true">🔢</span><span class="t"><b>Contar</b><small>do 1.º ao 100.º</small><span class="go">Jogar <i>▶</i></span></span></button><button type="button" class="card" data-tab="quiz" aria-label="Quiz"><span class="wm" aria-hidden="true">?</span><span class="badge" aria-hidden="true">🏆</span><span class="t"><b>Quiz</b><small>Qual é o ordinal?</small><span class="go">Jogar <i>▶</i></span></span></button><button type="button" class="card" data-tab="ouvir" aria-label="Ouvir"><span class="wm" aria-hidden="true">♪</span><span class="badge" aria-hidden="true">🔊</span><span class="t"><b>Ouvir</b><small>Digite e escute</small><span class="go">Jogar <i>▶</i></span></span></button><button type="button" class="card" data-tab="ditado" aria-label="Ditado"><span class="wm" aria-hidden="true">✎</span><span class="badge" aria-hidden="true">👂</span><span class="t"><b>Ditado</b><small>Ouça e escreva</small><span class="go">Jogar <i>▶</i></span></span></button></div></section>
<section class="panel" id="contagem"><div class="section"><div id="sequence" class="sequence"></div></div></section>
<section class="panel" id="quiz"><div class="section"><div class="mini-card"><span class="pill" id="quiz-round">Pergunta 1</span><div class="game-prompt" id="quiz-prompt">Qual é o ordinal de 12?</div><div id="quiz-options"></div><div class="feedback" id="quiz-feedback" aria-live="polite"></div><button class="btn" id="next-question">Próxima →</button></div></div></section>
<section class="panel" id="ouvir"><div class="section"><div class="mini-card"><div class="field"><input id="voice-number" type="number" min="1" max="10000" value="23" aria-label="Número"></div><div class="field"><select id="voice-gender" aria-label="Forma"><option value="m">Masculino</option><option value="f">Feminino</option></select></div><div id="voice-word" class="result big-result" aria-live="polite">vigésimo terceiro</div></div></div></section>
<section class="panel" id="ditado"><div class="section"><button type="button" class="game-prompt" id="dictation-hidden" aria-label="Ouvir a palavra"></button><div class="field"><label for="dictation-answer">Qual é o número?</label><input id="dictation-answer" type="text" class="kp" inputmode="none" autocomplete="off" placeholder="?"></div><button class="btn red" id="new-dictation">Novo</button></div></section>
</main>

<aside class="numeric-dock" id="numeric-dock" aria-label="Teclado numérico">
  
  <div class="keypad-grid" id="keypad-grid">
    <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
    <button type="button" data-key="clear" class="action">C</button><button type="button" data-key="0">0</button><button type="button" data-key="back" class="action">⌫</button>
    <button type="button" data-key="ord-m" class="action ord">.º</button><button type="button" data-key="ord-f" class="action ord">.ª</button><button type="button" data-key="enter" class="enter" aria-label="Concluir">✓</button><button type="button" data-key="prev" class="action step" aria-label="Recuar">◀</button><button type="button" data-key="next" class="action step" aria-label="Avançar">▶</button>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={attempts:0,correct:0,quizRound:1,quizAnswer:null,quizLocked:false,dictation:7,streak:0,dictPending:true};
const known={1:'primeiro',2:'segundo',3:'terceiro',4:'quarto',5:'quinto',6:'sexto',7:'sétimo',8:'oitavo',9:'nono',10:'décimo',11:'décimo primeiro',12:'décimo segundo',13:'décimo terceiro',14:'décimo quarto',15:'décimo quinto',16:'décimo sexto',17:'décimo sétimo',18:'décimo oitavo',19:'décimo nono',20:'vigésimo',30:'trigésimo',40:'quadragésimo',50:'quinquagésimo',60:'sexagésimo',70:'septuagésimo',80:'octogésimo',90:'nonagésimo',100:'centésimo',200:'ducentésimo',300:'trecentésimo',400:'quadringentésimo',500:'quingentésimo',600:'sexcentésimo',700:'septingentésimo',800:'octingentésimo',900:'nongentésimo',1000:'milésimo',10000:'décimo milésimo'};
const feminineSpecial={1:'primeira',2:'segunda',3:'terceira',4:'quarta',5:'quinta',6:'sexta',7:'sétima',8:'oitava',9:'nona',10:'décima',20:'vigésima',30:'trigésima',40:'quadragésima',50:'quinquagésima',60:'sexagésima',70:'septuagésima',80:'octogésima',90:'nonagésima',100:'centésima',200:'ducentésima',300:'trecentésima',400:'quadringentésima',500:'quingentésima',600:'sexcentésima',700:'septingentésima',800:'octingentésima',900:'nongentésima',1000:'milésima',10000:'décima milésima'};
const units={1:'primeiro',2:'segundo',3:'terceiro',4:'quarto',5:'quinto',6:'sexto',7:'sétimo',8:'oitavo',9:'nono'};
const tens={10:'décimo',20:'vigésimo',30:'trigésimo',40:'quadragésimo',50:'quinquagésimo',60:'sexagésimo',70:'septuagésimo',80:'octogésimo',90:'nonagésimo'};
const hundreds={100:'centésimo',200:'ducentésimo',300:'trecentésimo',400:'quadringentésimo',500:'quingentésimo',600:'sexcentésimo',700:'septingentésimo',800:'octingentésimo',900:'nongentésimo'};
function ordinal(n,gender='m'){
 n=Math.floor(Number(n)); if(!Number.isFinite(n)||n<1||n>10000)return null;
 if(n===10000)return gender==='f'?'décima milésima':'décimo milésimo';
 if(n===1000)return gender==='f'?'milésima':'milésimo';
 if(n>=1000){const th=Math.floor(n/1000),r=n%1000,f=gender==='f';let base;if(th===1)base=f?'milésima':'milésimo';else{const c=f&&th<3?['','uma','duas'][th]:['','um','dois','três','quatro','cinco','seis','sete','oito','nove'][th];base=c+(f?' milésimas':' milésimos')}return r?base+' '+ordinal(r,gender):base}
 if(n>=100){let h=Math.floor(n/100)*100,r=n%100;let base=gender==='f'?(feminineSpecial[h]||hundreds[h]):hundreds[h];if(!r)return base;return base+' '+ordinal(r,gender);}
 if(n>=20){let t=Math.floor(n/10)*10,r=n%10;let base=gender==='f'?feminineSpecial[t]:tens[t];if(!r)return base;return base+' '+ordinal(r,gender);}
 if(n>=11){let base=gender==='f'?'décima':'décimo';return base+' '+ordinal(n-10,gender);}
 if(gender==='f')return feminineSpecial[n]||units[n];return known[n]||units[n];
}
function ordinalLabel(n,g='m'){return `${Number(n).toLocaleString('pt-BR')}.${g==='f'?'ª':'º'}`;}
function speak(text){if(!('speechSynthesis'in window)){toast('Síntese de voz não disponível neste navegador.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=.88;speechSynthesis.speak(u)}
function toast(s){const el=$('#toast');el.textContent=s;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
function save(){try{localStorage.setItem('ordinal-progress-v1',JSON.stringify({attempts:state.attempts,correct:state.correct}))}catch(e){}updateProgress()}
function load(){try{const x=JSON.parse(localStorage.getItem('ordinal-progress-v1')||'{}');state.attempts=Number(x.attempts)||0;state.correct=Number(x.correct)||0}catch(e){}updateProgress()}
function record(ok){state.attempts++;if(ok)state.correct++;save()}
function updateProgress(){const c=$('#score-chip');if(c)c.textContent='✓ '+state.correct+'/'+state.attempts+(state.streak>=3?' 🔥'+state.streak:'')}
async function ensureFullscreen(){const d=document.documentElement;try{if(!document.fullscreenElement&&!document.webkitFullscreenElement){if(d.requestFullscreen)await d.requestFullscreen();else if(d.webkitRequestFullscreen)d.webkitRequestFullscreen()}}catch(e){}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){if(!ensureFullscreen.warned){ensureFullscreen.warned=1;toast('Se a tela não girar sozinha, ative a rotação automática e vire o aparelho na horizontal.')}}}
async function startApp(){document.body.classList.add('app-started');await ensureFullscreen()}
$('#start-btn').addEventListener('click',()=>{startApp();switchTab('home')});
function switchTab(id){document.body.classList.add('app-started');if('speechSynthesis'in window)speechSynthesis.cancel();if(id==='ditado'&&state.dictPending){state.dictPending=false;speak(ordinal(state.dictation))}$$('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.body.classList.toggle('on-home',id==='home');window.scrollTo({top:0,behavior:'auto'});preparePanelKeypad(document.getElementById(id))}
$$('.card,#back-btn').forEach(b=>b.addEventListener('click',()=>{startApp();switchTab(b.dataset.tab||'home')}));

function makeOptions(correct,range=35){let set=new Set([correct]);while(set.size<4){let n=1+Math.floor(Math.random()*range);set.add(n)}return [...set].sort(()=>Math.random()-.5)}
function renderOptions(container,correct,displayFn,onAnswer){container.innerHTML='';makeOptions(correct,Math.max(35,correct+10)).forEach(n=>{let b=document.createElement('button');b.className='quiz-option';b.textContent=displayFn(n);b.onclick=()=>onAnswer(n,b);container.appendChild(b)})}
function buildSequence(){const el=$('#sequence');el.innerHTML='';for(let n=1;n<=100;n++){const b=document.createElement('button');b.className='seq';b.textContent=ordinalLabel(n);b.onclick=()=>{el.querySelector('.current')?.classList.remove('current');b.classList.add('current');speak(ordinal(n))};el.appendChild(b)}}
function newQuiz(){state.quizLocked=false;state.quizAnswer=1+Math.floor(Math.random()*100);$('#quiz-round').textContent='Pergunta '+state.quizRound;$('#quiz-prompt').textContent=`Qual é o ordinal de ${state.quizAnswer}?`;$('#quiz-feedback').textContent='';renderOptions($('#quiz-options'),state.quizAnswer,n=>ordinal(n), (n,b)=>{if(state.quizLocked)return;state.quizLocked=true;let ok=n===state.quizAnswer;b.classList.add(ok?'correct':'wrong');$('#quiz-feedback').textContent=ok?'✅ Muito bem!':'❌ Resposta correta: '+ordinal(state.quizAnswer)+'.';if(!ok)$('#quiz-options').querySelectorAll('button').forEach(x=>{if(x.textContent===ordinal(state.quizAnswer))x.classList.add('correct')});record(ok)})}
$('#next-question').onclick=()=>{state.quizRound++;newQuiz()};
function newDictation(say=true){state.dictation=1+Math.floor(Math.random()*100);state.dictRevealed=false;$('#dictation-hidden').textContent='';$('#dictation-answer').value='';if(say)speak(ordinal(state.dictation))}
function checkDictation(){const inp=$('#dictation-answer');if(!/\d/.test(inp.value))return;const ok=num(inp.value)===state.dictation;$('#dictation-hidden').textContent=ordinal(state.dictation);state.dictRevealed=true;state.dictLen=inp.value.length;record(ok)}
$('#dictation-hidden').onclick=()=>speak(ordinal(state.dictation));
$('#new-dictation').onclick=()=>newDictation();
$('#dictation-answer').addEventListener('input',e=>{if(state.dictRevealed&&e.target.value.length<state.dictLen){state.dictRevealed=false;$('#dictation-hidden').textContent=''}});
// Teclado numérico contextual: fica dentro da aba ativa, em uma coluna à direita.
let keypadTarget=null, keypadReplaceOnNext=false;
const KP='input[type="number"],input.kp';
const num=v=>parseInt(String(v).replace(/\D/g,''),10);
function syncOrd(){const g=$('#keypad-grid');g.classList.toggle('ord-off',!(keypadTarget&&keypadTarget.classList.contains('kp')));g.classList.toggle('step-on',!!(keypadTarget&&keypadTarget.id==='voice-number'))}
const keypad=$('#numeric-dock');
function attachKeypadToPanel(panel){
  if(!panel)return;
  panel.appendChild(keypad);syncOrd();
  panel.classList.add('keypad-layout');
  keypad.classList.add('visible');
  document.body.classList.add('keypad-open');
}
function showKeypad(input){
  if(!input||!input.matches(KP))return;
  if(keypadTarget!==input || input.dataset.keypadFresh!=='1')keypadReplaceOnNext=true;
  keypadTarget=input;input.dataset.keypadFresh='1';
  attachKeypadToPanel(input.closest('.panel'));
}
function hideKeypad(){
  keypad.classList.remove('visible');document.body.classList.remove('keypad-open');
  document.querySelectorAll('.panel.keypad-layout').forEach(p=>p.classList.remove('keypad-layout'));
  keypadTarget=null;keypadReplaceOnNext=false;
  document.body.appendChild(keypad);
}
function preparePanelKeypad(panel){
  hideKeypad();
  if(!panel)return;
  const input=[...panel.querySelectorAll(KP)].find(i=>!i.disabled);
  if(input){keypadTarget=input;input.dataset.keypadFresh='0';keypadReplaceOnNext=true;attachKeypadToPanel(panel);}
}
$$(KP).forEach(input=>{input.setAttribute('inputmode','none');
 input.addEventListener('focus',()=>showKeypad(input));
 input.addEventListener('click',()=>showKeypad(input));
});

$('#keypad-grid').addEventListener('click',e=>{
 const btn=e.target.closest('button[data-key]');if(!btn||!keypadTarget)return;
 const input=keypadTarget,key=btn.dataset.key;let value=input.value||'';
 if(key==='enter'){
   input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));
   input.dataset.keypadFresh='0';input.blur();commit(input);return;
 }
 if(key==='prev'||key==='next'){if(input===voiceIn)stepVoice(key==='next'?1:-1);return}
  if(key==='ord-m'||key==='ord-f'){if(!/\d/.test(value)||/[ºª]/.test(value)||input.type==='number')return;value+=key==='ord-m'?'.º':'.ª';keypadReplaceOnNext=false;}
 else if(key==='clear'){value='';keypadReplaceOnNext=false;}
 else if(key==='back'){value=value.slice(0,-1);keypadReplaceOnNext=false;}
 else {if(/[ºª]/.test(value)&&!keypadReplaceOnNext)return;if(((keypadReplaceOnNext?'':value)+key).replace(/\D/g,'').length>5)return;value=(keypadReplaceOnNext?'':value)+key;keypadReplaceOnNext=false;}
 input.value=value;input.dataset.keypadFresh='0';input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));
});
// Sons curtos opcionais, gerados localmente (sem arquivos externos).
let soundEnabled=true,audioCtx=null;
function feedbackSound(kind='tap'){
 if(!soundEnabled)return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime,notes=kind==='success'?[660,880]:kind==='error'?[220,165]:kind==='tap'?[520]:[740];
  notes.forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,now+i*.09);gain.gain.exponentialRampToValueAtTime(kind==='tap'?.025:.045,now+i*.09+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.105);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+i*.09);osc.stop(now+i*.09+.12);});
 }catch(e){}
}
// Botão de som discreto na barra de navegação.
document.addEventListener('click',e=>{if(e.target.closest('button')&&!e.target.closest('#sound-toggle')&&!e.target.closest('#keypad-grid')&&!e.target.closest('.quiz-option,.seq'))feedbackSound('tap');});
const voiceIn=$('#voice-number'),voiceOut=$('#voice-word');let voiceTimer;
function voiceNum(){const v=parseInt(voiceIn.value,10);return Number.isInteger(v)&&v>=1?Math.min(10000,v):null}
function showVoice(delay=300){const n=voiceNum(),g=$('#voice-gender').value;voiceOut.textContent=n?ordinal(n,g):'';clearTimeout(voiceTimer);if(n)voiceTimer=setTimeout(()=>speak(ordinal(n,g)),delay)}
voiceIn.addEventListener('input',()=>{if(+voiceIn.value>10000)voiceIn.value=10000;showVoice()});
$('#voice-gender').addEventListener('change',()=>showVoice(0));
function stepVoice(d){voiceIn.value=Math.min(10000,Math.max(1,(voiceNum()||0)+d));keypadReplaceOnNext=true;showVoice(0)}
const ENTER={'dictation-answer':checkDictation};
function commit(input){input.dispatchEvent(new Event('input',{bubbles:true}));const a=ENTER[input.id];if(typeof a==='function')a();else if(a){const b=$(a);if(b)b.click()}}
$$(KP).forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit(i)}}));
(function(){
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,COL=['#ff6b6b','#ffd43b','#51cf66','#4dabf7','#da77f2','#ff922b'];
const cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv);const cx=cv.getContext('2d');
let parts=[],raf=0,pt={x:innerWidth/2,y:innerHeight/2};
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}fit();addEventListener('resize',fit);
document.addEventListener('pointerdown',e=>{pt={x:e.clientX,y:e.clientY}},true);
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.l>0);for(const p of parts){p.vy+=p.g;p.vx*=p.f;p.vy*=p.f;p.x+=p.vx;p.y+=p.vy;p.l--;p.r+=p.vr;cx.save();cx.globalAlpha=Math.min(1,p.l/25);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.s)cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);else{cx.beginPath();cx.arc(0,0,p.w/2,0,7);cx.fill()}cx.restore()}raf=parts.length?requestAnimationFrame(loop):0}
function add(a){parts.push(...a);if(!raf)raf=requestAnimationFrame(loop)}
window.confetti=function(x=pt.x,y=pt.y,n=48){if(RM)return;add(Array.from({length:n},()=>{const a=-Math.PI/2+(Math.random()-.5)*2.2,v=6+Math.random()*9;return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.28,f:.985,l:90+Math.random()*50,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COL[Math.random()*6|0],s:Math.random()<.7}}))};
function burst(x,y,c){add(Array.from({length:46},(_,i)=>{const a=i/46*Math.PI*2,v=3+Math.random()*4;return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.06,f:.965,l:60+Math.random()*25,w:4,h:4,r:0,vr:0,c,s:0}}))}
window.fireworks=function(){if(RM)return;for(let i=0;i<5;i++)setTimeout(()=>{burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),COL[Math.random()*6|0]);feedbackSound('success')},i*320)};
const PRAISE=['Uau! \uD83C\uDF89','Arrasou! \uD83C\uDF1F','Incr\u00edvel! \uD83D\uDE80','Mandou bem! \uD83D\uDC4F','Show! \uD83C\uDFC6','Isso a\u00ed! \uD83C\uDF88'];
const prev=record;
record=function(ok){prev(ok);feedbackSound(ok?'success':'error');state.streak=ok?state.streak+1:0;
 const fb=document.querySelector('.panel.active .feedback');
 if(fb){fb.textContent=fb.textContent.replace('\u2705',PRAISE[Math.random()*PRAISE.length|0]).replace('\u274C','Quase! \uD83D\uDCAA');fb.classList.toggle('ok',ok);fb.classList.toggle('bad',!ok)}
 if(ok){confetti();if(state.streak%5===0){fireworks();if(document.querySelector('.panel.active')?.id!=='ditado')toast('\uD83D\uDD25 Sequ\u00eancia de '+state.streak+' acertos!')}}
 else{const t=document.querySelector('.panel.active>.section');if(t){t.classList.remove('oops');void t.offsetWidth;t.classList.add('oops')}}
 updateProgress()};
$('#start-btn').addEventListener('click',()=>confetti(innerWidth/2,innerHeight/2,80));
})();
load();buildSequence();newQuiz();newDictation(false);preparePanelKeypad(document.querySelector('.panel.active'));
</script>
