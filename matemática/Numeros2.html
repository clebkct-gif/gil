<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jogo dos Números Infantil</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        /* Reset para Fullscreen Perfeito em Mobile */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Garante tamanho exato considerando barras dinamicas mobile */
            max-width: 100vw;
            max-height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827;
        }

        /* Bloqueio visual para orientacao Landscape */
        @media screen and (orientation: landscape) and (pointer: coarse) and (max-height: 520px) {
            #portrait-warning {
                display: flex !important;
            }
        }

        /* Estilos e Gradientes de Layout */
        .top-bar-bg {
            background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
            border-bottom: 2px solid #4b5563;
        }

        .red-score {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
        }

        .green-score {
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
        }

        /* Fundo do Display e Feedbacks Persistentes */
        #game-screen { position: relative; }
        #fb-layer { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
        #game-screen.fb-correct #fb-layer { opacity: 1; background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); }
        #game-screen.fb-wrong #fb-layer { opacity: 1; background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); }

        .display-area {
            position: relative;
            z-index: 1;
            color: #0f172a;
            background: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
            transition: color 0.15s ease;
        }

        .display-correct, .display-wrong {
            background: transparent !important;
            color: #ffffff !important;
        }

        .keypad-wrap { position: relative; z-index: 1; }
        .fb-correct .keypad-wrap, .fb-wrong .keypad-wrap {
            background: transparent !important;
            border-top-color: transparent !important;
        }

        /* Layout: coluna centralizada no desktop, tela cheia no celular */
        #shell {
            position: relative; display: flex; flex-direction: column;
            height: 100dvh; width: 100%; max-width: 480px; overflow: hidden; background: #111827;
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }
        @media (min-width: 481px) { #shell { box-shadow: 0 0 0 1px #374151; } }
        #start-screen {
            padding-top: max(1.5rem, env(safe-area-inset-top, 0px));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));
        }
        .ico { width: 1em; height: 1em; fill: currentColor; flex: none; }

        /* Botões Prateados Reutilizáveis */
        .key-btn {
            background: linear-gradient(180deg, #ffffff 0%, #f3f4f6 40%, #d1d5db 100%);
            border: 1px solid #9ca3af;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 4px rgba(0,0,0,0.2);
            transition: all 0.05s ease;
        }

        .key-btn:active {
            background: linear-gradient(180deg, #9ca3af 0%, #e5e7eb 100%);
            transform: scale(0.98);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .custom-input {
            background: #ffffff;
            border: 2px solid #9ca3af;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
            text-align: center;
            font-weight: 800;
            color: #111827;
            outline: none;
        }

        .custom-input:focus {
            border-color: #3b82f6;
        }
    </style>
</head>

<div id="shell">

                    <button id="btn-speak" class="key-btn text-indigo-700 font-extrabold text-2xl md:text-3xl rounded-xl flex items-center justify-center">

                    <!-- TECLA 0 -->

    <script>
        // --- Sintetizador Web Audio API ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            try {
                if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { audioCtx = null; }
            return audioCtx;
        }

        function playKeySound() {
            if (!initAudio()) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(550, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.06);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.06);
        }

        function playSuccessSound() {
            if (!initAudio()) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playErrorSound() {
            if (!initAudio()) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.3);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        }

        // --- Algoritmo de Conversão de Números para Extenso (PT-BR) ---
        const unidades = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
        const especiais = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
        const dezenas = ["", "", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
        const centenas = ["", "cento", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];

        function converteTripla(n) {
            if (n === 0) return "";
            if (n === 100) return "cem";

            let str = "";
            const c = Math.floor(n / 100);
            const resto = n % 100;
            const d = Math.floor(resto / 10);
            const u = resto % 10;

            if (c > 0) str += centenas[c];

            if (resto > 0) {
                if (str.length > 0) str += " e ";
                if (resto < 10) {
                    str += unidades[resto];
                } else if (resto >= 10 && resto < 20) {
                    str += especiais[resto - 10];
                } else {
                    str += dezenas[d];
                    if (u > 0) str += " e " + unidades[u];
                }
            }
            return str;
        }

        function numeroParaExtenso(num) {
            if (num === 0) return "zero";

            const grupos = [
                { v: Math.floor(num / 1e9), um: "um bilhão", pl: "bilhões" },
                { v: Math.floor((num % 1e9) / 1e6), um: "um milhão", pl: "milhões" },
                { v: Math.floor((num % 1e6) / 1e3), um: "mil", pl: "mil" },
                { v: num % 1000 }
            ].filter(g => g.v > 0);

            const partes = grupos.map(g => {
                if (!g.pl) return converteTripla(g.v);
                return g.v === 1 ? g.um : converteTripla(g.v) + " " + g.pl;
            });

            let resultado = partes[0];
            for (let i = 1; i < partes.length; i++) {
                const v = grupos[i].v;
                const ultimo = i === partes.length - 1;
                resultado += (ultimo && (v < 100 || v % 100 === 0) ? " e " : " ") + partes[i];
            }
            return resultado;
        }

        // --- Web Speech API (Voz em Português) ---
        let vozPT = null;
        function escolherVoz() {
            if (!('speechSynthesis' in window)) return;
            const v = window.speechSynthesis.getVoices();
            vozPT = v.find(x => /^pt[-_]BR$/i.test(x.lang)) || v.find(x => /^pt/i.test(x.lang)) || null;
        }
        if ('speechSynthesis' in window) {
            escolherVoz();
            window.speechSynthesis.addEventListener && window.speechSynthesis.addEventListener('voiceschanged', escolherVoz);
        }
        let falaTimer = 0;
        function falarNumero(num) {
            if (!('speechSynthesis' in window)) return;
            clearTimeout(falaTimer);
            try {
                window.speechSynthesis.cancel();
                falaTimer = setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(numeroParaExtenso(num));
                    utterance.lang = 'pt-BR';
                    utterance.rate = 0.85;
                    utterance.pitch = 1.0;
                    if (vozPT) utterance.voice = vozPT;
                    window.speechSynthesis.speak(utterance);
                }, 60);
            } catch (e) {}
        }

        // --- Estado Global ---
        let selectedMin = 1;
        let selectedMax = 10;
        let currentTargetNumber = 0;
        let currentTyped = "";
        let scoreCorrect = 0;
        let scoreWrong = 0;
        let awaitingNextExercise = false;

        // --- Elementos do DOM ---
        const startScreen = document.getElementById('start-screen');
        const appContainer = document.getElementById('app-container');
        const configScreen = document.getElementById('config-screen');
        const gameScreen = document.getElementById('game-screen');
        
        const btnStart = document.getElementById('btn-start');
        const optionBtns = document.querySelectorAll('.option-btn');
        const inputInicio = document.getElementById('input-inicio');
        const inputFim = document.getElementById('input-fim');
        const btnConfigOk = document.getElementById('btn-config-ok');

        const scoreWrongEl = document.getElementById('score-wrong');
        const scoreRightEl = document.getElementById('score-right');
        const centerStatusEl = document.getElementById('center-status');
        const playerInputEl = document.getElementById('player-input');
        const displayArea = document.getElementById('display-area');
        const btnSpeak = document.getElementById('btn-speak');
        const nextExerciseHint = document.getElementById('next-exercise-hint');
        const btnConfigShortcut = document.getElementById('btn-config-shortcut');
        const keyNumButtons = document.querySelectorAll('.key-num');

        // --- Fullscreen & Inicialização ---
        btnStart.addEventListener('click', async () => {
            initAudio();

            try {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    await elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    await elem.webkitRequestFullscreen();
                }
            } catch (err) {
                console.log("Fullscreen indisponível ou bloqueado", err);
            }

            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('portrait');
                }
            } catch (err) {
                console.log("Bloqueio de orientação indisponível", err);
            }

            startScreen.classList.add('hidden');
            appContainer.classList.remove('hidden');
            showConfigScreen();
        });

        // --- Atalhos de Configuração Rápidos ---
        optionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                playKeySound();
                selectedMin = parseInt(btn.getAttribute('data-min'));
                selectedMax = parseInt(btn.getAttribute('data-max'));
                
                inputInicio.value = selectedMin;
                inputFim.value = selectedMax;

                showGameScreen();
            });
        });

        // --- Ação do Botão OK ---
        btnConfigOk.addEventListener('click', () => {
            playKeySound();
            let valInicio = parseInt(inputInicio.value);
            let valFim = parseInt(inputFim.value);

            if (isNaN(valInicio)) valInicio = 0;
            valInicio = Math.min(Math.max(0, valInicio), 1999999990);
            if (isNaN(valFim) || valFim <= valInicio) valFim = valInicio + 10;

            selectedMin = valInicio;
            selectedMax = Math.min(2000000000, valFim);
            inputInicio.value = selectedMin;
            inputFim.value = selectedMax;

            showGameScreen();
        });

        function showConfigScreen() {
            if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
            clearTimeout(falaTimer);
            gameScreen.classList.add('hidden');
            configScreen.classList.remove('hidden');
            centerStatusEl.textContent = `${formatNumberShort(selectedMin)} à ${formatNumberShort(selectedMax)}`;
        }

        function showGameScreen() {
            configScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            centerStatusEl.textContent = `${formatNumberShort(selectedMin)} à ${formatNumberShort(selectedMax)}`;
            scoreCorrect = 0;
            scoreWrong = 0;
            scoreRightEl.textContent = scoreCorrect;
            scoreWrongEl.textContent = scoreWrong;
            
            startNewExercise();
        }

        function formatNumberShort(num) {
            const f = (x, suf) => String(+x.toFixed(2)).replace('.', ',') + ' ' + suf;
            if (num >= 1e9 && num % 1e8 === 0) return f(num / 1e9, 'bi');
            if (num >= 1e6 && num % 1e5 === 0) return f(num / 1e6, 'mi');
            if (num >= 1e3 && num % 100 === 0) return f(num / 1e3, 'mil');
            return num.toLocaleString('pt-BR');
        }

        btnConfigShortcut.addEventListener('click', () => {
            playKeySound();
            showConfigScreen();
        });

        // --- Ajuste de Fonte Dinâmico do Display ---
        function updateDisplayFontSize() {
            const container = displayArea;
            const textLength = currentTyped.length || 1;
            
            const containerWidth = container.clientWidth - 24;
            const containerHeight = container.clientHeight - 24;

            let fontSize = Math.min(containerHeight * 0.7, containerWidth / (textLength * 0.6));
            fontSize = Math.max(32, Math.min(fontSize, 220));

            playerInputEl.style.fontSize = `${fontSize}px`;
        }

        // --- Regras do Jogo ---
        function startNewExercise() {
            awaitingNextExercise = false;
            currentTyped = "";
            playerInputEl.textContent = "";
            nextExerciseHint.classList.add('hidden');
            
            // Fundo padrão do display
            displayArea.classList.remove('display-correct', 'display-wrong');
            gameScreen.classList.remove('fb-correct', 'fb-wrong');

            // Sorteio
            const range = selectedMax - selectedMin + 1;
            const anterior = currentTargetNumber;
            let tentativas = 0;
            do {
                currentTargetNumber = Math.floor(Math.random() * range) + selectedMin;
            } while (range > 1 && currentTargetNumber === anterior && ++tentativas < 20);

            // Fala o número sorteado em PT-BR
            falarNumero(currentTargetNumber);
        }

        function handleKeyPress(num) {
            if (awaitingNextExercise) return;

            playKeySound();

            const targetStr = currentTargetNumber.toString();
            
            if (currentTyped.length < targetStr.length) {
                currentTyped += num;
                playerInputEl.textContent = currentTyped;
                updateDisplayFontSize();

                // Correção automática ao preencher a quantidade de dígitos
                if (currentTyped.length === targetStr.length) {
                    awaitingNextExercise = true;
                    
                    if (currentTyped === targetStr) {
                        playSuccessSound();
                        scoreCorrect++;
                        scoreRightEl.textContent = scoreCorrect;
                        displayArea.classList.add('display-correct');
                        gameScreen.classList.add('fb-correct');
                    } else {
                        playErrorSound();
                        scoreWrong++;
                        scoreWrongEl.textContent = scoreWrong;
                        displayArea.classList.add('display-wrong');
                        gameScreen.classList.add('fb-wrong');
                    }

                    nextExerciseHint.classList.remove('hidden');
                }
            }
        }

        // Botão Ouvir / Falar
        btnSpeak.addEventListener('click', () => {
            playKeySound();
            falarNumero(currentTargetNumber);
        });

        // LIMPEZA E AVANÇO: Somente ao tocar no display
        displayArea.addEventListener('click', () => {
            if (awaitingNextExercise) {
                playKeySound();
                startNewExercise();
            } else {
                falarNumero(currentTargetNumber);
            }
        });

        // Teclas do Teclado Numérico da Interface
        keyNumButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-val');
                handleKeyPress(val);
            });
        });

        // Suporte a Teclado Físico
        window.addEventListener('keydown', (e) => {
            if (!gameScreen.classList.contains('hidden')) {
                if (e.key >= '0' && e.key <= '9') {
                    handleKeyPress(e.key);
                } else if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    if (awaitingNextExercise) {
                        startNewExercise();
                    } else {
                        falarNumero(currentTargetNumber);
                    }
                }
            }
        });

        // Tira o foco dos botões após o toque (evita Espaço/Enter reativar a tecla)
        document.addEventListener('click', (e) => {
            const b = e.target.closest && e.target.closest('button');
            if (b) b.blur();
        });

        // Reajuste de tamanho ao redimensionar viewport
        window.addEventListener('resize', () => {
            if (!gameScreen.classList.contains('hidden')) {
                updateDisplayFontSize();
            }
        });
    </script>
</body>
</html>
