<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff70a6">
<title>Contagem Mágica 🎈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  :root {
    --ink: #2b1b4d;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    color: var(--ink);
    background: #fff7fb;
  }
  button { font: inherit; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 4px solid #2b1b4d; outline-offset: 3px; }

  /* =====================================================
     BOLHAS 3D (usadas no dominó e na tela inicial)
     ===================================================== */
  .bubble {
    position: relative;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0.35em 0.7em rgba(0,0,0,.30), inset -0.15em -0.2em 0.45em rgba(0,0,0,.38);
    transition: transform .14s cubic-bezier(.175,.885,.32,1.275), filter .2s ease;
  }
  .bubble::before { /* brilho */
    content: ''; position: absolute; top: 8%; left: 15%; width: 66%; height: 38%;
    border-radius: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,.95), rgba(255,255,255,0));
    pointer-events: none;
  }
  .bubble:active { transform: scale(.88); }

  .b-red    { background: radial-gradient(circle at 35% 30%, #ff6b6b, #e60000 60%, #800000); }
  .b-yellow { background: radial-gradient(circle at 35% 30%, #fff06b, #ffc800 60%, #c98f00); }
  .b-blue   { background: radial-gradient(circle at 35% 30%, #54ccff, #0088ff 60%, #0044cc); }
  .b-pink   { background: radial-gradient(circle at 35% 30%, #ff7ad2, #ff0099 60%, #99005c); }
  .b-green  { background: radial-gradient(circle at 35% 30%, #7dff7d, #00c800 60%, #006600); }
  .b-purple { background: radial-gradient(circle at 35% 30%, #e888ff, #a000e6 60%, #590080); }

  /* bolha estourada = bolha preta brilhante */
  .bubble.popped {
    background: radial-gradient(circle at 35% 25%, #707070, #232323 55%, #000) !important;
    box-shadow: 0 .2em .4em rgba(0,0,0,.6), inset -0.1em -0.1em .35em rgba(0,0,0,.9);
    transform: scale(.92);
  }
  .bubble.popped::before { opacity: .55; }


  /* =====================================================
     TELA INICIAL
     ===================================================== */
  #startScreen {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
    text-align: center; overflow: hidden;
    background: linear-gradient(135deg, #ff70a6, #ff9770 25%, #ffd670 50%, #70d6ff 75%, #eb70ff);
    background-size: 300% 300%;
    animation: gradientBG 9s ease infinite;
  }
  @keyframes gradientBG { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .cloud {
    position: absolute; left: 0; height: 44px; width: 130px;
    background: rgba(255,255,255,.88); border-radius: 100px;
    animation: floatCloud linear infinite; pointer-events: none;
  }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 54px; height: 54px; top: -26px; left: 22px; }
  .cloud::after  { width: 70px; height: 70px; top: -36px; left: 62px; }
  @keyframes floatCloud { from { transform: translateX(-240px); } to { transform: translateX(110vw); } }

  .start-top { position: relative; z-index: 1; margin-top: 4vh; }
  .start-bubbles { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; font-size: 14px; }
  .start-bubbles .bubble { width: 4.4em; height: 4.4em; font-size: inherit; cursor: default; animation: bounce 1.2s ease-in-out infinite; }
  .start-bubbles .bubble span { font-size: 2.2rem; line-height: 1; position: relative; z-index: 1; }
  .start-bubbles .bubble:nth-child(2) { animation-delay: .2s; }
  .start-bubbles .bubble:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

  .cartoon-title {
    margin: 0; font-family: 'Outfit', 'Fredoka', sans-serif; font-weight: 900;
    font-size: clamp(2.6rem, 11vw, 5.5rem); line-height: 1.02; color: #fffb00; letter-spacing: 1px;
    text-shadow: 3px 3px 0 #ff0055, 6px 6px 0 #00a2ff, 9px 9px 0 #8c00ff, 12px 12px 18px rgba(0,0,0,.35);
  }
  .start-sub {
    display: inline-block; margin: 28px 0 0; padding: 10px 24px; border-radius: 999px;
    background: rgba(43,27,77,.28); color: #fff; font-weight: 700; font-size: clamp(1.05rem, 4.2vw, 1.5rem);
    text-shadow: 0 2px 4px rgba(0,0,0,.35);
  }

  .start-btn {
    position: relative; z-index: 1; width: min(100%, 380px);
    padding: 20px 28px; border-radius: 999px; color: #fff;
    font-size: clamp(1.7rem, 7vw, 2.4rem); font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(180deg, #00ff66, #00b33c);
    border: 5px solid #fff;
    box-shadow: 0 10px 0 #007327, 0 16px 24px rgba(0,0,0,.35);
    text-shadow: 2px 2px 4px rgba(0,0,0,.4);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .start-btn:active { animation: none; transform: translateY(6px) scale(.97); box-shadow: 0 4px 0 #007327, 0 8px 12px rgba(0,0,0,.3); }
  @keyframes pulse { 0%,100% { transform: scale(1) rotate(-1deg); } 50% { transform: scale(1.06) rotate(1deg); } }

  .start-tip {
    position: relative; z-index: 1; margin: 0; padding: 0 8px;
    font-family: 'Outfit', 'Fredoka', sans-serif; font-weight: 900; letter-spacing: .5px;
    font-size: clamp(1.15rem, 4.8vw, 1.6rem); line-height: 1.2; color: #fff;
    text-shadow: 2px 2px 0 #7b2ff7, 4px 4px 0 #3b1a9e, 6px 6px 12px rgba(0,0,0,.35);
  }

  /* =====================================================
     TELA DO JOGO
     ===================================================== */
  #gameScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: row; align-items: stretch;
    padding: calc(8px + var(--safe-t)) calc(8px + var(--safe-r)) calc(8px + var(--safe-b)) calc(8px + var(--safe-l));
    gap: 10px;
    opacity: 0; transition: opacity .5s ease;
    background:
      radial-gradient(circle at 12% 18%, #ffe3f1 0, transparent 38%),
      radial-gradient(circle at 80% 85%, #dff3ff 0, transparent 42%),
      #fffaf5;
  }
  #gameScreen.visible { opacity: 1; }

  /* Palco: ocupa todo o lado esquerdo; o dominó é a maior peça 1:2 que cabe nele */
  #stage {
    flex: 1 1 0; min-width: 0; height: 100%;
    container-type: size;
    display: flex; align-items: center; justify-content: center;
  }

  /* Sem moldura: é só a arrumação das bolhas, como num dominó */
  .domino {
    width: 100cqw;
    height: 100cqh;
    container-type: size;
    display: grid; grid-template-rows: 1fr 5cqh 1fr;
  }
  .domino.enter { animation: dominoIn .45s ease-out; }
  @keyframes dominoIn { from { transform: translateY(4%); opacity: 0; } to { transform: none; opacity: 1; } }
  .domino.shake { animation: shake .4s ease-in-out; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-3%); } 40%,80% { transform: translateX(3%); } }

  /* Divisória central: ajuda a ver e memorizar a quantidade de cada lado */
  .divider {
    position: relative; align-self: center; justify-self: center;
    width: 82%; height: clamp(6px, 1.1cqh, 12px); border-radius: 99px;
    background: linear-gradient(180deg, #ff5a5a, #d90000);
    box-shadow: 0 2px 5px rgba(217,0,0,.4), inset 0 2px 2px rgba(255,255,255,.5);
  }
  .divider::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: clamp(12px, 3.6cqw, 26px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3a8, #f2b200 60%, #a56d00);
    box-shadow: 0 2px 4px rgba(0,0,0,.35);
  }

  .half {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    min-height: 0; align-items: center; justify-items: center;
  }
  /* Bolhas grandes: ocupam quase toda a casa da grade 3×3 */
  .pip { --d: min(31cqw, 15.4cqh); width: var(--d); aspect-ratio: 1; font-size: calc(var(--d) * .13); }
  .pip.enter { animation: pipIn .45s cubic-bezier(.2,1.5,.4,1) backwards; }
  @keyframes pipIn { from { transform: scale(0); } to { transform: scale(1); } }
  .pip.restore { animation: restore .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes restore { from { transform: scale(.6); } to { transform: scale(1); } }

  /* ---------- Efeito de estouro ---------- */
  #fx { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  .fx-ring, .fx-p, .fx-text { position: fixed; transform: translate(-50%, -50%); }
  .fx-ring { border-radius: 50%; animation: fxRing .5s ease-out forwards; }
  @keyframes fxRing {
    from { transform: translate(-50%, -50%) scale(.85); opacity: .95; }
    to   { transform: translate(-50%, -50%) scale(2.3);  opacity: 0; }
  }
  .fx-p { border-radius: 50%; animation: fxFly .65s cubic-bezier(.1,.75,.3,1) forwards; box-shadow: inset -2px -2px 4px rgba(0,0,0,.25); }
  @keyframes fxFly {
    from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15); opacity: 0; }
  }
  .fx-text {
    font-family: 'Outfit', 'Fredoka', sans-serif; font-weight: 900; white-space: nowrap; color: #fff;
    -webkit-text-stroke: .09em var(--c); paint-order: stroke fill;
    text-shadow: 0 .06em 0 var(--c), 0 .12em .2em rgba(0,0,0,.35);
    animation: fxText .75s ease-out forwards;
  }
  @keyframes fxText {
    0%   { transform: translate(-50%, -50%) scale(.2) rotate(var(--r)); opacity: 0; }
    25%  { transform: translate(-50%, -50%) scale(1.2) rotate(var(--r)); opacity: 1; }
    100% { transform: translate(-50%, calc(-50% - var(--rise))) scale(1) rotate(var(--r)); opacity: 0; }
  }
  /* a bolha incha e brilha antes de virar preta */
  .pip.bursting { animation: swell .12s ease-out forwards; filter: brightness(1.35) saturate(1.2); }
  @keyframes swell { to { transform: scale(1.28); } }
  .pip.snap { animation: snap .3s cubic-bezier(.2,1.5,.4,1); }
  @keyframes snap { from { transform: scale(1.25); } to { transform: scale(.92); } }

  /* Teclado numérico (1–12) */
  #keypad {
    --size: min(15vw, calc((100dvh - 16px - var(--safe-t) - var(--safe-b)) / 12 - 8px));
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    padding: 2px 0;
  }
  .num-btn {
    width: var(--size); height: var(--size); min-width: 38px; min-height: 38px;
    border-radius: 50%; color: #fff; font-weight: 700;
    font-size: calc(var(--size) * .46);
    background: radial-gradient(circle at 35% 28%, hsl(var(--h) 100% 68%), hsl(var(--h) 90% 48%) 55%, hsl(var(--h) 85% 33%));
    border: 3px solid rgba(255,255,255,.9);
    box-shadow: 0 5px 10px rgba(0,0,0,.3), inset 0 3px 5px rgba(255,255,255,.7), inset 0 -4px 6px rgba(0,0,0,.35);
    text-shadow: 1px 2px 3px rgba(0,0,0,.55);
    transition: transform .1s ease;
  }
  .num-btn:active { transform: scale(.88); }
  .num-btn.wrong { animation: wobble .35s ease; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }

  /* Pop-up de acerto */
  #feedback {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background: rgba(43,27,77,.55); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #feedback.show { opacity: 1; }
  .feedback-card {
    transform: scale(.5); transition: transform .3s cubic-bezier(.2,1.4,.4,1);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 26px 40px 30px; border-radius: 36px; border: 8px solid #fff; color: #fff; text-align: center;
    background: linear-gradient(180deg, #ffd93b, #ff5fa8 55%, #8e44ff);
    box-shadow: 0 20px 40px rgba(0,0,0,.35);
  }
  #feedback.show .feedback-card { transform: scale(1); }
  .feedback-emoji { font-size: 4.5rem; line-height: 1; animation: bounce 1s ease-in-out infinite; }
  .feedback-title { margin: 0; font-size: 2.2rem; font-weight: 700; text-shadow: 0 3px 6px rgba(0,0,0,.35); }
  .feedback-number { font-family: 'Outfit', 'Fredoka', sans-serif; font-weight: 900; font-size: 5rem; line-height: 1; color: #fffb00; text-shadow: 3px 3px 0 #ff0055, 6px 6px 0 #5b2bd6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<body>

<!-- TELA INICIAL -->
<main id="startScreen">
  <div class="cloud" style="top:3%;  animation-duration:18s;"></div>
  <div class="cloud" style="top:20%; animation-duration:26s; animation-delay:-8s; transform:scale(1.3);"></div>
  <div class="cloud" style="top:52%; animation-duration:21s; animation-delay:-12s;"></div>

  <div class="start-top">
    <div class="start-bubbles" aria-hidden="true">
      <div class="bubble b-red"><span>⭐</span></div>
      <div class="bubble b-yellow"><span>💖</span></div>
      <div class="bubble b-blue"><span>😄</span></div>
    </div>
    <h1 class="cartoon-title">Contagem<br>Mágica 🎈</h1>
    <p class="start-sub">Conte as bolinhas do dominó e toque no número!</p>
  </div>

  <button id="btnStart" class="start-btn" type="button"><span>Jogar</span><span aria-hidden="true">▶</span></button>

  <div class="start-tip">👆 Toque nas bolinhas para estourar e ajudar na contagem</div>
</main>

<!-- TELA DO JOGO -->
<div id="gameScreen">
  <div id="stage">
    <div id="domino" class="domino" role="img" aria-label="Bolinhas para contar">
      <div id="halfTop" class="half"></div>
      <div class="divider" aria-hidden="true"></div>
      <div id="halfBottom" class="half"></div>
    </div>
  </div>
  <nav id="keypad" aria-label="Números de 1 a 12"></nav>
</div>

<div id="fx" aria-hidden="true"></div>

<!-- POP-UP DE ACERTO -->
<div id="feedback" aria-live="polite">
  <div class="feedback-card">
    <div class="feedback-emoji" id="fbEmoji">🌟</div>
    <h2 class="feedback-title" id="fbTitle">Parabéns!</h2>
    <div class="feedback-number" id="fbNumber">7</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ---------- Configuração ---------- */
  const MAX_SUM = 12;                       // 2 lados × 6 bolinhas
  const COLORS = ['b-red', 'b-yellow', 'b-blue', 'b-pink', 'b-green', 'b-purple'];
  const POP = {                              // cor principal e cor clara de cada bolha, para as partículas
    'b-red':    ['#ff2b2b', '#ff9d9d'],
    'b-yellow': ['#ffc800', '#fff3a0'],
    'b-blue':   ['#0a8cff', '#9bd8ff'],
    'b-pink':   ['#ff1aa3', '#ffa6dd'],
    'b-green':  ['#12c912', '#a6ffa6'],
    'b-purple': ['#a512ea', '#e6a8ff']
  };
  const POP_WORDS = ['POP!', 'POP!', 'ESTOUROU!', 'POF!', 'PLOC!'];
  const WORDS = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze'];
  const PRAISE = [
    ['🌟', 'Parabéns!'], ['🎉', 'Muito bem!'], ['🦄', 'Incrível!'],
    ['🚀', 'Você arrasou!'], ['🏆', 'Campeão!'], ['🌈', 'Show de bola!']
  ];

  /* Posições [linha, coluna] numa grade 3×3 — padrão tradicional do dominó */
  const PATTERNS = {
    1: [[2,2]],
    2: [[1,1],[3,3]],
    3: [[1,1],[2,2],[3,3]],
    4: [[1,1],[1,3],[3,1],[3,3]],
    5: [[1,1],[1,3],[2,2],[3,1],[3,3]],
    6: [[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
  };

  /* ---------- Estado ---------- */
  let target = 0;
  let locked = false;
  let audioCtx = null;
  let nextTimer = null;

  const $ = id => document.getElementById(id);
  const rand = n => Math.floor(Math.random() * n);

  /* ---------- Áudio (sintetizado) ---------- */
  function initAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* sem áudio */ }
  }

  function tone({ type = 'sine', from, to, start = 0, dur = 0.1, vol = 0.3 }) {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime + start;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, t0);
      if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  function noiseBurst(dur = 0.09, vol = 0.4) {
    if (!audioCtx) return;
    try {
      const len = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = audioCtx.createBufferSource();
      const hp = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      hp.type = 'highpass'; hp.frequency.value = 1400;
      gain.gain.value = vol;
      src.buffer = buf;
      src.connect(hp); hp.connect(gain); gain.connect(audioCtx.destination);
      src.start();
    } catch (e) {}
  }
  function playPop() {
    const f = 300 + rand(140);
    tone({ from: f, to: f * 2.8, dur: 0.09, vol: 0.5 });                       // "pop" grave
    noiseBurst(0.09, 0.45);                                                    // estalo
    tone({ type: 'triangle', from: 1800, to: 2800, start: 0.03, dur: 0.12, vol: 0.12 });  // brilho
  }
  const playTapPopped = () => tone({ from: 350, to: 850, dur: 0.06, vol: 0.5 });   // 'pop' simples da versão original
  const playError = () => tone({ from: 260, to: 150, dur: 0.22, vol: 0.3 });
  const playWin   = () => [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
    tone({ type: 'triangle', from: f, start: i * 0.09, dur: 0.35, vol: 0.3 }));

  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR'; u.rate = 0.95; u.pitch = 1.25;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- Tela cheia (best effort) ---------- */
  async function goFullscreen() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) {}
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('portrait'); } catch (e) {}
  }

  /* ---------- Dominó ---------- */

  /* Divide o total em dois lados (0–6 cada). Prefere nunca deixar um lado vazio. */
  function splitTotal(n) {
    const min = n >= 2 ? Math.max(1, n - 6) : Math.max(0, n - 6);
    const max = n >= 2 ? Math.min(6, n - 1) : Math.min(6, n);
    const top = min + rand(max - min + 1);
    return [top, n - top];
  }

  /* Efeito de estouro: anel, partículas, texto POP! e a bolha vira preta */
  function burst(pip, colorClass) {
    const fx = $('fx');
    const r = pip.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, d = r.width;
    const [main, light] = POP[colorClass] || ['#ff2b2b', '#ff9d9d'];
    const add = (el, ms) => { fx.appendChild(el); setTimeout(() => el.remove(), ms); return el; };
    const place = (el, w, h = w) => { Object.assign(el.style, { left: cx + 'px', top: cy + 'px', width: w + 'px', height: h + 'px' }); return el; };

    // dois anéis de onda
    [[main, 0], ['#fff', 70]].forEach(([c, delay]) => {
      const ring = document.createElement('div');
      ring.className = 'fx-ring';
      place(ring, d);
      ring.style.border = `${Math.max(4, d * 0.07)}px solid ${c}`;
      ring.style.animationDelay = delay + 'ms';
      add(ring, 650);
    });

    // partículas (gotas de bolha) em todas as direções
    const N = 16;
    for (let i = 0; i < N; i++) {
      const ang = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const dist = d * (0.75 + Math.random() * 0.65);
      const size = d * (0.09 + Math.random() * 0.12);
      const p = document.createElement('div');
      p.className = 'fx-p';
      place(p, size);
      p.style.background = i % 3 === 0 ? '#fff' : (i % 3 === 1 ? main : light);
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      add(p, 750);
    }

    // texto POP!
    const t = document.createElement('div');
    t.className = 'fx-text';
    t.textContent = POP_WORDS[rand(POP_WORDS.length)];
    place(t, 0, 0);
    t.style.width = t.style.height = 'auto';
    t.style.fontSize = Math.max(22, d * 0.36) + 'px';
    t.style.setProperty('--c', main);
    t.style.setProperty('--r', (rand(31) - 15) + 'deg');
    t.style.setProperty('--rise', d * 0.55 + 'px');
    add(t, 850);

    try { if (navigator.vibrate) navigator.vibrate(18); } catch (e) {}
  }

  function buildHalf(container, count, colorClass) {
    container.innerHTML = '';
    if (count === 0) return;
    PATTERNS[count].forEach(([row, col], i) => {
      const pip = document.createElement('div');
      pip.className = `bubble pip enter ${colorClass}`;
      pip.style.gridRow = row;
      pip.style.gridColumn = col;
      pip.style.animationDelay = `${i * 40}ms`;
      pip.addEventListener('animationend', () => { pip.classList.remove('enter', 'restore'); pip.style.animationDelay = ''; });

      pip.addEventListener('pointerdown', e => {
        e.preventDefault();
        initAudio();
        if (pip.classList.contains('bursting')) return;       // evita toque duplo no meio do estouro

        if (pip.classList.contains('popped')) {               // tocar de novo devolve a bolha
          pip.classList.remove('popped', 'snap');
          pip.classList.remove('restore'); void pip.offsetWidth; pip.classList.add('restore');
          playTapPopped();
          return;
        }

        playPop();
        burst(pip, colorClass);
        pip.classList.remove('enter', 'restore', 'snap');
        pip.classList.add('bursting');
        setTimeout(() => {
          pip.classList.remove('bursting');
          pip.classList.add('popped', 'snap');
        }, 120);
      });
      container.appendChild(pip);
    });
  }

  function renderDomino(n) {
    const [top, bottom] = splitTotal(n);
    const c1 = rand(COLORS.length);
    const c2 = (c1 + 1 + rand(COLORS.length - 1)) % COLORS.length;   // cor diferente da primeira

    buildHalf($('halfTop'), top, COLORS[c1]);
    buildHalf($('halfBottom'), bottom, COLORS[c2]);

    const domino = $('domino');
    domino.classList.remove('enter');
    void domino.offsetWidth;                 // reinicia a animação
    domino.classList.add('enter');
    domino.setAttribute('aria-label', 'Conte as bolinhas.');
  }

  function startRound() {
    locked = false;
    let n;
    do { n = 1 + rand(MAX_SUM); } while (n === target);   // nunca repete o número anterior
    target = n;
    renderDomino(target);
  }

  /* ---------- Respostas ---------- */
  function onAnswer(btn, value) {
    if (locked) return;
    initAudio();

    if (value === target) {
      locked = true;
      playWin();
      if (typeof confetti === 'function') {
        confetti({ particleCount: 110, spread: 85, origin: { y: 0.6 } });
      }
      const [emoji, title] = PRAISE[rand(PRAISE.length)];
      $('fbEmoji').textContent = emoji;
      $('fbTitle').textContent = title;
      $('fbNumber').textContent = target;
      $('feedback').classList.add('show');
      speak(`${title.replace('!', '')}! ${WORDS[target]}!`);

      nextTimer = setTimeout(() => {
        $('feedback').classList.remove('show');
        startRound();
      }, 1800);
    } else {
      playError();
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      const d = $('domino');
      d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    }
  }

  /* ---------- Inicialização ---------- */
  function buildKeypad() {
    const pad = $('keypad');
    for (let i = 1; i <= MAX_SUM; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'num-btn';
      b.textContent = i;
      b.setAttribute('aria-label', String(i));
      b.style.setProperty('--h', Math.round((i - 1) * 30 + 350) % 360);   // 12 cores em volta do arco-íris
      b.addEventListener('pointerdown', e => { e.preventDefault(); onAnswer(b, i); });
      b.addEventListener('animationend', () => b.classList.remove('wrong'));
      pad.appendChild(b);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    buildKeypad();
    $('btnStart').addEventListener('click', async () => {
      initAudio();
      await goFullscreen();
      $('startScreen').style.display = 'none';
      $('gameScreen').classList.add('visible');
      startRound();
    });
  });
})();
</script>
</body>
</html>
