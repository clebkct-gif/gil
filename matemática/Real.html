<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafio do Caixa: BRL Cinematográfico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #050811;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Fundo Estilo Cassino / Banco Cinematográfico */
        .cinema-bg {
            background: radial-gradient(circle at 50% 20%, #111827 0%, #070a14 60%, #030408 100%);
        }

        /* -------------------------------------------------------------
           CÉDULAS CINEMATOGRÁFICAS (UMA ABAIXO DA OUTRA, OCUPANDO A LARGURA TOTAL)
        ------------------------------------------------------------- */
        .bill-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .bill-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2.3 / 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7), inset 0 0 2px rgba(255, 255, 255, 0.4);
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.12s ease, filter 0.12s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .bill-card:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .bill-card:active {
            transform: scale(0.97) translateY(2px);
            filter: brightness(1.15);
        }

        /* Efeito de Textura de Papel-Moeda e Micro-Guilloché */
        .bill-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 4px);
            background-size: 8px 8px, 6px 6px;
            pointer-events: none;
            z-index: 1;
        }

        /* Efeito Suave de Brilho Dinâmico */
        .bill-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 60%;
            height: 200%;
            background: linear-gradient(
                60deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.15) 50%, 
                transparent 70%
            );
            transform: rotate(25deg);
            pointer-events: none;
            transition: left 0.6s ease;
            z-index: 2;
        }

        .bill-card:hover::after {
            left: 200%;
        }

        /* Marca d'água Realista com Efígie/Textura */
        .bill-watermark {
            position: absolute;
            left: 14%;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 70%, transparent 100%);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .bill-watermark::after {
            content: 'BCB';
            font-size: 10px;
            font-weight: 900;
            opacity: 0.25;
            letter-spacing: 1px;
        }

        /* Faixa de Segurança Realista */
        .hologram-strip {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 22%;
            width: 5%;
            background: linear-gradient(180deg, 
                rgba(212, 175, 55, 0.4) 0%, 
                rgba(255, 255, 255, 0.6) 20%, 
                rgba(212, 175, 55, 0.4) 40%,
                rgba(255, 255, 255, 0.6) 60%,
                rgba(212, 175, 55, 0.4) 80%,
                rgba(255, 255, 255, 0.6) 100%);
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 2;
            opacity: 0.7;
        }

        /* Elemento de Relevo Ornamental SVG no fundo */
        .bill-bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        /* CORES E ESTILOS DAS CÉDULAS DO REAL */
        .bill-200 { background: linear-gradient(135deg, #7a6e60, #bfae99, #5e5246); color: #1e1913; border-left: 6px solid #e2d7c5; }
        .bill-100 { background: linear-gradient(135deg, #155d7e, #4ea3c8, #0b3a50); color: #03141d; border-left: 6px solid #80deea; }
        .bill-50  { background: linear-gradient(135deg, #96532b, #cd854e, #623213); color: #240e02; border-left: 6px solid #ffcc80; }
        .bill-20  { background: linear-gradient(135deg, #b06907, #e0a324, #734100); color: #281400; border-left: 6px solid #ffe082; }
        .bill-10  { background: linear-gradient(135deg, #80161a, #bd3a3f, #4d090c); color: #210103; border-left: 6px solid #ef5350; }
        .bill-5   { background: linear-gradient(135deg, #532f60, #885597, #31153b); color: #120418; border-left: 6px solid #ce93d8; }
        .bill-2   { background: linear-gradient(135deg, #12515e, #3a8a9a, #072f38); color: #021014; border-left: 6px solid #90caf9; }
        .bill-1   { background: linear-gradient(135deg, #27472b, #4e7a53, #132616); color: #051207; border-left: 6px solid #a5d6a7; }

        /* Estilo da Tag de Valor das Cédulas */
        .bill-value-badge {
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .bill-written-val {
            font-size: 1.35rem;
            font-weight: 900;
            text-shadow: 0 1px 4px rgba(0,0,0,0.7), 0 0 2px rgba(255,255,255,0.4);
            letter-spacing: -0.02em;
        }

        /* -------------------------------------------------------------
           MOEDAS HIPER-REALISTAS DE LADO A LADO (VETORIAL SVG INTEGRADO)
        ------------------------------------------------------------- */
        .coins-bar {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 8px;
            border-radius: 16px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .coin-btn {
            position: relative;
            flex: 1;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.12s ease;
            background: transparent;
            border: none;
            padding: 0;
            outline: none;
        }

        .coin-btn svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.7));
            transition: filter 0.12s ease;
        }

        .coin-btn:hover {
            transform: scale(1.08);
        }

        .coin-btn:hover svg {
            filter: drop-shadow(0px 6px 10px rgba(0, 0, 0, 0.9)) drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.4));
        }

        .coin-btn:active {
            transform: scale(0.92) translateY(2px);
        }

        /* Efeito Glow / Confetes */
        .glow-win {
            animation: winPulse 1s infinite alternate;
        }
        @keyframes winPulse {
            0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.9); }
        }

        /* Estado desabilitado ao acertar */
        .money-disabled {
            opacity: 0.4 !important;
            pointer-events: none !important;
            filter: grayscale(0.7);
        }
    </style>
</head>

    <!-- LÓGICA DE JOGO, AUDIO E SÍNTESE DE VOZ (TTS) -->
    <script>
        let targetValue = 0.00;
        let currentValue = 0.00;
        let isHit = false;

        const startOverlay = document.getElementById('startOverlay');
        const btnStartGame = document.getElementById('btnStartGame');

        const displayTargetCard = document.getElementById('displayTargetCard');
        const displayCurrentCard = document.getElementById('displayCurrentCard');
        const displayTarget = document.getElementById('displayTarget');
        const displayCurrent = document.getElementById('displayCurrent');
        const moneyButtons = document.querySelectorAll('[data-value]');

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBillSound() {
            try {
                initAudio();
                const bufferSize = audioCtx.sampleRate * 0.08;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1400;
                filter.Q.value = 4;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch (e) {}
        }

        function playCoinSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(3400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.1);
                    osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
                });
            } catch (e) {}
        }

        function playOverSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }

        function numberToExtensoBRL(amount) {
            const integerPart = Math.floor(amount);
            const centsPart = Math.round((amount - integerPart) * 100);
            let result = '';
            if (integerPart > 0) {
                result += `${integerPart} ${integerPart === 1 ? 'real' : 'reais'}`;
            }
            if (centsPart > 0) {
                if (integerPart > 0) result += ' e ';
                result += `${centsPart} ${centsPart === 1 ? 'centavo' : 'centavos'}`;
            }
            if (integerPart === 0 && centsPart === 0) {
                result = 'zero reais';
            }
            return result;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function speakTargetValue() {
            speakText(`Meta: ${numberToExtensoBRL(targetValue)}`);
        }

        function speakCurrentAccumulated() {
            speakText(numberToExtensoBRL(currentValue));
        }

        function setControlsLocked(locked) {
            moneyButtons.forEach(btn => {
                if (locked) {
                    btn.classList.add('money-disabled');
                } else {
                    btn.classList.remove('money-disabled');
                }
            });
        }

        function generateRandomTarget() {
            const randomRaw = Math.random() * 2999.99 + 0.01;
            targetValue = Math.round(randomRaw * 100) / 100;
            currentValue = 0.00;
            isHit = false;
            setControlsLocked(false);
            updateDisplays();
            speakTargetValue();
        }

        function formatBRL(val) {
            return val.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        function updateDisplays() {
            displayTarget.textContent = formatBRL(targetValue);
            displayCurrent.textContent = formatBRL(currentValue);

            displayCurrentCard.classList.remove('border-emerald-500', 'border-rose-500', 'glow-win');

            if (Math.abs(currentValue - targetValue) < 0.001) {
                isHit = true;
                displayCurrentCard.classList.add('border-emerald-500', 'glow-win');
                setControlsLocked(true);
                playWinSound();
                speakText(`Parabéns! Você acertou ${numberToExtensoBRL(targetValue)}`);
            } else if (currentValue > targetValue) {
                playOverSound();
                speakText(`Passou de ${numberToExtensoBRL(targetValue)}. Zerado!`);
                currentValue = 0.00;
                displayCurrent.textContent = formatBRL(currentValue);
                displayCurrentCard.classList.add('border-rose-500');
                setTimeout(() => {
                    displayCurrentCard.classList.remove('border-rose-500');
                }, 600);
            }
        }

        function requestFullscreenMode() {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }
        }

        btnStartGame.addEventListener('click', () => {
            initAudio();
            requestFullscreenMode();
            startOverlay.classList.add('hidden');
            generateRandomTarget();
        });

        displayTargetCard.addEventListener('click', () => {
            if (isHit) {
                generateRandomTarget();
            } else {
                speakTargetValue();
            }
        });

        displayCurrentCard.addEventListener('click', () => {
            if (currentValue > 0 && !isHit) {
                currentValue = 0.00;
                updateDisplays();
                speakText('Zero reais');
            }
        });

        moneyButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isHit) return;

                const val = parseFloat(btn.getAttribute('data-value'));
                const isCoin = btn.getAttribute('data-type') === 'coin';

                if (isCoin) {
                    playCoinSound();
                } else {
                    playBillSound();
                }

                currentValue = Math.round((currentValue + val) * 100) / 100;
                updateDisplays();

                if (!isHit && currentValue <= targetValue && currentValue > 0) {
                    speakCurrentAccumulated();
                }
            });
        });
    </script>
