<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Oráculo das Runas - Jogo da Forca Épico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 17, 26, 0.82);
      --panel-border: rgba(0, 229, 255, 0.18);
      --cyan-glow: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.15);
      --gold-glow: #ffb703;
      --gold-dim: rgba(255, 183, 3, 0.15);
      --crimson-glow: #ff2a5f;
      --crimson-dim: rgba(255, 42, 95, 0.2);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --font-title: 'Cinzel', serif;
      --font-hud: 'Orbitron', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 12px;
    }

    /* Partículas de Fundo */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Content Wrapper Principal */
    .game-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1150px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
      align-items: stretch;
    }

    /* Cards Estilizados */
    .glass-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
      opacity: 0.6;
    }

    /* BARRA DE STATUS / STATS */
    .top-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      width: 100%;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 30px;
      font-family: var(--font-hud);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .stat-badge.streak {
      border-color: rgba(255, 183, 3, 0.4);
      color: var(--gold-glow);
      box-shadow: 0 0 12px var(--gold-dim);
    }

    .stat-badge.score {
      border-color: rgba(0, 229, 255, 0.4);
      color: var(--cyan-glow);
      box-shadow: 0 0 12px var(--cyan-dim);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }

    .icon-btn:hover {
      background: var(--cyan-glow);
      color: #000;
      box-shadow: 0 0 15px var(--cyan-glow);
      transform: scale(1.05);
    }

    /* Seletor de Categoria Sem Rótulo */
    .category-select-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
    }

    .category-select {
      width: 100%;
      appearance: none;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      color: var(--cyan-glow);
      font-family: var(--font-hud);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .category-select:hover, .category-select:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 12px var(--cyan-dim);
    }

    .category-select-wrapper::after {
      content: '▼';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      color: var(--cyan-glow);
      pointer-events: none;
    }

    /* Ilustração SVG da Forca / Altar */
    .gallows-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 280px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.05) 0%, transparent 70%);
    }

    svg#gallows-svg {
      width: 100%;
      max-width: 250px;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.2));
    }

    .gallows-part {
      stroke: var(--cyan-glow);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.5s ease;
      opacity: 0;
    }

    .gallows-part.visible {
      opacity: 1;
    }

    .rune-part {
      stroke: var(--crimson-glow);
      filter: drop-shadow(0 0 8px var(--crimson-glow));
    }

    /* Coluna Direita (Jogo) */
    .right-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    /* Visualização da Palavra */
    .word-display-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      min-height: 100px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .letter-slot {
      width: 44px;
      height: 54px;
      border-bottom: 3px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-hud);
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .letter-slot.revealed {
      border-bottom-color: var(--cyan-glow);
      color: var(--cyan-glow);
      text-shadow: 0 0 15px var(--cyan-glow);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* BARRA DE AÇÕES PROPORCIONAL LARGURA TOTAL */
    .action-bar-full {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 12px;
      width: 100%;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-family: var(--font-hud);
      font-size: 0.72rem; /* Fonte reduzida para caber perfeitamente */
      font-weight: 700;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .action-btn.hint-btn {
      border-color: rgba(255, 183, 3, 0.3);
      color: var(--gold-glow);
    }

    .action-btn.hint-btn:hover:not(:disabled) {
      background: var(--gold-glow);
      color: #000;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .action-btn.reset-btn {
      border-color: rgba(0, 229, 255, 0.3);
      color: var(--cyan-glow);
    }

    .action-btn.reset-btn:hover:not(:disabled) {
      background: var(--cyan-glow);
      color: #000;
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    .action-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: transparent;
    }

    /* Container de Dica Oculta/Revelada */
    .hint-display {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 22px;
      font-style: italic;
    }

    .hint-display span {
      color: var(--gold-glow);
      font-style: normal;
      font-weight: 600;
    }

    /* Teclado Virtual - Padrão Brasileiro (ABNT2) */
    .keyboard-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key-btn {
      flex: 1;
      max-width: 40px;
      height: 46px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: var(--font-hud);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-btn:hover:not(:disabled) {
      background: rgba(0, 229, 255, 0.2);
      border-color: var(--cyan-glow);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
    }

    .key-btn.correct {
      background: rgba(0, 229, 255, 0.25) !important;
      border-color: var(--cyan-glow) !important;
      color: var(--cyan-glow) !important;
      box-shadow: 0 0 10px var(--cyan-dim);
    }

    .key-btn.wrong {
      background: rgba(255, 42, 95, 0.15) !important;
      border-color: var(--crimson-glow) !important;
      color: var(--crimson-glow) !important;
      opacity: 0.4;
    }

    .key-btn:disabled {
      cursor: not-allowed;
    }

    /* Modal de Resultado */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .modal-title.win {
      color: var(--cyan-glow);
      text-shadow: 0 0 20px var(--cyan-glow);
    }

    .modal-title.lose {
      color: var(--crimson-glow);
      text-shadow: 0 0 20px var(--crimson-glow);
    }

    .modal-desc {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .modal-btn {
      background: var(--cyan-glow);
      color: #000;
      border: none;
      font-family: var(--font-hud);
      font-weight: 700;
      padding: 12px 28px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .modal-btn:hover {
      box-shadow: 0 0 25px var(--cyan-glow);
      transform: scale(1.05);
    }

    /* Screen Shake ao Errar */
    .shake {
      animation: shakeAnim 0.4s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Responsividade */
    @media (max-width: 820px) {
      .game-container {
        grid-template-columns: 1fr;
      }
      .gallows-container {
        min-height: 200px;
      }
      .letter-slot {
        width: 34px;
        height: 44px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Partículas Animadas de Fundo -->
  <canvas id="particle-canvas"></canvas>

  <div class="game-container">
    
    <!-- Painel Esquerdo: Status, Seletor & Altar da Forca -->
    <div class="glass-card left-column">
      
      <!-- Linha Superior de Status Integrada -->
      <div class="top-stats-row">
        <div class="stat-badge streak" title="Sequência Atual">
          🔥 <span id="streak-val">0</span>
        </div>
        <div class="stat-badge score" title="Pontuação Total">
          ⭐ <span id="score-val">0</span>
        </div>
        <button class="icon-btn" id="audio-toggle-btn" title="Alternar Som">
          🔊
        </button>
      </div>

      <!-- Seletor de Categoria Directo -->
      <div class="category-select-wrapper">
        <select id="category-select" class="category-select">
          <option value="FANTASIA">🔮 Fantasia Épica</option>
          <option value="MITOLOGIA">⚡ Mitologia Antiga</option>
          <option value="SCIFI">🚀 Cosmos & Sci-Fi</option>
          <option value="TECNOLOGIA">💻 Alta Tecnologia</option>
        </select>
      </div>

      <!-- Altar da Forca SVG -->
      <div class="gallows-container">
        <svg id="gallows-svg" viewBox="0 0 200 220">
          <!-- Base do Altar (Sempre Visível) -->
          <path d="M 20 200 L 180 200 M 50 200 L 50 30 L 120 30 L 120 50" stroke="rgba(0, 229, 255, 0.2)" stroke-width="4" stroke-linecap="round" fill="none" />
          <circle cx="120" cy="30" r="4" fill="var(--cyan-glow)" />

          <!-- Partes do Invocado / Vítima (1 a 6 Erros) -->
          <circle id="part-1" class="gallows-part rune-part" cx="120" cy="70" r="18" />
          <line id="part-2" class="gallows-part rune-part" x1="120" y1="88" x2="120" y2="135" />
          <line id="part-3" class="gallows-part rune-part" x1="120" y1="98" x2="95" y2="120" />
          <line id="part-4" class="gallows-part rune-part" x1="120" y1="98" x2="145" y2="120" />
          <line id="part-5" class="gallows-part rune-part" x1="120" y1="135" x2="98" y2="175" />
          <line id="part-6" class="gallows-part rune-part" x1="120" y1="135" x2="142" y2="175" />
        </svg>
      </div>

    </div>

    <!-- Painel Direito: Adivinhação, Ações e Teclado -->
    <div class="glass-card right-column" id="main-play-card">
      
      <!-- Mostrar Palavra Oculta -->
      <div class="word-display-container" id="word-display">
        <!-- Gerado via JS -->
      </div>

      <!-- Dica Oculta/Exibida -->
      <div class="hint-display" id="hint-text">
        Pressione "Dica" para revelar uma pista do oráculo.
      </div>

      <!-- Barra de Ações Proporcional Largura Total -->
      <div class="action-bar-full">
        <button class="action-btn hint-btn" id="hint-btn">
          💡 Dica
        </button>
        <button class="action-btn reset-btn" id="reset-btn">
          🔄 Renovar Enigma
        </button>
      </div>

      <!-- Teclado Virtual (Padrão Brasileiro ABNT2) -->
      <div class="keyboard-container" id="keyboard">
        <!-- Gerado via JS -->
      </div>

    </div>

  </div>

  <!-- Modal de Resultado -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-title">DESTINO CUMPRIDO</h2>
      <p class="modal-desc" id="modal-desc">Desvendaste o enigma das runas com sucesso.</p>
      <button class="modal-btn" id="modal-action-btn">Próximo Desafio</button>
    </div>
  </div>

  <script>
    /* ==========================================
        BANCO DE DADOS DE PALAVRAS E DICAS
    ========================================== */
    const WORDS_DATABASE = {
      FANTASIA: [
        { word: 'VALQUIRIA', hint: 'Guerreira divina que escolhe os mortos em batalha.' },
        { word: 'ALQUIMIA', hint: 'Arte mística de transmutar matéria e buscar o elixir.' },
        { word: 'GRIMORIO', hint: 'Livro antigo contendo feitiços e rituais secretíssimos.' },
        { word: 'ELFO', hint: 'Ser imortal de elegância e conexão com a natureza.' },
        { word: 'DRAGAO', hint: 'Criatura colossal cuspidora de fogo e guardiã de tesouros.' }
      ],
      MITOLOGIA: [
        { word: 'MINOTAURO', hint: 'Monstro metade homem, metade touro preso num labirinto.' },
        { word: 'RAGNAROK', hint: 'O crepúsculo dos deuses na mitologia nórdica.' },
        { word: 'PROMETEU', hint: 'O titã que roubou o fogo dos céus para dar à humanidade.' },
        { word: 'MEDUSA', hint: 'Górgona cujo olhar transforma qualquer ser em pedra.' },
        { word: 'ODIN', hint: 'O Pai de Todos, possuidor do conhecimento supremo e dos corvos.' }
      ],
      SCIFI: [
        { word: 'HIPERESPACO', hint: 'Dimensão paralela usada para viagens mais rápidas que a luz.' },
        { word: 'CIBERNETICA', hint: 'Fusão perfeita entre a tecnologia orgânica e mecânica.' },
        { word: 'INTERSTELAR', hint: 'Avanço ou viagem que ocorre entre diferentes estrelas.' },
        { word: 'SINGULARIDADE', hint: 'Ponto no espaço-tempo de densidade infinita num buraco negro.' },
        { word: 'NEBULA', hint: 'Nuvem colossal de poeira e gás onde nascem as estrelas.' }
      ],
      TECNOLOGIA: [
        { word: 'ALGORITMO', hint: 'Conjunto finito de regras para resolver um problema.' },
        { word: 'CRIPTOGRAFIA', hint: 'Arte de codificar dados para proteger a informação.' },
        { word: 'QUANTICO', hint: 'Domínio da física aplicado à computação ultrarrápida.' },
        { word: 'NETWORKING', hint: 'Conexão e interligação de sistemas em rede global.' },
        { word: 'BLOCKCHAIN', hint: 'Cadeia imutável de blocos descentralizada.' }
      ]
    };

    /* ==========================================
       ESTADO DO JOGO
    ========================================== */
    let currentCategory = 'FANTASIA';
    let currentWord = '';
    let currentHint = '';
    let guessedLetters = new Set();
    let wrongGuesses = 0;
    const maxWrong = 6;
    let score = 0;
    let streak = 0;
    let isMuted = false;

    /* ==========================================
       SINTETIZADOR DE ÁUDIO (Web Audio API)
    ========================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (isMuted) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.6);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    /* ==========================================
       ELEMENTOS DOM
    ========================================== */
    const wordDisplay = document.getElementById('word-display');
    const keyboardContainer = document.getElementById('keyboard');
    const categorySelect = document.getElementById('category-select');
    const hintBtn = document.getElementById('hint-btn');
    const resetBtn = document.getElementById('reset-btn');
    const hintText = document.getElementById('hint-text');
    const streakVal = document.getElementById('streak-val');
    const scoreVal = document.getElementById('score-val');
    const audioToggleBtn = document.getElementById('audio-toggle-btn');
    const mainPlayCard = document.getElementById('main-play-card');
    
    // Modal
    const resultModal = document.getElementById('result-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalActionBtn = document.getElementById('modal-action-btn');

    /* ==========================================
       INICIALIZAÇÃO & LÓGICA DO JOGO
    ========================================== */
    function initGame() {
      const catWords = WORDS_DATABASE[currentCategory];
      const selected = catWords[Math.floor(Math.random() * catWords.length)];
      
      currentWord = selected.word.toUpperCase();
      currentHint = selected.hint;
      guessedLetters.clear();
      wrongGuesses = 0;

      hintText.innerHTML = 'Pressione "Dica" para revelar uma pista do oráculo.';
      hintBtn.disabled = false;

      for (let i = 1; i <= maxWrong; i++) {
        document.getElementById(`part-${i}`).classList.remove('visible');
      }

      renderWord();
      renderKeyboard();
    }

    function renderWord() {
      wordDisplay.innerHTML = '';
      let isComplete = true;

      for (const char of currentWord) {
        const slot = document.createElement('div');
        slot.className = 'letter-slot';
        
        if (guessedLetters.has(char) || (char === 'Ç' && guessedLetters.has('C'))) {
          slot.textContent = char;
          slot.classList.add('revealed');
        } else {
          slot.textContent = '';
          isComplete = false;
        }
        
        wordDisplay.appendChild(slot);
      }

      if (isComplete && currentWord.length > 0) {
        handleWin();
      }
    }

    /* TECLADO PADRÃO BRASILEIRO (ABNT2) */
    function renderKeyboard() {
      keyboardContainer.innerHTML = '';
      const rows = [
        ['Q','W','E','R','T','Y','U','I','O','P'],
        ['A','S','D','F','G','H','J','K','L','Ç'],
        ['Z','X','C','V','B','N','M']
      ];

      rows.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'keyboard-row';

        row.forEach(letter => {
          const btn = document.createElement('button');
          btn.className = 'key-btn';
          btn.textContent = letter;

          if (guessedLetters.has(letter)) {
            btn.disabled = true;
            if (currentWord.includes(letter) || (letter === 'Ç' && currentWord.includes('C'))) {
              btn.classList.add('correct');
            } else {
              btn.classList.add('wrong');
            }
          }

          btn.addEventListener('click', () => handleGuess(letter));
          rowDiv.appendChild(btn);
        });

        keyboardContainer.appendChild(rowDiv);
      });
    }

    function handleGuess(letter) {
      if (guessedLetters.has(letter) || wrongGuesses >= maxWrong) return;

      guessedLetters.add(letter);

      if (currentWord.includes(letter)) {
        playSound('correct');
        renderWord();
      } else {
        playSound('wrong');
        wrongGuesses++;
        
        const part = document.getElementById(`part-${wrongGuesses}`);
        if (part) part.classList.add('visible');

        mainPlayCard.classList.add('shake');
        setTimeout(() => mainPlayCard.classList.remove('shake'), 400);

        if (wrongGuesses >= maxWrong) {
          handleLose();
        }
      }

      renderKeyboard();
    }

    function handleWin() {
      playSound('win');
      streak++;
      score += 100 + (streak * 20);
      updateHUD();

      modalTitle.textContent = "DESTINO CUMPRIDO";
      modalTitle.className = "modal-title win";
      modalDesc.textContent = `Desvendaste com sucesso a palavra [ ${currentWord} ]!`;
      resultModal.classList.add('active');
    }

    function handleLose() {
      playSound('lose');
      streak = 0;
      updateHUD();

      modalTitle.textContent = "CONSUMIDO PELAS SOMBRAS";
      modalTitle.className = "modal-title lose";
      modalDesc.textContent = `A energia rúnica esgotou-se. A palavra era [ ${currentWord} ].`;
      resultModal.classList.add('active');
    }

    function updateHUD() {
      streakVal.textContent = streak;
      scoreVal.textContent = score;
    }

    /* ==========================================
       EVENT LISTENERS
    ========================================== */
    categorySelect.addEventListener('change', (e) => {
      currentCategory = e.target.value;
      playSound('click');
      initGame();
    });

    hintBtn.addEventListener('click', () => {
      playSound('click');
      hintText.innerHTML = `<span>Dica:</span> ${currentHint}`;
      hintBtn.disabled = true;
    });

    resetBtn.addEventListener('click', () => {
      playSound('click');
      initGame();
    });

    modalActionBtn.addEventListener('click', () => {
      playSound('click');
      resultModal.classList.remove('active');
      initGame();
    });

    audioToggleBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      audioToggleBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if ((/^[A-ZÇ]$/.test(key)) && !resultModal.classList.contains('active')) {
        handleGuess(key);
      }
    });

    /* ==========================================
       SISTEMA DE PARTÍCULAS NO CANVAS
    ========================================== */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = -Math.random() * 0.5 - 0.2;
        this.alpha = Math.random() * 0.5 + 0.2;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height;
        }
      }

      draw() {
        ctx.fillStyle = `rgba(0, 229, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = [];
      for (let i = 0; i < 65; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', resizeCanvas);

    initParticles();
    animateParticles();
    initGame();
  </script>
</body>
</html>
