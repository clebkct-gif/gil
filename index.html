        // Settings Actions
        function exportBackup() {
            flushPending();
            const data = {
                app: 'windex', version: 1, exported: new Date().toISOString(),
                settings: systemSettings, profile: userProfile, apps: apps,
                wallpaper: store.get(KEYS.wallpaper)
            };
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
            a.download = 'windex-backup.json';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            showToast('Backup exportado');
        }

        function importBackup(e) {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            if (file.size > 25 * 1024 * 1024) { showToast('Arquivo de backup grande demais.'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const d = JSON.parse(reader.result);
                    if (!d || typeof d !== 'object' || d.app !== 'windex') throw new Error('formato');
                    clearTimeout(persistTimer); settingsDirty = false; // não deixa um salvamento pendente sobrescrever
                    let ok = true;
                    if (d.settings) ok = store.set(KEYS.settings, JSON.stringify(sanitizeSettings(d.settings))) && ok;
                    if (d.profile)  ok = store.set(KEYS.profile, JSON.stringify(sanitizeProfile(d.profile))) && ok;
                    if (Array.isArray(d.apps)) ok = store.set(KEYS.apps, JSON.stringify(sanitizeApps(d.apps))) && ok;
                    const wp = cleanUrl(d.wallpaper, 'img');
                    if (wp) ok = store.set(KEYS.wallpaper, wp) && ok;
                    loadSystemSettings(); loadUserProfile(); loadApps();
                    applySystemTheme(); updateProfileUI();
                    renderDesktopIcons(); renderStartMenuApps(); refreshCategoryPanel(); updateTaskbar();
                    refreshSettingsWindow(); refreshAppManager();
                    showToast(ok ? 'Backup restaurado' : 'Restaurado, mas faltou espaço para salvar tudo.');
                } catch (err) { showToast('Arquivo de backup inválido.'); }
            };
            reader.readAsText(file);
        }
        function saveUserProfileSettings() {
            const name = document.getElementById('profile-name-input').value.trim();
            if (name) userProfile.name = name;
            saveUserProfile();
            showToast('Perfil atualizado');
        }

        function handleAvatarFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            imageFileToDataURL(file, 256, 'image/jpeg', 0.85)
                .then(d => { userProfile.avatar = d; saveUserProfile(); showToast('Foto salva'); })
                .catch(() => showToast('Não consegui abrir essa imagem.'));
        }

        function updateTaskbarColorFromPicker(hex) {
            // Convert Hex to RGBA with default transparency
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            systemSettings.taskbarHex = hex;
            systemSettings.taskbarColor = `rgba(${r}, ${g}, ${b}, ${systemSettings.taskbarAlpha / 100})`;
            saveSystemSettings();
        }

        function updateTaskbarAlpha(val) {
            systemSettings.taskbarAlpha = +val;
            updateTaskbarColorFromPicker(systemSettings.taskbarHex || '#dcebfc');
        }

        function updateTaskbarBlur(val) {
            systemSettings.taskbarBlur = val;
            document.getElementById('blur-val-display').innerText = `${val}px blur`;
            saveSystemSettings();
        }

        function toggleOrbType(val) {
            systemSettings.startOrbType = val;
            const container = document.getElementById('orb-file-container');
            if (container) {
                if (val === 'image') container.classList.remove('hidden');
                else container.classList.add('hidden');
            }
            saveSystemSettings();
        }

        function handleOrbFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            imageFileToDataURL(file, 256, 'image/png')
                .then(d => { systemSettings.startOrbImage = d; saveSystemSettings(); showToast('Imagem do botão salva'); })
                .catch(() => showToast('Não consegui abrir essa imagem.'));
        }

        function applyStartMenuTheme(key) {
            if (START_MENU_THEMES[key]) {
                systemSettings.startMenuThemeKey = key;
                saveSystemSettings();
            }
        }

        function renderAppManagerHTML() {
            const listHTML = apps.map((app) => {
                const cat = getCategory(app.category);
                const where = [
                    cat ? 'Aba ' + cat.name : null,
                    app.openMode === 'page' ? 'Página separada' : null,
                    showOnDesktop(app) ? 'Desktop' : null,
                    showInStartMenu(app) ? 'Menu' : null
                ].filter(Boolean).join(' · ');
                return `
                <div class="flex items-center justify-between p-2 border rounded text-xs gap-2 ${app.id === editingAppId ? 'bg-amber-50 border-amber-400' : 'bg-gray-50'}">
                    <div class="flex items-center gap-2 truncate min-w-0">
                        <span class="w-6 h-6 flex items-center justify-center shrink-0">${appIconHTML(app, 'w-6 h-6 object-contain rounded', 'text-blue-600')}</span>
                        <div class="truncate">
                            <div class="font-semibold truncate">${esc(app.name)}</div>
                            <div class="text-[10px] text-gray-500 truncate">${esc(where)}</div>
                        </div>
                    </div>
                    ${!app.isSystem ? `
                        <div class="flex gap-1 shrink-0">
                            <button onclick="startEditApp('${app.id}')" class="px-2 py-1 bg-blue-600 text-white rounded text-[10px] hover:bg-blue-700">Editar</button>
                            <button onclick="removeApp('${app.id}')" class="px-2 py-1 bg-red-500 text-white rounded text-[10px] hover:bg-red-600">Remover</button>
                        </div>
                    ` : '<span class="text-[10px] text-gray-400 font-semibold shrink-0">Sistema</span>'}
                </div>`;
            }).join('');

            const catOptions = CATEGORIES.map(c => `<option value="${c.key}">${c.name}  (./${c.folder}/)</option>`).join('');

            return `
                <div class="p-3 space-y-4 text-xs h-full overflow-y-auto">
                    <div class="bg-blue-50 p-3 rounded border border-blue-200 space-y-2.5">
                        <h4 class="font-bold text-blue-900 flex items-center gap-2">
                            <i class="fa-solid ${editingAppId ? 'fa-pen-to-square' : 'fa-plus-circle'}"></i> ${editingAppId ? 'Editar App' : 'Adicionar Novo App'}
                        </h4>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-700">Nome do App:</label>
                            <input type="text" id="new-app-name" placeholder="Ex: Jogo da Tabuada" class="w-full p-1.5 border rounded">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-700">Aba / pasta:</label>
                            <select id="new-app-cat" onchange="updatePathHint()" class="w-full p-1.5 border rounded bg-white">
                                ${catOptions}
                                <option value="">Nenhuma (somente desktop / menu)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-700">Abrir como:</label>
                            <select id="new-app-mode" class="w-full p-1.5 border rounded bg-white">
                                <option value="window">Janela do Windex</option>
                                <option value="page">Página separada (sem iframe)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-700">Microfone e área de transferência:</label>
                            <select id="new-app-media" class="w-full p-1.5 border rounded bg-white">
                                <option value="">Automático (local: permitir · externo: bloquear)</option>
                                <option value="1">Sempre permitir</option>
                                <option value="0">Sempre bloquear</option>
                            </select>
                        </div>

                        <div>
                            <label class="flex items-start gap-1.5 font-semibold text-gray-700"><input type="checkbox" id="new-app-keep" class="mt-0.5"> <span>Manter sempre carregado<span class="block font-normal text-[10px] text-gray-500">Não descarrega o app quando ele fica minimizado por muito tempo (evita perder o que você estava fazendo, mas usa mais memória).</span></span></label>
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-700">Arquivo HTML (escolha na pasta) ou URL:</label>
                            <div class="flex gap-1.5 items-center">
                                <input type="text" id="new-app-url" oninput="updatePathHint()" placeholder="tabuada.html ou https://..." class="flex-1 p-1.5 border rounded">
                                <input type="file" id="html-file-picker" accept=".html,.htm" multiple class="hidden" onchange="handleHTMLFileSelect(event)">
                                <button type="button" onclick="document.getElementById('html-file-picker').click()" title="Escolher o arquivo .html (vários de uma vez adiciona todos). Ele deve estar na pasta da aba." class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded text-xs shrink-0"><i class="fa-solid fa-folder-open mr-1"></i>Escolher</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-700">Ícone (opcional — vazio usa o mesmo nome do HTML, em .png):</label>
                            <div class="flex gap-1.5 items-center">
                                <input type="text" id="new-app-icon" oninput="updatePathHint()" placeholder="vazio = mesmo nome do HTML .png" class="flex-1 p-1.5 border rounded">
                                <input type="file" id="icon-file-picker" accept="image/*" class="hidden" onchange="handleIconFileSelect(event)">
                                <button type="button" onclick="document.getElementById('icon-file-picker').click()" title="Escolher a imagem (usa só o nome; ela deve estar na pasta)" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded text-xs shrink-0"><i class="fa-solid fa-image"></i></button>
                            </div>
                        </div>

                        <div id="new-app-hint" class="text-[10px] text-blue-900 bg-white/70 border border-blue-100 rounded p-1.5 break-all"></div>

                        <div class="flex gap-4">
                            <label class="flex items-center gap-1.5 font-semibold text-gray-700"><input type="checkbox" id="new-app-desktop"> Área de trabalho</label>
                            <label class="flex items-center gap-1.5 font-semibold text-gray-700"><input type="checkbox" id="new-app-start"> Menu iniciar</label>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="addNewApp()" class="flex-1 py-2 ${editingAppId ? 'bg-blue-600 hover:bg-blue-700' : 'bg-emerald-600 hover:bg-emerald-700'} text-white font-semibold rounded transition shadow">${editingAppId ? 'Salvar alterações' : 'Adicionar App'}</button>
                            ${editingAppId ? '<button onclick="cancelEditApp()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold rounded transition">Cancelar</button>' : ''}
                        </div>
                    </div>

                    <div class="bg-gray-50 p-3 rounded border space-y-2">
                        <h4 class="font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-lock"></i> PIN de proteção ${pinIsSet() ? '<span class="text-[10px] text-emerald-600 font-semibold">ativo</span>' : ''}</h4>
                        <p class="text-[10px] text-gray-500">Protege o botão Sair, este Gerenciador de Apps e o Exportar/Importar backup.</p>
                        <div class="flex gap-1.5">
                            <input type="password" inputmode="numeric" id="pin-new" maxlength="8" placeholder="4 a 8 números" class="flex-1 p-1.5 border rounded">
                            <button onclick="savePin()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded text-xs">Definir</button>
                            ${pinIsSet() ? '<button onclick="clearPin()" class="px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white rounded text-xs">Remover</button>' : ''}
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="font-bold text-gray-800">Apps Instalados</h4>
                            <button onclick="verifyAllApps()" class="px-2 py-1 bg-slate-700 hover:bg-slate-800 text-white rounded text-[10px]">Verificar arquivos</button>
                        </div>
                        <div id="verify-result" class="mb-2 space-y-0.5"></div>
                        <div class="space-y-1.5">
                            ${listHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        // Ícone padrão: mesmo caminho/nome do HTML, trocando a extensão por .png
        function defaultIconFor(url) {
            const u = (url || '').trim();
            if (!u || /^(https?:|data:|blob:|javascript:)/i.test(u)) return '';
            const clean = u.split(/[?#]/)[0];
            return /\.[a-z0-9]+$/i.test(clean) ? clean.replace(/\.[a-z0-9]+$/i, '.png') : clean + '.png';
        }

        function prettyAppName(file) {
            const n = file.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
            return n.charAt(0).toUpperCase() + n.slice(1);
        }

        function newAppId() { return 'app_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        function updatePathHint() {
            const hint = document.getElementById('new-app-hint');
            if (!hint) return;
            const category = document.getElementById('new-app-cat').value;
            const url = document.getElementById('new-app-url').value;
            const typed = document.getElementById('new-app-icon').value.trim();
            const auto = !typed && !!defaultIconFor(url);
            const iconVal = typed || defaultIconFor(url);
            const page = resolveAssetPath({ category, url }, 'url');
            const icon = isImageIcon(iconVal) ? resolveAssetPath({ category, icon: iconVal }, 'icon') : (iconVal ? 'ícone FontAwesome' : '');
            hint.innerHTML = `Página: <b>${esc(page ? decodeURI(page) : '—')}</b><br>Ícone: <b>${esc(icon ? decodeURI(icon) : '—')}</b>${auto ? ' <i>(automático)</i>' : ''}`;
        }

        // O navegador não grava arquivos em pastas: o seletor só preenche o NOME.
        // O arquivo precisa estar na pasta da aba para carregar (e persistir) corretamente.
        // Vários arquivos de uma vez = adiciona todos já, com o ícone automático (mesmo nome, .png).
        function handleHTMLFileSelect(e) {
            const files = [...e.target.files].filter(f => /\.html?$/i.test(f.name));
            e.target.value = '';
            if (!files.length) { showToast('Escolha um arquivo .html'); return; }
            if (files.length > 1 && !editingAppId) { addAppsFromFiles(files); return; }
            const file = files[0];
            document.getElementById('new-app-url').value = file.name;
            const nameInput = document.getElementById('new-app-name');
            if (!nameInput.value) nameInput.value = prettyAppName(file.name);
            updatePathHint();
        }

        function addAppsFromFiles(files) {
            const category = document.getElementById('new-app-cat').value;
            const onDesktop = document.getElementById('new-app-desktop').checked;
            const inStart = document.getElementById('new-app-start').checked;
            const openMode = document.getElementById('new-app-mode').value;
            if (!category && !onDesktop && !inStart) { showToast('Escolha ao menos um local para os apps.'); return; }
            let added = 0;
            files.forEach(f => {
                if (apps.some(a => a.url === f.name && (a.category || '') === category)) return;
                apps.push({
                    id: newAppId(), name: prettyAppName(f.name), url: f.name,
                    icon: defaultIconFor(f.name), iconAuto: true,
                    category, onDesktop, inStart, openMode,
                    color: 'text-blue-600', isSystem: false
                });
                added++;
            });
            finishAppsChange(added ? `${added} app(s) adicionado(s)` : 'Esses apps já estavam na lista');
        }

        function finishAppsChange(message) {
            saveApps();
            renderDesktopIcons();
            renderStartMenuApps();
            refreshCategoryPanel();
            refreshAppManager();
            showToast(message);
        }

        function handleIconFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('new-app-icon').value = file.name;
            updatePathHint();
        }

        function refreshAppManager() {
            const win = openWindows['appmanager'];
            if (win) {
                win.element.querySelector('.flex-1').innerHTML = renderAppManagerHTML();
                updatePathHint();
            }
        }

        function startEditApp(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app || app.isSystem) return;
            editingAppId = appId;
            refreshAppManager();
            document.getElementById('new-app-name').value = app.name || '';
            document.getElementById('new-app-cat').value = app.category || '';
            document.getElementById('new-app-mode').value = app.openMode || 'window';
            document.getElementById('new-app-media').value = app.allowMedia === true ? '1' : app.allowMedia === false ? '0' : '';
            document.getElementById('new-app-keep').checked = app.keepAlive === true;
            document.getElementById('new-app-url').value = app.url || '';
            document.getElementById('new-app-icon').value = app.iconAuto ? '' : (app.icon || '');
            document.getElementById('new-app-desktop').checked = showOnDesktop(app);
            document.getElementById('new-app-start').checked = showInStartMenu(app);
            updatePathHint();
            const body = openWindows['appmanager'].element.querySelector('.flex-1 > div');
            if (body) body.scrollTop = 0;
        }

        function cancelEditApp() {
            editingAppId = null;
            refreshAppManager();
        }

        // Atualiza a janela aberta do app editado (nome, ícone e página)
        function refreshOpenAppWindow(app) {
            const w = openWindows[app.id];
            if (!w) return;
            const header = w.element.querySelector(`#win-header-${app.id}`);
            if (header && header.firstElementChild) {
                header.firstElementChild.innerHTML = `${appIconHTML(app, 'w-4 h-4 object-contain', 'text-xs')}
                    <span class="text-xs font-semibold text-slate-800 drop-shadow-sm truncate">${esc(app.name)}</span>`;
            }
            const body = w.element.children[1];
            if (body) body.innerHTML = getAppBodyHTML(app);
            updateTaskbar();
        }

        function addNewApp() {
            const name = document.getElementById('new-app-name').value.trim();
            const rawUrl = document.getElementById('new-app-url').value.trim();
            const url = cleanUrl(rawUrl, 'url');
            const rawIcon = document.getElementById('new-app-icon').value.trim();
            const typedIcon = cleanIcon(rawIcon);
            const mediaSel = document.getElementById('new-app-media').value;
            const allowMedia = mediaSel === '1' ? true : mediaSel === '0' ? false : undefined;
            const keepAlive = document.getElementById('new-app-keep').checked;
            const autoIcon = defaultIconFor(url);
            const icon = typedIcon || autoIcon || 'fa-solid fa-window-maximize';
            const iconAuto = !typedIcon && !!autoIcon;
            const category = document.getElementById('new-app-cat').value;
            const onDesktop = document.getElementById('new-app-desktop').checked;
            const inStart = document.getElementById('new-app-start').checked;
            const openMode = document.getElementById('new-app-mode').value;

            if (!name || !url) {
                showToast(rawUrl ? 'Endereço não permitido. Use um arquivo .html ou http(s)://' : 'Informe o nome e o arquivo HTML ou URL.');
                return;
            }
            if (rawIcon && !typedIcon) {
                showToast('Ícone inválido.');
                return;
            }
            if (!category && !onDesktop && !inStart) {
                showToast('Escolha ao menos um local para o app.');
                return;
            }

            let message = 'App adicionado';
            const existing = editingAppId ? apps.find(a => a.id === editingAppId) : null;

            if (existing) {
                Object.assign(existing, { name: cleanText(name, 80), url, icon, iconAuto, category, onDesktop, inStart, openMode, allowMedia, keepAlive });
                editingAppId = null;
                message = 'Alterações salvas';
                refreshOpenAppWindow(existing);
            } else {
                apps.push({
                    id: newAppId(),
                    name: cleanText(name, 80), url, icon, iconAuto, category,
                    onDesktop, inStart, openMode, allowMedia, keepAlive,
                    color: 'text-blue-600',
                    isSystem: false
                });
            }

            finishAppsChange(message);
        }

        function removeApp(appId) {
            if (editingAppId === appId) editingAppId = null;
            apps = apps.filter(a => a.id !== appId);
            saveApps();
            renderDesktopIcons();
            renderStartMenuApps();
            refreshCategoryPanel();

            if (openWindows[appId]) {
                closeWindow(appId, null);
            }

            const win = openWindows['appmanager'];
            if (win) {
                win.element.querySelector('.flex-1').innerHTML = renderAppManagerHTML();
            }
        }

        function focusWindow(appId) {
            if (!openWindows[appId]) return;
            if (activeWindowId === appId && !openWindows[appId].minimized) return; // já em foco: evita reconstruir a barra a cada clique
            activeWindowId = appId;
            zIndexCounter++;
            
            Object.keys(openWindows).forEach(id => {
                const w = openWindows[id].element;
                if (id === appId) {
                    w.style.zIndex = zIndexCounter;
                    w.classList.remove('aero-window-inactive');
                } else {
                    w.classList.add('aero-window-inactive');
                }
            });

            updateTaskbar();
        }

        function minimizeWindow(appId, e) {
            if (e) e.stopPropagation();
            if (!openWindows[appId]) return;
            openWindows[appId].minimized = true;
            openWindows[appId].minimizedAt = Date.now();
            if (activeWindowId === appId) activeWindowId = null;
            openWindows[appId].element.classList.add('win-minimized');
            updateTaskbar();
        }

        function restoreWindow(appId) {
            if (!openWindows[appId]) return;
            openWindows[appId].minimized = false;
            openWindows[appId].element.classList.remove('win-minimized');
            if (openWindows[appId].unloaded) reloadApp(appId);
            focusWindow(appId);
        }

        function toggleMaximize(appId, e) {
            if (e) e.stopPropagation();
            const winObj = openWindows[appId];
            if (!winObj) return;

            const win = winObj.element;
            if (winObj.maximized) {
                win.style.width = winObj.prevRect.width;
                win.style.height = winObj.prevRect.height;
                win.style.top = winObj.prevRect.top;
                win.style.left = winObj.prevRect.left;
                winObj.maximized = false;
            } else {
                winObj.prevRect = {
                    width: win.style.width,
                    height: win.style.height,
                    top: win.style.top,
                    left: win.style.left
                };
                win.style.top = '0px';
                win.style.left = '0px';
                win.style.width = '100vw';
                win.style.height = 'calc(100vh - 48px)';
                winObj.maximized = true;
            }
            const pr = winObj.prevRect || {};
            saveWinPos(appId, { l: parseFloat(pr.left) || 0, t: parseFloat(pr.top) || 0, max: winObj.maximized });
        }

        function closeWindow(appId, e) {
            if (e) e.stopPropagation();
            if (!openWindows[appId]) return;
            if (appId === 'appmanager') editingAppId = null;

            const win = openWindows[appId].element;
            win.classList.add('win-minimized');
            setTimeout(() => {
                win.remove();
                delete openWindows[appId];
                if (activeWindowId === appId) activeWindowId = null;
                updateTaskbar();
            }, 200);
        }

        function showDesktop() {
            Object.keys(openWindows).forEach(id => {
                minimizeWindow(id, null);
            });
        }

        function updateTaskbar() {
            const container = document.getElementById('taskbar-apps');
            container.innerHTML = '';

            Object.keys(openWindows).forEach(id => {
                const app = apps.find(a => a.id === id);
                if (!app) return;
                const winObj = openWindows[id];
                const isActive = activeWindowId === id && !winObj.minimized;

                const item = document.createElement('button');
                item.className = `h-9 px-3 rounded-md flex items-center gap-2 border transition text-xs font-medium text-slate-800 ${
                    isActive ? 'taskbar-item-active' : 'bg-white/20 hover:bg-white/40 border-white/30'
                }`;

                item.onclick = () => {
                    if (winObj.minimized) {
                        restoreWindow(id);
                    } else if (activeWindowId === id) {
                        minimizeWindow(id, null);
                    } else {
                        focusWindow(id);
                    }
                };

                const iconHTML = appIconHTML(app, 'w-4 h-4 object-contain', 'text-base');

                item.innerHTML = `
                    ${iconHTML}
                    <span class="hidden sm:inline truncate max-w-[100px]">${esc(app.name)}</span>
                `;

                container.appendChild(item);
            });
        }

        function makeDraggable(element, header) {
            const layer = document.getElementById('windows-layer');
            const appId = element.id.replace(/^win-/, '');
            let startX = 0, startY = 0, startL = 0, startT = 0, nextL = 0, nextT = 0, raf = 0, dragging = false, moved = false;

            header.style.touchAction = 'none';

            function apply() {
                raf = 0;
                element.style.left = nextL + 'px';
                element.style.top = nextT + 'px';
            }

            header.addEventListener('pointerdown', (e) => {
                if (e.button > 0 || e.target.closest('button')) return;
                const w = openWindows[appId];
                if (w && w.maximized) return;
                dragging = true; moved = false;
                startX = e.clientX; startY = e.clientY;
                startL = element.offsetLeft; startT = element.offsetTop;
                header.setPointerCapture(e.pointerId);
                layer.classList.add('dragging');
            });

            header.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const maxL = window.innerWidth - 80;
                const maxT = window.innerHeight - 48 - 32;
                moved = true;
                nextL = Math.min(maxL, Math.max(80 - element.offsetWidth, startL + e.clientX - startX));
                nextT = Math.min(maxT, Math.max(0, startT + e.clientY - startY));
                if (!raf) raf = requestAnimationFrame(apply);
            });

            function endDrag(e) {
                if (!dragging) return;
                dragging = false;
                if (raf) { cancelAnimationFrame(raf); apply(); }
                if (moved) saveWinPos(appId, { l: nextL, t: nextT, max: false });
                layer.classList.remove('dragging');
                try { header.releasePointerCapture(e.pointerId); } catch (_) {}
            }
            header.addEventListener('pointerup', endDrag);
            header.addEventListener('pointercancel', endDrag);
        }

        function changeBg(url) { setWallpaper(url); }

        function exitSession() {
            endSession();
            closeStartMenu();
            closeCategoryPanel();
            Object.keys(openWindows).forEach(id => closeWindow(id, null));

            if (document.fullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }

            const landing = document.getElementById('landing-screen');
            const osContainer = document.getElementById('main-os-container');

            osContainer.classList.add('hidden');
            landing.classList.remove('hidden');
            setTimeout(() => {
                landing.classList.remove('opacity-0');
            }, 50);
        }
    </script>
</body>
</html>
