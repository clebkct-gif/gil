        /* Estilos Globais e Reset */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #f0f0f0;
            user-select: none;
            touch-action: none; 
        }

        /* Contêiner Principal */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* Barra de Ferramentas Padrão (Topo no Portrait) */
        #toolbar {
            display: flex;
            align-items: center;
            padding: 2px 5px;
            background-color: var(--toolbar-bg);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 10;
            justify-content: space-between; 
        }

        .tool-group {
            display: flex;
            align-items: center; 
        }

        .tool-button {
            background: none;
            border: none;
            color: var(--tool-color);
            padding: 4px;
            margin: 0 2px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            transition: background-color 0.1s;
        }
        
        #graphic-tool-button {
             font-size: 18px; 
             min-width: 25px;
        }

        .tool-button:hover {
            background-color: var(--tool-hover);
        }

        .tool-button.active {
            background-color: var(--tool-active);
        }
        
        .tool-button:disabled, .tool-button[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
            background: none;
        }

        /* --- ADAPTAÇÃO AUTOMÁTICA PARA MODO PAISAGEM (LANDSCAPE) NAS ATIVIDADES --- */
        body.landscape-mode #app-container {
            flex-direction: row !important;
        }
        body.landscape-mode #toolbar {
            display: none !important;
        }

        /* --- ESTILOS COMUNS DE MODAL --- */
        .full-screen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000; 
            box-sizing: border-box;
        }

        .full-screen-modal.visible {
            display: flex;
        }
        
        #color-picker-modal {
            background-color: #222;
            padding: 0;
            margin: 0;
            justify-content: flex-start;
        }
        #color-picker-modal .modal-content-container {
             width: 100%;
             height: 100%;
             background: #222;
             padding: 15px;
             box-sizing: border-box;
             overflow-y: auto;
             border-radius: 0;
             max-width: none;
             max-height: none;
        }

        .close-modal-button {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #graphic-functions-modal {
            align-items: stretch;
            justify-content: flex-start;
            padding: 0;
        }
        #graphic-modal-header {
            flex: 0 0 auto;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 9px;
            box-sizing: border-box;
            background: #333;
            border-bottom: 1px solid #666;
        }
        #graphic-modal-header h3 {
            margin: 0;
            color: #fff;
            font-size: 16px;

        function drawActivityText(text) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = CANVAS_BG_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            magicParticles = [];
            if (magicAnimationFrame) cancelAnimationFrame(magicAnimationFrame);
            magicAnimationFrame = 0;

            const usableWidth = canvas.width * 0.88;
            const usableHeight = canvas.height * 0.72;
            let baseSize = Math.min(usableWidth / Math.max(1, text.length * 0.58), usableHeight);
            baseSize = Math.max(34, Math.min(baseSize, canvas.height * 0.62));
            const x = canvas.width / 2;
            const y = canvas.height / 2;
            const font = getEducationalFont(baseSize);

            // Máscara separada da escrita: permite detectar o toque sobre as letras sem
            // confundir o modelo com os rabiscos que o aluno acrescentar.
            activityMaskCanvas.width = canvas.width;
            activityMaskCanvas.height = canvas.height;
            activityMaskCtx = activityMaskCanvas.getContext('2d', { willReadFrequently: true });
            activityMaskCtx.clearRect(0, 0, activityMaskCanvas.width, activityMaskCanvas.height);
            activityMaskCtx.font = font;
            activityMaskCtx.textAlign = 'center';
            activityMaskCtx.textBaseline = 'middle';
            activityMaskCtx.fillStyle = '#000';
            activityMaskCtx.fillText(text, x, y);
            activityMaskPixels = activityMaskCtx.getImageData(0, 0, activityMaskCanvas.width, activityMaskCanvas.height).data;

            ctx.save();
            ctx.font = font;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            if (activityFontMode === 1) {
                // Pontilhado de contorno, não preenchimento com bolinhas coloridas.
                ctx.strokeStyle = '#566573';
                ctx.lineWidth = Math.max(2, baseSize * 0.035);
                ctx.setLineDash([Math.max(1.5, baseSize * 0.025), Math.max(4, baseSize * 0.075)]);
                ctx.strokeText(text, x, y);
                ctx.setLineDash([]);
            } else if (activityFontMode === 2) {
                // Modelo de professora: tinta azul uniforme e legível.
                ctx.shadowColor = 'rgba(30, 80, 150, 0.12)';
                ctx.shadowBlur = 1.5;
                ctx.fillStyle = '#174a82';
                ctx.fillText(text, x, y);
            } else if (activityFontMode === 3) {
                // Grafite de lápis: cinza escuro com textura discreta, sem pontos coloridos.
                ctx.fillStyle = '#62666a';
                ctx.fillText(text, x, y);
                ctx.globalAlpha = 0.28;
                ctx.strokeStyle = '#34383b';
                ctx.lineWidth = Math.max(0.7, baseSize * 0.009);
                ctx.strokeText(text, x, y);
            } else {
                // Guia suave para o modo interativo: o efeito aparece ao tocar na letra.
                ctx.fillStyle = '#b5c5d8';
                ctx.fillText(text, x, y);
                ctx.strokeStyle = 'rgba(65, 105, 150, 0.22)';
                ctx.lineWidth = Math.max(1, baseSize * 0.012);
                ctx.strokeText(text, x, y);
            }
            ctx.restore();
            captureActivityTemplate();
            saveState();
        }

        function pointNearActivityLetter(x, y, radius = 13) {
            if (!activityMaskCanvas.width || !activityMaskCanvas.height) return false;
            const left = Math.max(0, Math.floor(x - radius));
            const top = Math.max(0, Math.floor(y - radius));
            const right = Math.min(activityMaskCanvas.width, Math.ceil(x + radius));
            const bottom = Math.min(activityMaskCanvas.height, Math.ceil(y + radius));
            if (right <= left || bottom <= top) return false;
            if (!activityMaskPixels) return false;
            const width = activityMaskCanvas.width;
            for (let py = top; py < bottom; py++) {
                let index = (py * width + left) * 4 + 3;
                for (let px = left; px < right; px++, index += 4) {
                    if (activityMaskPixels[index] > 80) return true;
                }
            }
            return false;
        }

        function addMagicBead(x, y, hue) {
            // O controle de espessura também governa o diâmetro das esferas do traçado mágico.
            // Mantém uma variação discreta para o volume 3D, sem perder legibilidade escolar.
            const sliderWidth = Number.isFinite(currentLineWidth) ? currentLineWidth : 5;
            const baseRadius = Math.max(1.8, Math.min(10.5, 1.8 + sliderWidth * 0.62));
            const r = baseRadius + (Math.sin((x + y) * 0.11) + 1) * Math.min(0.75, baseRadius * 0.12);
            magicParticles.push({ x, y, r, hue, born: performance.now(), life: 520, seed: Math.random() * 10, permanent: false });
            // Limite de segurança para dispositivos móveis.
            if (magicParticles.length > 1800) magicParticles.splice(0, magicParticles.length - 1800);
        }

        function traceMagicSegment(from, to) {
            const dx = to.x - from.x, dy = to.y - from.y;
            const distance = Math.hypot(dx, dy);
            const steps = Math.max(1, Math.ceil(distance / 4.5));
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = from.x + dx * t, y = from.y + dy * t;
                const hitRadius = Math.max(8, Math.min(20, 8 + (Number.isFinite(currentLineWidth) ? currentLineWidth : 5) * 0.22));
                if (pointNearActivityLetter(x, y, hitRadius)) {
                    addMagicBead(x, y, magicHue++ % 360);
                    // Brilhinhos laterais esparsos para dar volume, sem poluir a letra.
                    if ((magicHue % 3) === 0) {
                        const a = Math.random() * Math.PI * 2;
                        addMagicBead(x + Math.cos(a) * 3, y + Math.sin(a) * 3, magicHue % 360);
                    }
                }
            }
            renderMagicParticles(true);
        }

        function drawGlossyBead(context, bead, now, animate) {
            const age = now - bead.born;
            // Durante o gesto as esferas brilham sem desaparecer. Ao soltar o dedo,
            // tornam-se marcas permanentes até Limpar ou trocar de atividade.
            const fade = (animate && !bead.permanent && !magicGestureActive) ? Math.max(0, 1 - age / bead.life) : 1;
            if (fade <= 0) return;
            const pulse = animate && !bead.permanent ? 0.88 + 0.12 * Math.sin(age * 0.025 + bead.seed) : 1;
            const r = bead.r * pulse;
            context.save();
            context.globalAlpha = fade;
            context.shadowColor = `hsla(${bead.hue}, 90%, 48%, 0.5)`;
            context.shadowBlur = 5;
            context.shadowOffsetY = 1.5;
            const grad = context.createRadialGradient(bead.x - r * 0.38, bead.y - r * 0.42, 0.4, bead.x, bead.y, r * 1.25);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.18, `hsl(${bead.hue}, 95%, 78%)`);
            grad.addColorStop(0.56, `hsl(${bead.hue}, 88%, 53%)`);
            grad.addColorStop(1, `hsl(${bead.hue}, 85%, 30%)`);
            context.fillStyle = grad;
            context.beginPath();
            context.arc(bead.x, bead.y, r, 0, Math.PI * 2);
            context.fill();
            context.shadowColor = 'transparent';
            context.globalAlpha = fade * 0.9;
            context.fillStyle = 'rgba(255,255,255,0.95)';
            context.beginPath();
            context.arc(bead.x - r * 0.34, bead.y - r * 0.36, Math.max(0.65, r * 0.22), 0, Math.PI * 2);
            context.fill();
            context.restore();
        }

        function renderMagicParticles(animate) {
            if (!magicBaseCanvas.width || !magicBaseCanvas.height) {
                magicBaseCanvas.width = canvas.width;
                magicBaseCanvas.height = canvas.height;
                magicBaseCtx = magicBaseCanvas.getContext('2d');
                magicBaseCtx.drawImage(canvas, 0, 0);
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(magicBaseCanvas, 0, 0, canvas.width, canvas.height);
            const now = performance.now();
            magicParticles = magicParticles.filter(p => magicGestureActive || !animate || p.permanent || now - p.born < p.life);
            for (const bead of magicParticles) drawGlossyBead(ctx, bead, now, animate);
            if (animate && (magicGestureActive || magicParticles.some(p => now - p.born < p.life))) {
                magicAnimationFrame = requestAnimationFrame(() => renderMagicParticles(true));
            } else {
                magicAnimationFrame = 0;
            }
        }

        function beginMagicTrace(x, y) {
            magicGestureActive = true;
            magicLastPoint = { x, y };
            magicParticles = [];
            magicBaseCanvas.width = canvas.width;
            magicBaseCanvas.height = canvas.height;
            magicBaseCtx = magicBaseCanvas.getContext('2d');
            magicBaseCtx.drawImage(canvas, 0, 0);
            const hitRadius = Math.max(8, Math.min(20, 8 + (Number.isFinite(currentLineWidth) ? currentLineWidth : 5) * 0.22));
            if (pointNearActivityLetter(x, y, hitRadius)) addMagicBead(x, y, magicHue++ % 360);
            renderMagicParticles(true);
        }

        function finishMagicTrace() {
            magicGestureActive = false;
            magicLastPoint = null;
            if (magicAnimationFrame) cancelAnimationFrame(magicAnimationFrame);
            magicAnimationFrame = 0;
            // A trilha não some ao soltar o dedo: congela as esferas no desenho.
            magicParticles.forEach(p => { p.permanent = true; });
            renderMagicParticles(false);
            saveState();
        }

            if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
            const state = { data: canvas.toDataURL('image/png'), background: CANVAS_BG_COLOR };
            history.push(state);
            if (history.length > MAX_HISTORY) history.shift();

        function restoreState(index) {
            const entry = history[index];
            if (!entry) return;
            // Token de restauração: desfazer/refazer rápidos não podem deixar uma
            // imagem antiga terminar de carregar depois do estado mais recente.
            const requestId = ++restoreRequestId;
            const state = typeof entry === 'string' ? { data: entry, background: CANVAS_BG_COLOR } : entry;
            selectionRect = null; selectedImageData = null; isMoving = false;
            canvas.style.cursor = 'crosshair';
            const image = new Image();
            image.onload = () => {

                document.documentElement.style.setProperty('--canvas-bg', CANVAS_BG_COLOR);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

            graphicToolButton.title = `Função Gráfica Ativa: ${tool.charAt(0).toUpperCase() + tool.slice(1)} (Abre Menu)`;
            graphicToolButton.classList.add('active'); 
            setActionToolActive(tool, false); 

            graphicToolsGrid.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`#graphic-functions-modal button[data-tool="${tool}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            canvas.style.cursor = (currentTool === 'select-move' && selectedImageData) ? 'grab' : 'crosshair';
            closeGraphicModal();
        }

        function createToolButton(toolId, icon, name) {
            const button = document.createElement('button');
            button.className = 'tool-button';
            button.setAttribute('data-tool', toolId);
            button.title = name;
            button.innerHTML = `${icon} <span>${name}</span>`;
            
            if (toolId === currentTool && currentTool === 'pencil') button.classList.add('active');
            button.addEventListener('click', () => selectGraphicTool(toolId, icon));
            return button;
        }

        function addGraphicAction(container, label, action, active=false) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'graphic-action-button' + (active ? ' active' : '');
            button.textContent = label;
            button.addEventListener('click', () => action(button));
            container.appendChild(button);
            return button;
        }

        function setLineStyle(style, clickedButton) {
            currentLineStyle = style;
            document.querySelectorAll('[data-line-style]').forEach(b => b.classList.toggle('active', b.dataset.lineStyle === style));
            if (clickedButton) clickedButton.classList.add('active');
        }
        function setShapeMode(mode, clickedButton) {
            shapeRenderMode = mode;
            isFillMode = mode !== 'outline';
            document.querySelectorAll('[data-shape-mode]').forEach(b => b.classList.toggle('active', b.dataset.shapeMode === mode));
            fillToggleButton.classList.toggle('active', isFillMode);
            if (clickedButton) clickedButton.classList.add('active');
        }
        function syncGuidesOverlay() {
            const overlay = document.getElementById('guides-overlay');
            if (!overlay) return;
            const rect = canvas.getBoundingClientRect();
            overlay.style.left = `${rect.left}px`; overlay.style.top = `${rect.top}px`;
            overlay.style.width = `${rect.width}px`; overlay.style.height = `${rect.height}px`;
            overlay.style.display = gridGuidesEnabled ? 'block' : 'none';
        }
        function setGridGuides(enabled) {
            gridGuidesEnabled = enabled;
            syncGuidesOverlay();
            const b = document.getElementById('toggle-grid-guides');
            if (b) { b.classList.toggle('active', enabled); b.textContent = enabled ? '✓ Grade e guias ligadas' : 'Grade e guias de alinhamento'; }
        }
        function drawPaperTemplate(kind) {
            libraryTemplateName = null;
            paperTemplateName = kind;
            currentActivityType = null; currentWord = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.lineWidth = 1;
            const w = canvas.width, h = canvas.height;
            if (kind === 'quadriculado') {
                ctx.strokeStyle = '#d5e4f2';
                for (let x=0; x<=w; x+=24) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
                for (let y=0; y<=h; y+=24) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
            } else {
                const gap = kind === 'caligrafia' ? 42 : 34;
                for (let y=30; y<h; y+=gap) {
                    ctx.strokeStyle = kind === 'caligrafia' && Math.round((y-30)/gap)%2===0 ? '#e5a3a3' : '#a9c8e8';
                    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
                    if (kind === 'caligrafia') {
                        ctx.strokeStyle = '#d2dbe6'; ctx.setLineDash([4,4]);
                        ctx.beginPath(); ctx.moveTo(0,y+gap/2); ctx.lineTo(w,y+gap/2); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
            }
            ctx.restore();
            captureActivityTemplate(); saveState();
        }
        function loadFigureTemplate(name, tool) {
            libraryTemplateName = name; paperTemplateName = null;
            currentActivityType = null; currentWord = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const margin = Math.min(canvas.width, canvas.height) * .18;
            const x1 = margin, y1 = margin, x2 = canvas.width - margin, y2 = canvas.height - margin;
            const previousColor = currentColor, previousWidth = currentLineWidth, previousMode = shapeRenderMode, previousFill = isFillMode;
            currentColor = '#303840'; currentLineWidth = Math.max(2, Math.min(4, previousWidth));
            shapeRenderMode = 'outline'; isFillMode = false; currentLineStyle = 'solid';
            drawShape(ctx, tool, x1, y1, x2, y2, true);
            currentColor = previousColor; currentLineWidth = previousWidth; shapeRenderMode = previousMode; isFillMode = previousFill;
            captureActivityTemplate(); saveState();
        }
        function drawTracingTemplate(kind) {
            libraryTemplateName = 'trace-' + kind; paperTemplateName = null;
            currentActivityType = null; currentWord = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.save(); ctx.strokeStyle = '#708090'; ctx.fillStyle = '#708090'; ctx.lineWidth = 3; ctx.setLineDash([2,8]);
            const cx=canvas.width/2, cy=canvas.height/2, size=Math.min(canvas.width,canvas.height)*.28;
            if (kind === 'linhas') {
                for (let i=-2;i<=2;i++) { ctx.beginPath(); ctx.moveTo(canvas.width*.15,cy+i*size*.35); ctx.lineTo(canvas.width*.85,cy+i*size*.35); ctx.stroke(); }
            } else if (kind === 'formas') {
                ctx.beginPath(); ctx.rect(cx-size,cy-size,size*2,size*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx,cy,size*.8,0,Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx,cy-size*1.2); ctx.lineTo(cx-size,cy+size); ctx.lineTo(cx+size,cy+size); ctx.closePath(); ctx.stroke();
            } else {
                ctx.font = `italic ${Math.max(48, Math.min(120, size*1.1))}px "ComicNeueApp", "Comic Sans MS", cursive`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.strokeText(kind === 'cursiva' ? 'Aa Bb Cc' : 'A B C',cx,cy);
            }
            ctx.restore(); captureActivityTemplate(); saveState();
        }

        function createGraphicToolButtons() {
            const toolsMap = {
                'Desenho Básico': [
                    { id: 'pencil', icon: TOOL_ICONS['pencil'], name: 'Lápis / desenho livre' },
                    { id: 'select-move', icon: TOOL_ICONS['select-move'], name: 'Selecionar e mover' },
                    { id: 'line', icon: TOOL_ICONS['line'], name: 'Linha reta' },
                    { id: 'rectangle', icon: TOOL_ICONS['rectangle'], name: 'Retângulo' },
                    { id: 'circle', icon: TOOL_ICONS['circle'], name: 'Círculo / elipse' },
                    { id: 'polygon', icon: TOOL_ICONS['polygon'], name: 'Hexágono' },
                    { id: 'isosceles-triangle', icon: TOOL_ICONS['isosceles-triangle'], name: 'Triângulo isósceles' },
                    { id: 'equilateral-triangle', icon: TOOL_ICONS['equilateral-triangle'], name: 'Triângulo equilátero' },
                    { id: 'right-triangle', icon: TOOL_ICONS['right-triangle'], name: 'Triângulo retângulo' }
                ],
                'Mais formas geométricas': [
                    { id: 'pentagon', icon: TOOL_ICONS.pentagon, name: 'Pentágono' }, { id: 'hexagon', icon: TOOL_ICONS.hexagon, name: 'Hexágono regular' },
                    { id: 'star', icon: TOOL_ICONS.star, name: 'Estrela' }, { id: 'diamond', icon: TOOL_ICONS.diamond, name: 'Losango' },
                    { id: 'trapezoid', icon: TOOL_ICONS.trapezoid, name: 'Trapézio' }, { id: 'rounded-rectangle', icon: TOOL_ICONS['rounded-rectangle'], name: 'Retângulo arredondado' }
                ],
                'Linhas especiais e setas': [
                    { id: 'arrow', icon: TOOL_ICONS.arrow, name: 'Seta' }, { id: 'double-arrow', icon: TOOL_ICONS['double-arrow'], name: 'Seta dupla' },
                    { id: 'wavy-line', icon: TOOL_ICONS['wavy-line'], name: 'Linha ondulada' }
                ],
                'Figuras para colorir': [
                    { id: 'heart', icon: TOOL_ICONS.heart, name: 'Coração' }, { id: 'house', icon: TOOL_ICONS.house, name: 'Casa' },
                    { id: 'moon', icon: TOOL_ICONS.moon, name: 'Lua crescente' }, { id: 'butterfly', icon: TOOL_ICONS.butterfly, name: 'Borboleta' },
                    { id: 'tree', icon: TOOL_ICONS.tree, name: 'Árvore' }, { id: 'cup', icon: TOOL_ICONS.cup, name: 'Copo / caneca' },
                    { id: 'sun', icon: TOOL_ICONS.sun, name: 'Sol' }, { id: 'car', icon: TOOL_ICONS.car, name: 'Carro' }
                ]
            };
            graphicToolsGrid.innerHTML = '';
            for (const category in toolsMap) {
                const categoryDiv = document.createElement('div'); categoryDiv.className = 'tool-category';
                if (category !== 'Desenho Básico') categoryDiv.innerHTML = `<h4>${category}</h4>`;
                const groupDiv = document.createElement('div'); groupDiv.className = 'category-group';
                toolsMap[category].forEach(tool => groupDiv.appendChild(createToolButton(tool.id, tool.icon, tool.name)));
                categoryDiv.appendChild(groupDiv); graphicToolsGrid.appendChild(categoryDiv);
            }
            const addActionGroup = (title, build) => {
                const cat = document.createElement('div'); cat.className='tool-category';
                const h = document.createElement('h4'); h.textContent=title; cat.appendChild(h);
                const stack=document.createElement('div'); stack.className='category-group graphic-action-stack'; build(stack); cat.appendChild(stack); graphicToolsGrid.appendChild(cat); return stack;
            };
            addActionGroup('Preenchimento de formas', stack => {
                [['outline','Só contorno'],['fill','Só preenchimento'],['both','Preenchimento + contorno']].forEach(([mode,label])=>{
                    const b=addGraphicAction(stack,label,btn=>setShapeMode(mode,btn),shapeRenderMode===mode); b.dataset.shapeMode=mode;
                });
            });
            addActionGroup('Estilo de linha', stack => {
                [['solid','Contínua'],['dashed','Tracejada'],['dotted','Pontilhada']].forEach(([style,label])=>{
                    const b=addGraphicAction(stack,label,btn=>setLineStyle(style,btn),currentLineStyle===style); b.dataset.lineStyle=style;
                });
            });
            addActionGroup('Traço e alinhamento', stack => {
                addGraphicAction(stack, smoothingEnabled ? '✓ Suavização do traço ligada' : 'Suavização do traço', btn => {
                    smoothingEnabled=!smoothingEnabled; btn.classList.toggle('active',smoothingEnabled); btn.textContent=smoothingEnabled?'✓ Suavização do traço ligada':'Suavização do traço';
                }, smoothingEnabled);
                addGraphicAction(stack, gridGuidesEnabled ? '✓ Grade e guias ligadas' : 'Grade e guias de alinhamento', () => setGridGuides(!gridGuidesEnabled), gridGuidesEnabled).id='toggle-grid-guides';
            });
            addActionGroup('Biblioteca de figuras para colorir', stack => {
                [['Casa','house'],['Árvore','tree'],['Carro','car'],['Sol','sun'],['Borboleta','butterfly'],['Coração','heart']].forEach(([label,tool])=>addGraphicAction(stack,label,()=>loadFigureTemplate(label,tool)));
            });
            addActionGroup('Modelos para traçar', stack => {
                [['Linhas paralelas','linhas'],['Formas geométricas','formas'],['Letras de imprensa','letras'],['Letras cursivas','cursiva']].forEach(([label,kind])=>addGraphicAction(stack,label,()=>drawTracingTemplate(kind)));
            });
            addActionGroup('Papéis e pautas educativas', stack => {
                [['Pauta simples','simples'],['Pauta de caligrafia (3 linhas)','caligrafia'],['Papel quadriculado','quadriculado']].forEach(([label,kind])=>addGraphicAction(stack,label,()=>drawPaperTemplate(kind)));
                addGraphicAction(stack,'Remover pauta e grade do fundo',()=>{
                    paperTemplateName=null; libraryTemplateName=null; activityTemplateKey=null;
                    ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle=CANVAS_BG_COLOR; ctx.fillRect(0,0,canvas.width,canvas.height);
                    captureActivityTemplate(); saveState();
                });
            });
            graphicToolButton.textContent = TOOL_ICONS[currentTool] || '✏️';
            graphicToolButton.title = `Função Gráfica Ativa: ${currentTool} (Abre Menu)`;
            graphicToolButton.addEventListener('click', openGraphicModal);
            closeGraphicModalButton.addEventListener('click', closeGraphicModal);
        }

        window.addEventListener('load', () => {
            generateAndRenderPalette(); 
            createGraphicToolButtons(); 
            resizeCanvas();
            selectColor(currentColor);
            ctx.fillStyle = CANVAS_BG_COLOR; ctx.fillRect(0, 0, canvas.width, canvas.height);
            syncBaseCanvas();
            saveState(); 
        });
        
        window.addEventListener('resize', () => { resizeCanvas(); syncGuidesOverlay(); });
        window.addEventListener('orientationchange', () => requestAnimationFrame(() => { resizeCanvas(); syncGuidesOverlay(); }));

        lineWidthSlider.title = 'Espessura do traço e tamanho das esferas brilhantes';
        lineWidthSlider.setAttribute('aria-label', 'Espessura do traço e tamanho das esferas brilhantes');
        lineWidthSlider.addEventListener('input', (e) => {
            currentLineWidth = parseInt(e.target.value, 10) || 1;
            updateThicknessPreview();
        });
        
        closeColorModalButton.addEventListener('click', closeColorModal);

        function setupColorButtonEvents(btnElement) {
            let longPressTriggered = false;
            const cancelPress = () => clearTimeout(pressTimer);
            btnElement.addEventListener('pointerdown', () => {
                cancelPress();
                longPressTriggered = false;
                isBgColorSelection = false;
                pressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    isBgColorSelection = true;
                    openColorModal();
                }, 600);
            });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(eventName => {
                btnElement.addEventListener(eventName, cancelPress);
            });
            btnElement.addEventListener('click', () => {
                cancelPress();
                if (!longPressTriggered) {
                    isBgColorSelection = false;
                    openColorModal();
                }
                // O próximo clique começa sempre como seleção de cor do traço.
                longPressTriggered = false;
            });
        }

        setupColorButtonEvents(colorPaletteButton);
        setupColorButtonEvents(document.getElementById('act-color'));

        toolbar.addEventListener('click', (e) => {
            const button = e.target.closest('.tool-button');
            if (button) {
                const tool = button.getAttribute('data-tool');
                if (tool === 'bucket-fill' || tool === 'eraser') {
                    if (selectedImageData) commitSelection(lastX, lastY, true);
                    currentTool = tool; 
                    setActionToolActive(tool, true); 
                    canvas.style.cursor = (tool === 'bucket-fill') ? 'pointer' : 'crosshair';
                } else if (tool === 'fill-toggle') {
                    isFillMode = !isFillMode;
                    shapeRenderMode = isFillMode ? 'both' : 'outline';
                    document.querySelectorAll('[data-shape-mode]').forEach(b => b.classList.toggle('active', b.dataset.shapeMode === shapeRenderMode));
                    fillToggleButton.classList.toggle('active', isFillMode);
                    fillToggleButton.title = isFillMode ? 'Modo Preenchido Ativo' : 'Modo Contorno Ativo';
                    fillToggleButton.textContent = isFillMode ? '⬛' : '🔳';
                } else if (['fullscreen', 'clear', 'save', 'undo', 'redo'].includes(tool)) {
                    if (tool !== 'fullscreen' && tool !== 'redo' && selectedImageData) commitSelection(lastX, lastY, true);
                    if (tool === 'fullscreen') toggleFullScreen();
                    if (tool === 'clear') clearCanvas();
                    if (tool === 'save') saveImage();
                    if (tool === 'undo') undo(); 
                    if (tool === 'redo') redo(); 
                }
            }
        });
        
        function startDrawing(e) {
            if (colorPickerModal.classList.contains('visible') || graphicFunctionsModal.classList.contains('visible') || activitiesModal.classList.contains('visible')) return; 
            const pos = getMousePos(e);
            const x = pos.x, y = pos.y;

            if (currentActivityType && !['pintura', 'figuras'].includes(currentActivityType) && activityFontMode === 4) {
                isDrawing = true;
                lastX = x; lastY = y; startX = x; startY = y;
                beginMagicTrace(x, y);
                return;
            }
            
            if (currentTool === 'bucket-fill') {
                if (selectedImageData) commitSelection(lastX, lastY, true);
                floodFill(Math.floor(x), Math.floor(y));
                return;
            }
            
            isDrawing = true;
            lastX = x; lastY = y; startX = x; startY = y;
            
            if (currentTool === 'select-move') {
                if (selectedImageData) {
                    const rect = selectionRect;
                    if (x >= rect.x && x <= rect.x + rect.width && y >= rect.y && y <= rect.y + rect.height) {
                        isMoving = true; moveStartX = x; moveStartY = y;
                        canvas.style.cursor = 'grabbing';
                        return; 
                    } else {
                        commitSelection(lastX, lastY, true); 
                    }
                }
                isMoving = false; selectionRect = null; selectedImageData = null;
                canvas.style.cursor = 'crosshair';
            }
            
            if (currentTool === 'pencil' || currentTool === 'eraser') {
                const style = (currentTool === 'eraser') ? CANVAS_BG_COLOR : currentColor;
                ctx.beginPath();
                ctx.arc(lastX, lastY, currentLineWidth / 2, 0, Math.PI * 2);
                ctx.fillStyle = style;
                ctx.fill();
                ctx.lineWidth = currentLineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = style;
                ctx.setLineDash(currentTool === 'eraser' ? [] : currentLineStyle === 'dashed' ? [Math.max(7, currentLineWidth * 2.5), Math.max(4, currentLineWidth * 1.5)] : currentLineStyle === 'dotted' ? [1, Math.max(4, currentLineWidth * 1.7)] : []);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            const pos = getMousePos(e);
            const x = pos.x, y = pos.y;
            const shapeTools = ['line', 'arrow', 'double-arrow', 'wavy-line', 'rectangle', 'rounded-rectangle', 'circle', 'polygon', 'pentagon', 'hexagon', 'star', 'diamond', 'trapezoid', 'isosceles-triangle', 'equilateral-triangle', 'right-triangle', 'heart', 'house', 'moon', 'butterfly', 'tree', 'cup', 'sun', 'car', 'rainbow-tree'];

            if (magicGestureActive && currentActivityType && activityFontMode === 4) {
                if (magicLastPoint) traceMagicSegment(magicLastPoint, {x, y});
                magicLastPoint = {x, y};
                lastX = x; lastY = y;
                return;
            }

            if (currentTool === 'select-move' && isMoving && selectedImageData) {
                restoreBaseState(); 
                const dx = x - moveStartX, dy = y - moveStartY;
                const newX = Math.round(Math.max(0, Math.min(canvas.width - selectedImageData.width, selectionRect.x + dx)));
                const newY = Math.round(Math.max(0, Math.min(canvas.height - selectedImageData.height, selectionRect.y + dy)));
                ctx.putImageData(selectedImageData, newX, newY);
                drawSelectionBorder({ x: newX, y: newY, width: selectionRect.width, height: selectionRect.height });
                lastX = x; lastY = y;
                return;
            }
            
            if (currentTool === 'pencil' || currentTool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                if (currentTool === 'pencil' && smoothingEnabled) ctx.quadraticCurveTo(lastX, lastY, x, y);
                else ctx.lineTo(x, y);
                ctx.stroke();
                lastX = x; lastY = y;
            } else if (['select-move', ...shapeTools].includes(currentTool)) {
                restoreBaseState(); 
                if (currentTool === 'select-move') {
                    drawSelectionBorder({ x: startX, y: startY, width: x - startX, height: y - startY });
                } else {
                    drawShape(ctx, currentTool, startX, startY, x, y);
                }
                lastX = x; lastY = y;
            }
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            if (e && (e.clientX !== undefined || e.changedTouches)) {
                const endPos = getMousePos(e);
                if (Number.isFinite(endPos.x) && Number.isFinite(endPos.y)) { lastX = endPos.x; lastY = endPos.y; }
            }
            isDrawing = false;
            const finalX = lastX, finalY = lastY;
            const shapeTools = ['line', 'arrow', 'double-arrow', 'wavy-line', 'rectangle', 'rounded-rectangle', 'circle', 'polygon', 'pentagon', 'hexagon', 'star', 'diamond', 'trapezoid', 'isosceles-triangle', 'equilateral-triangle', 'right-triangle', 'heart', 'house', 'moon', 'butterfly', 'tree', 'cup', 'sun', 'car', 'rainbow-tree'];

            if (magicGestureActive) {
                finishMagicTrace();
                return;
            }

            if (currentTool === 'select-move' && isMoving) {
                commitSelection(finalX, finalY, true);
                return; 
            }
            
            if (currentTool === 'select-move') {
                const rectX = Math.min(startX, finalX), rectY = Math.min(startY, finalY);
                const rectW = Math.abs(finalX - startX), rectH = Math.abs(finalY - startY);
                if (rectW === 0 || rectH === 0) { restoreBaseState(); canvas.style.cursor = 'crosshair'; return; }

                restoreBaseState();
                const safeX = Math.max(0, Math.floor(rectX)), safeY = Math.max(0, Math.floor(rectY));
                const safeRight = Math.min(canvas.width, Math.ceil(rectX + rectW));
                const safeBottom = Math.min(canvas.height, Math.ceil(rectY + rectH));
                const safeW = safeRight - safeX, safeH = safeBottom - safeY;
                if (safeW <= 0 || safeH <= 0) return;
                selectedImageData = ctx.getImageData(safeX, safeY, safeW, safeH);
                selectionRect = { x: safeX, y: safeY, width: safeW, height: safeH };
                ctx.fillStyle = CANVAS_BG_COLOR;
                ctx.fillRect(safeX, safeY, safeW, safeH);
                syncBaseCanvas();
                ctx.putImageData(selectedImageData, safeX, safeY);
                drawSelectionBorder(selectionRect);
                canvas.style.cursor = 'grab';
                return;
            }

            if (shapeTools.includes(currentTool)) {
                restoreBaseState();
                drawShape(ctx, currentTool, startX, startY, finalX, finalY, true);
            } else if ((currentTool === 'pencil' || currentTool === 'eraser') && drawingMoved) {
                ctx.setLineDash([]);
            }
            ctx.setLineDash([]);
            saveState(); 
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            activePointerId = e.pointerId;
            drawingMoved = false;
            try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
            startDrawing(e);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (activePointerId !== null && e.pointerId !== activePointerId) return;
            if (isDrawing) drawingMoved = true;
            draw(e);
        });
        const finishPointer = (e) => {
            if (activePointerId !== null && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
            stopDrawing(e);
            if (activePointerId !== null) {
                try { if (canvas.hasPointerCapture(activePointerId)) canvas.releasePointerCapture(activePointerId); } catch (_) {}
            }
            activePointerId = null;
            if (resizePending) {
                resizePending = false;
                requestAnimationFrame(() => resizeCanvas());
            }
        };
        canvas.addEventListener('pointerup', finishPointer);
        canvas.addEventListener('pointercancel', finishPointer);
        canvas.addEventListener('lostpointercapture', (e) => {
            if (isDrawing) stopDrawing(e);
            activePointerId = null;
            if (resizePending) { resizePending = false; requestAnimationFrame(() => resizeCanvas()); }
        });

    </script>
</body>
