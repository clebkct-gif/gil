<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRMini - Gerador de QR Code Ultra Fluido</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRious Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Efeito zoom suave por pinça/mouse */
        #qrCanvasContainer {
            touch-action: none;
            overflow: hidden;
        }
        #qrCanvas {
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-slate-100 via-slate-50 to-indigo-50/30 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950/20 text-slate-800 dark:text-slate-100 transition-colors duration-300 flex flex-col justify-between overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Header Fluido sem bordas nas laterais -->
    <header class="w-full border-b border-slate-200/80 dark:border-slate-800/80 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl sticky top-0 z-50 px-4 sm:px-8">
        <div class="w-full mx-auto h-14 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 transform hover:scale-105 transition-transform">
                    <i data-lucide="qr-code" class="w-5 h-5"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">QRMini</span>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Botão Fullscreen -->
                <button id="fullscreenToggle" class="p-2.5 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-slate-700 dark:text-slate-300 shadow-sm" title="Alternar Tela Cheia">
                    <i data-lucide="maximize" id="fsIconExpand" class="w-4 h-4"></i>
                    <i data-lucide="minimize" id="fsIconCompress" class="w-4 h-4 hidden"></i>
                </button>
                <!-- Alternar Tema -->
                <button id="themeToggle" class="p-2.5 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-slate-700 dark:text-slate-300 shadow-sm" title="Alternar Tema">
                    <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal Edge-to-Edge -->
    <main class="flex-1 w-full px-3 sm:px-6 py-4">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start w-full">
            
            <!-- Esquerda: Painel de Controle Expandido -->
            <div class="lg:col-span-7 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-5 sm:p-6 shadow-xl shadow-slate-200/50 dark:shadow-none">
                
                <!-- Abas de Tipo de Conteúdo -->
                <div class="mb-5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 mb-2.5">Tipo de Conteúdo</label>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="tabList">
                        <button data-type="url" class="tab-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-indigo-600 bg-indigo-50/80 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 font-semibold transition-all shadow-sm">
                            <i data-lucide="link" class="w-5 h-5 mb-1.5"></i>
                            <span class="text-xs">Link</span>
                        </button>
                        <button data-type="text" class="tab-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 text-slate-600 dark:text-slate-400 font-semibold transition-all">
                            <i data-lucide="file-text" class="w-5 h-5 mb-1.5"></i>
                            <span class="text-xs">Texto</span>
                        </button>
                        <button data-type="wifi" class="tab-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 text-slate-600 dark:text-slate-400 font-semibold transition-all">
                            <i data-lucide="wifi" class="w-5 h-5 mb-1.5"></i>
                            <span class="text-xs">Wi-Fi</span>
                        </button>
                        <button data-type="whatsapp" class="tab-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 text-slate-600 dark:text-slate-400 font-semibold transition-all">
                            <i data-lucide="message-circle" class="w-5 h-5 mb-1.5"></i>
                            <span class="text-xs">Whats</span>
                        </button>
                        <button data-type="vcard" class="tab-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 text-slate-600 dark:text-slate-400 font-semibold transition-all">
                            <i data-lucide="user" class="w-5 h-5 mb-1.5"></i>
                            <span class="text-xs">Contato</span>
                        </button>
                        <button data-type="email" class="tab-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 text-slate-600 dark:text-slate-400 font-semibold transition-all">
                            <i data-lucide="mail" class="w-5 h-5 mb-1.5"></i>
                            <span class="text-xs">E-mail</span>
                        </button>
                    </div>
                </div>

                <!-- Formulários Dinâmicos com Fontes Maiores -->
                <div id="formContainer" class="space-y-4 mb-5">
                    <!-- URL -->
                    <div class="form-panel space-y-1.5" data-panel="url">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">URL do Site</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-indigo-500">
                                <i data-lucide="globe" class="w-5 h-5"></i>
                            </span>
                            <input type="url" id="input-url" placeholder="https://exemplo.com" class="w-full pl-11 pr-4 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium transition-all">
                        </div>
                    </div>

                    <!-- Texto -->
                    <div class="form-panel hidden space-y-1.5" data-panel="text">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Conteúdo em Texto</label>
                        <textarea id="input-text" rows="3" placeholder="Digite seu texto livre..." class="w-full p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium transition-all custom-scrollbar"></textarea>
                    </div>

                    <!-- Wi-Fi -->
                    <div class="form-panel hidden grid grid-cols-1 sm:grid-cols-3 gap-3" data-panel="wifi">
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Rede (SSID)</label>
                            <input type="text" id="wifi-ssid" placeholder="MinhaRede" class="w-full px-3.5 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Senha</label>
                            <input type="password" id="wifi-pass" placeholder="••••••••" class="w-full px-3.5 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Criptografia</label>
                            <select id="wifi-type" class="w-full px-3.5 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                                <option value="WPA">WPA/WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">Sem senha</option>
                            </select>
                        </div>
                    </div>

                    <!-- WhatsApp -->
                    <div class="form-panel hidden space-y-3" data-panel="whatsapp">
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Número (com DDD)</label>
                            <input type="text" id="wa-phone" placeholder="5511999999999" class="w-full px-3.5 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Mensagem Inicial</label>
                            <textarea id="wa-msg" rows="2" placeholder="Olá, gostaria de mais informações..." class="w-full p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium custom-scrollbar"></textarea>
                        </div>
                    </div>

                    <!-- vCard -->
                    <div class="form-panel hidden space-y-3" data-panel="vcard">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Nome</label>
                                <input type="text" id="vcard-fn" placeholder="João Silva" class="w-full px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 text-sm font-medium focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Telefone</label>
                                <input type="text" id="vcard-tel" placeholder="+5511999999999" class="w-full px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 text-sm font-medium focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">E-mail</label>
                                <input type="email" id="vcard-email" placeholder="joao@exemplo.com" class="w-full px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 text-sm font-medium focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Empresa</label>
                                <input type="text" id="vcard-org" placeholder="Empresa S.A." class="w-full px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 text-sm font-medium focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-panel hidden grid grid-cols-1 sm:grid-cols-2 gap-3" data-panel="email">
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">E-mail Destino</label>
                            <input type="email" id="email-addr" placeholder="contato@exemplo.com" class="w-full px-3.5 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Assunto</label>
                            <input type="text" id="email-sub" placeholder="Contato Inicial" class="w-full px-3.5 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                        </div>
                    </div>
                </div>

                <!-- Customização e Ajustes -->
                <div class="pt-4 border-t border-slate-100 dark:border-slate-800">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="flex items-center justify-between p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50">
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">Cor QR</span>
                            <div class="flex items-center space-x-2">
                                <span id="fgColorText" class="text-xs font-medium text-slate-500">#000000</span>
                                <input type="color" id="fgColor" value="#000000" class="w-7 h-7 rounded-xl border-0 cursor-pointer bg-transparent">
                            </div>
                        </div>
                        <div class="flex items-center justify-between p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50">
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">Fundo</span>
                            <div class="flex items-center space-x-2">
                                <span id="bgColorText" class="text-xs font-medium text-slate-500">#ffffff</span>
                                <input type="color" id="bgColor" value="#ffffff" class="w-7 h-7 rounded-xl border-0 cursor-pointer bg-transparent">
                            </div>
                        </div>
                        <div class="flex items-center justify-between p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50">
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">Tamanho</span>
                            <select id="qrResolution" class="bg-transparent text-sm font-bold text-indigo-600 dark:text-indigo-400 focus:outline-none">
                                <option value="256">256 px</option>
                                <option value="512" selected>512 px</option>
                                <option value="1024">1024 px</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Histórico Recente -->
                <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Histórico Recente</label>
                    <div id="historyList" class="flex flex-wrap gap-2">
                        <span class="text-xs text-slate-400 italic">Nenhum QR gerado recentemente</span>
                    </div>
                </div>

            </div>

            <!-- Direita: Visualizador Interativo com Suporte a Pinça/Zoom -->
            <div class="lg:col-span-5 lg:sticky lg:top-20">
                <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-5 sm:p-6 shadow-xl shadow-slate-200/50 dark:shadow-none flex flex-col items-center text-center">
                    
                    <div class="w-full flex justify-between items-center mb-4">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Visualização Interativa</span>
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 shadow-sm">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
                            Zoom Ativo (Pinça / Roda)
                        </span>
                    </div>

                    <!-- Canvas QR Code com Container Habilitado para Zoom -->
                    <div id="qrCanvasContainer" class="p-6 bg-gradient-to-b from-slate-50 to-slate-100/50 dark:from-slate-950 dark:to-slate-900/50 rounded-2xl border-2 border-slate-200/70 dark:border-slate-800 mb-5 shadow-inner flex items-center justify-center w-full min-h-[260px] relative cursor-grab active:cursor-grabbing">
                        <canvas id="qrCanvas" class="max-w-[230px] max-h-[230px] rounded-xl shadow-lg"></canvas>
                    </div>

                    <!-- Botões de Ação Dinâmicos com Feedback Visual -->
                    <div class="grid grid-cols-3 gap-2.5 w-full">
                        <button id="downloadPng" class="flex items-center justify-center space-x-1.5 py-3 px-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold text-xs transition-all shadow-lg shadow-indigo-600/30 active:scale-[0.97]">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            <span>PNG</span>
                        </button>
                        <button id="downloadSvg" class="flex items-center justify-center space-x-1.5 py-3 px-3 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold text-xs transition-all active:scale-[0.97] shadow-sm">
                            <i data-lucide="file-code" class="w-4 h-4"></i>
                            <span>SVG</span>
                        </button>
                        <button id="copyTextBtn" class="flex items-center justify-center space-x-1.5 py-3 px-3 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold text-xs transition-all active:scale-[0.97] shadow-sm" title="Copiar Texto/Link">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                            <span>Copiar</span>
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Rodapé Fluido -->
    <footer class="w-full py-3 text-center text-xs font-medium text-slate-400 dark:text-slate-600 border-t border-slate-200/60 dark:border-slate-800/60 bg-white/40 dark:bg-slate-900/40">
        <p>QRMini — Gerador de QR Code ultra fluido e responsivo.</p>
    </footer>

    <script>
        // Inicializar ícones Lucide
        lucide.createIcons();

        // Alternar Tema Escuro/Claro
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            htmlElement.classList.add('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
        });

        // Alternar Modo Fullscreen
        const fullscreenToggleBtn = document.getElementById('fullscreenToggle');
        const fsExpand = document.getElementById('fsIconExpand');
        const fsCompress = document.getElementById('fsIconCompress');

        fullscreenToggleBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                fsExpand.classList.add('hidden');
                fsCompress.classList.remove('hidden');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fsExpand.classList.remove('hidden');
                    fsCompress.classList.add('hidden');
                }
            }
        });

        // Instância QRious
        const qrCanvas = document.getElementById('qrCanvas');
        const qr = new QRious({
            element: qrCanvas,
            size: 230,
            level: 'H',
            value: 'https://exemplo.com'
        });

        // Lógica de Zoom e Pinça (Pinch-to-Zoom e Scroll)
        let scale = 1;
        const container = document.getElementById('qrCanvasContainer');
        
        // Suporte a Mouse Wheel Zoom
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale += e.deltaY * -0.001;
            scale = Math.min(Math.max(0.8, scale), 2.5);
            qrCanvas.style.transform = `scale(${scale})`;
        }, { passive: false });

        // Suporte a Touch Pinça (Pinch-to-Zoom)
        let initialDist = null;
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDist !== null) {
                e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = currentDist / initialDist;
                scale = Math.min(Math.max(0.8, scale * factor), 3.0);
                qrCanvas.style.transform = `scale(${scale})`;
                initialDist = currentDist;
            }
        }, { passive: false });

        container.addEventListener('touchend', () => {
            initialDist = null;
        });

        // Estado do Formulário e Abas
        let currentType = 'url';
        const tabButtons = document.querySelectorAll('.tab-btn');
        const formPanels = document.querySelectorAll('.form-panel');

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.getAttribute('data-type');
                currentType = type;

                tabButtons.forEach(b => {
                    b.classList.remove('border-indigo-600', 'bg-indigo-50/80', 'dark:bg-indigo-950/40', 'text-indigo-600', 'dark:text-indigo-400');
                    b.classList.add('border-slate-200', 'dark:border-slate-800', 'text-slate-600', 'dark:text-slate-400');
                });
                btn.classList.remove('border-slate-200', 'dark:border-slate-800', 'text-slate-600', 'dark:text-slate-400');
                btn.classList.add('border-indigo-600', 'bg-indigo-50/80', 'dark:bg-indigo-950/40', 'text-indigo-600', 'dark:text-indigo-400');

                formPanels.forEach(panel => {
                    if (panel.getAttribute('data-panel') === type) {
                        panel.classList.remove('hidden');
                    } else {
                        panel.classList.add('hidden');
                    }
                });

                updateQRCode();
            });
        });

        // Formatação de Dados do QR
        function getQRContent() {
            switch(currentType) {
                case 'url':
                    return document.getElementById('input-url').value.trim() || 'https://exemplo.com';
                case 'text':
                    return document.getElementById('input-text').value || 'Texto livre';
                case 'wifi':
                    const ssid = document.getElementById('wifi-ssid').value;
                    const pass = document.getElementById('wifi-pass').value;
                    const type = document.getElementById('wifi-type').value;
                    return `WIFI:S:${ssid};T:${type};P:${pass};;`;
                case 'whatsapp':
                    const phone = document.getElementById('wa-phone').value.replace(/\D/g,'');
                    const msg = encodeURIComponent(document.getElementById('wa-msg').value);
                    return `https://wa.me/${phone}${msg ? '?text=' + msg : ''}`;
                case 'vcard':
                    const fn = document.getElementById('vcard-fn').value;
                    const tel = document.getElementById('vcard-tel').value;
                    const email = document.getElementById('vcard-email').value;
                    const org = document.getElementById('vcard-org').value;
                    return `BEGIN:VCARD\nVERSION:3.0\nFN:${fn}\nTEL:${tel}\nEMAIL:${email}\nORG:${org}\nEND:VCARD`;
                case 'email':
                    const addr = document.getElementById('email-addr').value;
                    const sub = encodeURIComponent(document.getElementById('email-sub').value);
                    return `mailto:${addr}?subject=${sub}`;
                default:
                    return 'https://exemplo.com';
            }
        }

        // Atualização em Tempo Real
        function updateQRCode() {
            const content = getQRContent();
            const fg = document.getElementById('fgColor').value;
            const bg = document.getElementById('bgColor').value;

            document.getElementById('fgColorText').textContent = fg;
            document.getElementById('bgColorText').textContent = bg;

            qr.set({
                value: content,
                foreground: fg,
                background: bg
            });
            
            saveToHistoryDebounced(content);
        }

        // Histórico Recente no LocalStorage
        let history = JSON.parse(localStorage.getItem('qr_mini_history') || '[]');
        
        function updateHistoryUI() {
            const historyContainer = document.getElementById('historyList');
            if (history.length === 0) {
                historyContainer.innerHTML = `<span class="text-xs text-slate-400 italic">Nenhum QR gerado recentemente</span>`;
                return;
            }

            historyContainer.innerHTML = '';
            history.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-xs font-medium text-slate-600 dark:text-slate-400 hover:border-indigo-500 hover:text-indigo-600 truncate max-w-[180px] transition-all shadow-sm';
                btn.textContent = item;
                btn.title = item;
                btn.addEventListener('click', () => {
                    document.getElementById('input-url').value = item;
                    document.querySelector('[data-type="url"]').click();
                });
                historyContainer.appendChild(btn);
            });
        }

        let historyTimeout;
        function saveToHistoryDebounced(content) {
            clearTimeout(historyTimeout);
            historyTimeout = setTimeout(() => {
                if (content && content !== 'https://exemplo.com' && !history.includes(content)) {
                    history.unshift(content);
                    if (history.length > 5) history.pop();
                    localStorage.setItem('qr_mini_history', JSON.stringify(history));
                    updateHistoryUI();
                }
            }, 1000);
        }

        // Event Listeners Globais
        const allInputs = document.querySelectorAll('input, textarea, select');
        allInputs.forEach(input => {
            input.addEventListener('input', updateQRCode);
            input.addEventListener('change', updateQRCode);
        });

        // Download PNG com Resolução Ajustável
        document.getElementById('downloadPng').addEventListener('click', () => {
            const targetSize = parseInt(document.getElementById('qrResolution').value, 10);
            
            const tempCanvas = document.createElement('canvas');
            new QRious({
                element: tempCanvas,
                size: targetSize,
                level: 'H',
                value: getQRContent(),
                foreground: document.getElementById('fgColor').value,
                background: document.getElementById('bgColor').value
            });

            const link = document.createElement('a');
            link.download = `qrmini-${targetSize}px.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        });

        // Download SVG
        document.getElementById('downloadSvg').addEventListener('click', () => {
            const canvas = document.getElementById('qrCanvas');
            const bg = document.getElementById('bgColor').value;

            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${canvas.width} ${canvas.height}" width="100%" height="100%">
                <rect width="100%" height="100%" fill="${bg}"/>
                <image href="${canvas.toDataURL()}" width="100%" height="100%"/>
            </svg>`;

            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'qrmini.svg';
            link.click();
            URL.revokeObjectURL(url);
        });

        // Copiar Texto com Feedback Visual Imediato
        document.getElementById('copyTextBtn').addEventListener('click', () => {
            const content = getQRContent();
            navigator.clipboard.writeText(content).then(() => {
                const btn = document.getElementById('copyTextBtn');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-emerald-500"></i><span class="text-emerald-500">Copiado!</span>`;
                lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    lucide.createIcons();
                }, 1500);
            });
        });

        // Inicialização
        updateHistoryUI();
        updateQRCode();
    </script>
</body>
</html>
