<style>

.pulse .day.today{animation:pl 1.6s ease-in-out infinite}

.wkon .wd,.wkon .days{grid-template-columns:2.4em repeat(7,1fr)}
.wk{display:grid;place-items:center;font-family:var(--ff);font-size:.7rem;color:var(--wc);opacity:.8}

.day.hol .dn{color:var(--hc)}.day.wke .dn{color:var(--wkc)}.day.today .dn{color:var(--tdc)}

.lay-corner .day,.lay-grid .day{align-items:flex-start}.lay-corner .dn,.lay-grid .dn{margin-left:3px}.lay-corner .nt,.lay-grid .nt,.lay-corner .hl,.lay-grid .hl{text-align:left}

.mm{background:var(--cbg);backdrop-filter:blur(var(--blur));border-radius:var(--rad);padding:8px;box-shadow:0 4px var(--sh) rgba(0,0,0,.4);position:relative;cursor:pointer;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mm::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:var(--bw);background:var(--bgrad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
.mm h4{font-family:var(--tf);color:var(--tc);font-size:.9rem;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.mm .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-family:var(--ff);font-size:.66rem;color:var(--dc);flex:1;align-content:space-around}
.mm .l{opacity:.5;font-size:.58rem}.mm .x.t{background:var(--tdc);color:#000;border-radius:50%}.mm .x.hol{color:var(--hc);font-weight:700}.mm .x.wke{color:var(--wkc)}.mm .x.kr{box-shadow:inset 0 -2px var(--ir)}.mm .x.kw{box-shadow:inset 0 -2px var(--iw)}.mm .x.kn{opacity:.45}
.days.year{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);overflow:auto}

#md label{font-size:.85rem;display:flex;gap:8px;align-items:center}

    if(hv&&s.hname){c.font=`600 ${Math.max(8,dp*.3)}px ${F[s.ff]}`;c.fillStyle=s.hc;c.fillText(ho.n.slice(0,20),cx0+cw/2,yy);yy+=dp*.4}

    if(col&&s.ih>0){const ih=s.ih*k,pad=5*k;rr(c,cx0+pad,cy0+ch-pad-ih,cw-2*pad,ih,ih/2);c.fillStyle=col;c.shadowColor=col;c.shadowBlur=6*k;c.fill();c.shadowBlur=0}
  }
}
async function exportPNG(mode){
  toast('Gerando imagem...');
  try{await Promise.all([document.fonts.load(`${S.fw} 20px ${F[S.ff]}`),document.fonts.load(`${S.fw} 20px ${F[S.tf||S.ff]}`)])}catch(e){}
  const s=S,mk=s.exm?marks:{},img=s.img?await loadImg(s.img):null,yr=mode==='y',W=yr?2400:1600,H=yr?1800:1000,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');paintBg(c,s,img,W,H);
  if(!yr)drawMonth(c,s,Y,M,mk,0,0,W,H);
  else{c.textBaseline='top';c.fillStyle=s.tc;c.font=`${s.fw} 80px ${F[s.tf||s.ff]}`;c.textAlign='left';c.fillText(String(Y),60,24);
    for(let m=0;m<12;m++)drawMonth(c,s,Y,m,mk,(m%4)*(W/4),130+((m/4)|0)*((H-130)/3),W/4,(H-130)/3)}
  cv.toBlob(b=>{const u=URL.createObjectURL(b),nm=yr?`calendario-${Y}.png`:`calendario-${Y}-${String(M+1).padStart(2,'0')}.png`;window._png=b;window._pn=nm;
    modal(`<h3>${yr?'Ano '+Y:MN[M]+' '+Y}</h3><img src="${u}" style="max-width:100%;max-height:55vh;border-radius:8px"><div class="row"><button onclick="saveFile(window._pn,window._png)">Baixar PNG</button><button onclick="closeModal()">Fechar</button></div><p class="sm">Se o download não abrir, toque e segure a imagem para salvar.</p>`)});
}

buildPanel();$('tg').innerHTML=TGI;layoutPanel();
makeFX($('fx'),()=>S,()=>{S.elec=0;S.spark=0;syncUI();toast('Efeitos desligados: o aparelho ficou lento')});
setTheme(0);
